# Shared release template.
#
# Consumers extend this and supply their repository, commit and policy. The tool never
# pushes: `1ES.PublishNuget@1` performs every upload, and `darc` performs every mutation.
# See docs/design.md sections 3, 4 and 7.

parameters:
- name: ghOwner
  type: string
  default: dotnet

- name: ghRepo
  type: string

- name: commitHash
  displayName: Exact source commit registered in BAR
  type: string

- name: barBuildId
  displayName: "[OPTIONAL] BAR build ID, for builds BAR records without a GitHub URL"
  type: string
  default: skip

- name: isWorkload
  type: boolean
  default: false

# When false the publish stages are not emitted at all, so a dry run is structurally
# incapable of publishing rather than merely flag-gated.
- name: pushPackages
  type: boolean
  default: false

- name: pushWorkloadSet
  displayName: Promote the build to its workload-set channel
  type: boolean
  default: false

- name: nugetIncludeFilters
  type: string
  default: skip

- name: nugetExcludeFilters
  type: string
  default: skip

- name: nugetRecoveryFilters
  displayName: "[RECOVERY] Packages a previous run already submitted to NuGet.org"
  type: string
  default: skip

- name: policyPath
  type: string
  default: config/repositories.json

- name: maestroServiceConnection
  type: string
  default: "Darc: Maestro Production"

- name: nugetServiceConnection
  type: string
  default: nuget.org (dotnetframework)

# The tool is published self-contained, so the publish agent's OS must match. Both jobs run
# on the same 1ES Windows pool by default.
- name: toolRuntimeIdentifier
  type: string
  default: win-x64

- name: toolFileName
  type: string
  default: release.exe

variables:
- name: toolRuntimeIdentifier
  value: ${{ parameters.toolRuntimeIdentifier }}
- name: toolFileName
  value: ${{ parameters.toolFileName }}

stages:

# ---------------------------------------------------------------------------------------
# Prepare. Three steps, each with one responsibility, so a failure is attributable.
# ---------------------------------------------------------------------------------------
- stage: prepare_release
  displayName: Prepare release artifacts
  dependsOn: []
  jobs:
  - job: prepare_release
    displayName: Resolve, gather and stage
    timeoutInMinutes: 240
    workspace:
      clean: all
    templateContext:
      outputs:
      - ${{ if eq(parameters.isWorkload, true) }}:
        - output: pipelineArtifact
          displayName: Publish workload packs
          targetPath: $(Build.ArtifactStagingDirectory)/ReleasePacks
          artifactName: ReleasePacks
        - output: pipelineArtifact
          displayName: Publish workload manifests
          targetPath: $(Build.ArtifactStagingDirectory)/ReleaseManifests
          artifactName: ReleaseManifests
      - ${{ else }}:
        - output: pipelineArtifact
          displayName: Publish release packages
          targetPath: $(Build.ArtifactStagingDirectory)/ReleasePackages
          artifactName: ReleasePackages
    steps:
    - checkout: self
      clean: true
      persistCredentials: false

    # The tool must be built here and travel in the artifact: the publish job runs
    # `checkout: none`, so it has no other source for it. Self-contained single-file means
    # the hash recorded in the plan covers the whole tool rather than a launcher stub.
    - pwsh: |
        $toolDirectory = "$(Build.StagingDirectory)/tool"
        dotnet publish "$(Build.SourcesDirectory)/src/DotNet.Release.Cli/DotNet.Release.Cli.csproj" `
          --configuration Release `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:RuntimeIdentifier=$(toolRuntimeIdentifier) `
          --output $toolDirectory
        if ($LASTEXITCODE -ne 0) { throw "Failed to publish the release tool." }

        $toolFile = Join-Path $toolDirectory $(toolFileName)
        if (!(Test-Path -LiteralPath $toolFile)) { throw "Published tool '$toolFile' was not found." }

        Write-Host "##vso[task.setvariable variable=toolPath]$toolFile"
      displayName: Build the release tool

    - task: AzureCLI@2
      name: releasePlan
      displayName: Resolve and verify the BAR build
      inputs:
        azureSubscription: ${{ parameters.maestroServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        # `release plan` emits the BarId output variable, which the gather step below needs.
        # That is the only pipeline variable the tool sets from this verb.
        inlineScript: |
          $barId = if ('${{ parameters.barBuildId }}' -ne 'skip') { '--bar-id', '${{ parameters.barBuildId }}' } else { @() }
          & "$(toolPath)" plan `
            --config "$(Build.SourcesDirectory)/${{ parameters.policyPath }}" `
            --repo "${{ parameters.ghOwner }}/${{ parameters.ghRepo }}" `
            --commit "${{ parameters.commitHash }}" `
            --out "$(Build.StagingDirectory)/stage" `
            @barId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - task: AzureCLI@2
      displayName: Gather the drop
      inputs:
        azureSubscription: ${{ parameters.maestroServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        # darc owns feed discovery, authentication, retries and --include-released.
        # Invoked here so Azure DevOps owns the exit code and --verbose lands in this log.
        inlineScript: |
          . $(Build.SourcesDirectory)/eng/common/tools.ps1
          $darc = Get-Darc
          & $darc gather-drop --ci `
            --id $(releasePlan.BarId) `
            -o "$(Build.StagingDirectory)/drop" `
            --azdev-pat $(System.AccessToken) `
            --include-released `
            --asset-filter '^[^/]+$' `
            --verbose
          if ($LASTEXITCODE -ne 0) { throw "darc gather-drop failed for BAR build $(releasePlan.BarId)." }

    - pwsh: |
        & "$(toolPath)" stage `
          --config "$(Build.SourcesDirectory)/${{ parameters.policyPath }}" `
          --plan "$(Build.StagingDirectory)/stage/plan.json" `
          --drop "$(Build.StagingDirectory)/drop" `
          --out "$(Build.ArtifactStagingDirectory)" `
          --include '${{ parameters.nugetIncludeFilters }}' `
          --exclude '${{ parameters.nugetExcludeFilters }}' `
          --tool "$(toolPath)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Validate and stage packages

    - pwsh: |
        # The pipeline computes the pin itself rather than trusting the tool to declare it.
        $planPath = "$(Build.ArtifactStagingDirectory)/release-plan.json"
        $hash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
        Write-Host "##vso[task.setvariable variable=ReleasePlanHash;isOutput=true]$hash"
      name: pinPlan
      displayName: Pin the release plan hash

# ---------------------------------------------------------------------------------------
# Promote to the workload-set channel. A BAR mutation, so it stays an explicit darc step.
# ---------------------------------------------------------------------------------------
- ${{ if and(eq(parameters.isWorkload, true), eq(parameters.pushWorkloadSet, true), eq(parameters.pushPackages, true)) }}:
  - stage: promote_workload_set
    displayName: Promote to workload set channel
    dependsOn: prepare_release
    jobs:
    - job: promote
      displayName: Add build to workload set channel
      timeoutInMinutes: 60
      templateContext:
        inputs:
        - input: pipelineArtifact
          artifactName: ReleaseManifests
          targetPath: $(Pipeline.Workspace)/ReleaseManifests
      steps:
      - checkout: self
        clean: true
        persistCredentials: false

      - task: AzureCLI@2
        displayName: Add build to channel
        inputs:
          azureSubscription: ${{ parameters.maestroServiceConnection }}
          scriptType: pscore
          scriptLocation: inlineScript
          # Channel and feed are read from the plan, not threaded through pipeline
          # variables, so there is one source of truth for the release.
          inlineScript: |
            . $(Build.SourcesDirectory)/eng/common/tools.ps1
            $plan = Get-Content "$(Pipeline.Workspace)/ReleaseManifests/release-plan.json" -Raw | ConvertFrom-Json
            $darc = Get-Darc
            & $darc add-build-to-channel --ci `
              --channel "$($plan.workloadSet.channel)" `
              --id "$($plan.source.barBuildId)" `
              --skip-assets-publishing `
              --azdev-pat $(System.AccessToken) --verbose
            if ($LASTEXITCODE -ne 0) { throw "darc add-build-to-channel failed." }

# ---------------------------------------------------------------------------------------
# Publish. Emitted only when pushPackages is true, so a dry run has no publish stage at all.
# ---------------------------------------------------------------------------------------
- ${{ if eq(parameters.pushPackages, true) }}:
  - ${{ if eq(parameters.isWorkload, true) }}:
    - template: publish-set.yml
      parameters:
        stageName: publish_packs
        displayName: Release workload packs
        artifactName: ReleasePacks
        dependsOn: [prepare_release]
        approvalInstructions: 'Review release-plan.json, then press "Resume" to push workload packs to NuGet.org.'
        nugetServiceConnection: ${{ parameters.nugetServiceConnection }}
        recoveryFilters: ${{ parameters.nugetRecoveryFilters }}

    # A stage dependency, not a job dependency: manifests reference packs, and NuGet.org
    # packages are immutable, so manifest approval must be unreachable until pack
    # verification has succeeded.
    - template: publish-set.yml
      parameters:
        stageName: publish_manifests
        displayName: Release workload manifests
        artifactName: ReleaseManifests
        dependsOn: [prepare_release, publish_packs]
        approvalInstructions: 'Packs are verified on NuGet.org. Press "Resume" to push workload manifests.'
        nugetServiceConnection: ${{ parameters.nugetServiceConnection }}
        recoveryFilters: ${{ parameters.nugetRecoveryFilters }}

  - ${{ else }}:
    - template: publish-set.yml
      parameters:
        stageName: publish_packages
        displayName: Release NuGet packages
        artifactName: ReleasePackages
        dependsOn: [prepare_release]
        approvalInstructions: 'Review release-plan.json, then press "Resume" to publish its exact staged package list.'
        nugetServiceConnection: ${{ parameters.nugetServiceConnection }}
        recoveryFilters: ${{ parameters.nugetRecoveryFilters }}
