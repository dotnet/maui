# Template for running tests on Helix on dnceng
parameters:
- name: prepareSteps
  type: stepList
  default: []
- name: postSteps
  type: stepList
  default: []
- name: enableSourceBuild
  type: boolean
  default: false
- name: enableSourceIndex
  type: boolean
  default: false
- name: sourceIndexParams
  type: object
  default: []
- name: publishAssets
  type: boolean
  default: false
- name: enableMicrobuild
  type: boolean
  default: false
- name: runAsPublic
  type: boolean
  default: true
- name: helixInternal
  type: string
  default: ''
- name: HelixAccessToken
  type: string
  default: ''
- name: creator
  type: string
  default: 'maui'
- name: extraHelixArguments
  type: string
  default: ''
- name: buildTaskProjects
  type: string
  default: '$(Build.SourcesDirectory)/Microsoft.Maui.BuildTasks.slnf'
- name: helixProject
  type: string
  default: '$(Build.SourcesDirectory)/eng/helix.proj'
- name: buildConfigurations
  type: object
  default:
  - Debug
  - Release
- name: helixJobMonitorVersion
  type: string
  default: 11.0.0-beta.26425.2
- name: helixJobMonitorTimeoutInMinutes
  type: number
  default: 360
- name: helixPool
  type: object
 
stages:
- stage: HelixTests
  displayName: Run Helix Unit Tests
  dependsOn: []
  jobs:
  - ${{ each BuildConfiguration in parameters.buildConfigurations }}:
    - template: ${{ iif(eq(parameters.runAsPublic, 'true'), '/eng/common/templates/jobs/jobs.yml@self', '/eng/common/templates-official/jobs/jobs.yml@self') }}
      parameters:
        helixRepo: dotnet/maui
        pool: ${{ parameters.helixPool }}
        enableMicrobuild: ${{ parameters.enableMicrobuild }}
        enablePublishUsingPipelines: true
        enablePublishBuildAssets: ${{ parameters.publishAssets }}
        enableTelemetry: true
        enableSourceBuild: ${{ parameters.enableSourceBuild }}
        enableSourceIndex: ${{ parameters.enableSourceIndex }}
        sourceIndexParams: ${{ parameters.sourceIndexParams }}
        publishAssetsImmediately: true
        enablePublishBuildArtifacts: true
        enablePublishTestResults: false
        workspace:
          clean: all
        jobs:
        - job: test_helix_unit_tests_windows_${{ BuildConfiguration }}
          displayName: Windows Helix Unit Tests (${{ BuildConfiguration }})
          timeoutInMinutes: 240
          variables:
          - name: _BuildConfig
            value: ${{ BuildConfiguration }}
          steps:
          - ${{ each step in parameters.prepareSteps }}:
            - ${{ each pair in step }}:
                ${{ pair.key }}: ${{ pair.value }}

          - script: dotnet cake --target=dotnet-buildtasks --configuration="${{ BuildConfiguration }}" --verbosity=diagnostic
            displayName: 🛠️ Provision SDK & Build BuildTasks
            retryCountOnTaskFailure: 3
            env:
              DOTNET_TOKEN: $(dotnetbuilds-internal-container-read-token)
              PRIVATE_BUILD: $(PrivateBuild)

          - script: $(_msbuildCommand) "${{ parameters.helixProject }}" -warnAsError 0 -restore /p:Configuration=${{ BuildConfiguration }} /p:EnableHelixJobMonitor=true /p:HelixInternal="${{ parameters.helixInternal }}" /p:TestRunNameSuffix="_${{ BuildConfiguration }}" /p:SkipInitInternalTooling=true /bl:$(Build.Arcade.LogsPath)${{ BuildConfiguration }}/helix_tests.binlog ${{ parameters.extraHelixArguments }}
            displayName: Run Helix Tests
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              HelixAccessToken: ${{ parameters.HelixAccessToken }}

  - job: HelixJobMonitor
    displayName: Monitor Helix Jobs
    timeoutInMinutes: ${{ parameters.helixJobMonitorTimeoutInMinutes }}
    pool:
      ${{ if eq(variables['System.TeamProject'], 'public') }}:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.azurelinux.3.amd64.open
      ${{ else }}:
        name: $(DncEngInternalBuildPool)
        demands: ImageOverride -equals build.azurelinux.3.amd64
    steps:
    - checkout: self
      fetchDepth: 1

    - bash: |
        set -euo pipefail

        toolPath="$AGENT_TEMPDIRECTORY/helix-job-monitor"
        bash ./eng/common/dotnet.sh
        toolVersion="${HELIX_JOB_MONITOR_VERSION:-}"
        if [[ -z "$toolVersion" || "$toolVersion" =~ [[:space:]] ]]; then
          printf 'The helixJobMonitorVersion parameter must be non-empty and contain no whitespace; received %q.\n' "$toolVersion" >&2
          exit 1
        fi

        bash ./eng/common/dotnet.sh tool install \
          --tool-path "$toolPath" \
          Microsoft.DotNet.Helix.JobMonitor \
          --version "$toolVersion"

        toolDll=$(find "$toolPath/.store" -path '*/tools/*/any/Microsoft.DotNet.Helix.JobMonitor.dll' -type f -print -quit)
        if [ ! -f "$toolDll" ]; then
          echo "Could not find the Helix Job Monitor DLL in '$toolPath/.store'." >&2
          exit 1
        fi

        echo "##vso[task.setvariable variable=HelixJobMonitorDll]$toolDll"
      displayName: Install Helix Job Monitor
      env:
        HELIX_JOB_MONITOR_VERSION: ${{ parameters.helixJobMonitorVersion }}

    - bash: |
        set -euo pipefail

        monitorDeadline=$((SECONDS + (${{ parameters.helixJobMonitorTimeoutInMinutes }} - 5) * 60))
        monitorAttempt=1
        monitorResult=0

        # Upload failures do not affect the upstream tool's exit code. Replay untagged jobs until every upload is durable.
        while true; do
          remainingSeconds=$((monitorDeadline - SECONDS))
          if ((remainingSeconds <= 0)); then
            echo "The Helix Job Monitor exhausted its retry window with untagged uploads remaining." >&2
            exit 1
          fi

          remainingMinutes=$(((remainingSeconds + 59) / 60))
          monitorLog="$AGENT_TEMPDIRECTORY/helix-job-monitor-attempt-$monitorAttempt.log"

          set +e
          bash ./eng/common/dotnet.sh exec "$(HelixJobMonitorDll)" \
            --helix-base-uri 'https://helix.dot.net/' \
            --polling-interval-seconds 30 \
            --fail-on-failed-tests true \
            --max-wait-minutes "$remainingMinutes" \
            --stage-name '$(System.StageName)' \
            --organization dotnet \
            --repository maui \
            --build-reason '$(Build.Reason)' \
            --source-branch '$(Build.SourceBranch)' 2>&1 | tee "$monitorLog"
          monitorExitCode=${PIPESTATUS[0]}
          set -e

          uploadSummary=$(grep -Eo '[0-9]+ job upload\(s\) remain untagged\.' "$monitorLog" | tail -n 1 || true)
          if [[ ! "$uploadSummary" =~ ^([0-9]+)\ job\ upload\(s\)\ remain\ untagged\.$ ]]; then
            if ((monitorExitCode != 0)); then
              exit "$monitorExitCode"
            fi

            echo "The Helix Job Monitor did not report its durable upload state." >&2
            exit 1
          fi

          if ((monitorExitCode != 0 && monitorResult == 0)); then
            monitorResult=$monitorExitCode
          fi

          untaggedUploads=${BASH_REMATCH[1]}
          if ((untaggedUploads == 0)); then
            exit "$monitorResult"
          fi

          echo "##vso[task.logissue type=warning]Replaying $untaggedUploads untagged Helix job upload(s)."
          monitorAttempt=$((monitorAttempt + 1))
          sleep 30
        done
      displayName: Monitor Helix Jobs
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        HELIX_ACCESSTOKEN: ${{ parameters.HelixAccessToken }}
