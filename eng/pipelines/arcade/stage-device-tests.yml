parameters:
  androidPool: {}
  windowsPool: {}
  applePools: []
  TargetFrameworkVersion: net11.0
  BuildConfiguration: Release
  runWindowsTests: true
  windowsPackaging: both
  requireWindows11: false
  runtimes:
  - name: coreclr
    useCoreClr: true
  - name: mono
    useCoreClr: false
  projects:
  - name: controls
    path: src/Controls/tests/DeviceTests/Controls.DeviceTests.csproj
    applicationId: com.microsoft.maui.controls.devicetests
  - name: core
    path: src/Core/tests/DeviceTests/Core.DeviceTests.csproj
    applicationId: com.microsoft.maui.core.devicetests
  - name: graphics
    path: src/Graphics/tests/DeviceTests/Graphics.DeviceTests.csproj
    applicationId: com.microsoft.maui.graphics.devicetests
  - name: essentials
    path: src/Essentials/test/DeviceTests/Essentials.DeviceTests.csproj
    applicationId: com.microsoft.maui.essentials.devicetests
  - name: blazorwebview
    path: src/BlazorWebView/tests/DeviceTests/MauiBlazorWebView.DeviceTests.csproj
    applicationId: com.microsoft.maui.mauiblazorwebview.devicetests

stages:
- stage: DeviceTests_${{ replace(parameters.TargetFrameworkVersion, '.', '') }}
  displayName: ${{ parameters.TargetFrameworkVersion }} direct device tests
  dependsOn: []
  jobs:
  - ${{ each project in parameters.projects }}:
    - ${{ each runtime in parameters.runtimes }}:
      - job: android_${{ project.name }}_${{ runtime.name }}
        displayName: Android API 33 ${{ project.name }} ${{ runtime.name }}
        pool: ${{ parameters.androidPool }}
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 15
        steps:
        - template: /eng/pipelines/common/device-tests-steps.yml@self
          parameters:
            platform: android
            path: $(Build.SourcesDirectory)/${{ project.path }}
            apiVersion: '33'
            deviceTestConfiguration: ${{ parameters.BuildConfiguration }}
            targetFrameworkVersion: ${{ parameters.TargetFrameworkVersion }}
            useCoreClr: ${{ runtime.useCoreClr }}
            expectedArchitecture: X64

    - ${{ each apple in parameters.applePools }}:
      - ${{ each runtime in parameters.runtimes }}:
        - ${{ each shard in split(iif(eq(project.name, 'controls'), 'CollectionView;Shell;HybridWebView;General', 'All'), ';') }}:
          - job: ios_${{ project.name }}_${{ runtime.name }}_${{ apple.name }}_${{ shard }}
            displayName: iOS ${{ project.name }} ${{ runtime.name }} ${{ apple.name }} ${{ shard }}
            pool: ${{ apple.pool }}
            timeoutInMinutes: 120
            cancelTimeoutInMinutes: 15
            steps:
            - template: /eng/pipelines/common/device-tests-steps.yml@self
              parameters:
                platform: ios
                applicationId: ${{ project.applicationId }}
                path: $(Build.SourcesDirectory)/${{ project.path }}
                apiVersion: latest
                deviceTestConfiguration: ${{ parameters.BuildConfiguration }}
                targetFrameworkVersion: ${{ parameters.TargetFrameworkVersion }}
                useCoreClr: ${{ runtime.useCoreClr }}
                expectedOSMajor: ${{ apple.osMajor }}
                expectedArchitecture: Arm64
                ${{ if eq(shard, 'General') }}:
                  testFilter: SkipCategories=CollectionView,Shell,HybridWebView
                ${{ elseif ne(shard, 'All') }}:
                  testFilter: Category=${{ shard }}

      - job: catalyst_${{ project.name }}_${{ apple.name }}
        displayName: Catalyst ${{ project.name }} CoreCLR ${{ apple.name }}
        pool: ${{ apple.pool }}
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 15
        steps:
        - template: /eng/pipelines/common/device-tests-steps.yml@self
          parameters:
            platform: catalyst
            path: $(Build.SourcesDirectory)/${{ project.path }}
            deviceTestConfiguration: ${{ parameters.BuildConfiguration }}
            targetFrameworkVersion: ${{ parameters.TargetFrameworkVersion }}
            useCoreClr: true
            expectedOSMajor: ${{ apple.osMajor }}
            expectedArchitecture: Arm64

    - ${{ if eq(parameters.runWindowsTests, true) }}:
      - ${{ each packaging in split(iif(eq(parameters.windowsPackaging, 'both'), 'packaged;unpackaged', parameters.windowsPackaging), ';') }}:
        - job: windows_${{ project.name }}_${{ packaging }}
          displayName: Windows ${{ project.name }} ${{ packaging }}
          pool: ${{ parameters.windowsPool }}
          timeoutInMinutes: 120
          cancelTimeoutInMinutes: 15
          steps:
          - template: /eng/pipelines/common/device-tests-steps.yml@self
            parameters:
              platform: windows
              path: $(Build.SourcesDirectory)/${{ project.path }}
              device: ${{ packaging }}
              deviceTestConfiguration: ${{ parameters.BuildConfiguration }}
              targetFrameworkVersion: ${{ parameters.TargetFrameworkVersion }}
              expectedArchitecture: X64
              requireWindows11: ${{ parameters.requireWindows11 }}
