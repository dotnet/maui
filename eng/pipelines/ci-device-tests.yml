trigger:
  batch: true
  branches:
    include: [ main, release/*, net*.0, inflight/*, darc-* ]
  tags:
    include: [ '*' ]
  paths:
    include: [ '*', .github/skills/run-device-tests/scripts/**, .github/scripts/shared/** ]
    exclude: [ .github, docs/*, src/Templates/*, CODE-OF-CONDUCT.md, CONTRIBUTING.md, LICENSE.TXT, PATENTS.TXT, README.md, THIRD-PARTY-NOTICES.TXT ]

pr:
  branches:
    include: [ main, release/*, net*.0, inflight/* ]
  paths:
    include: [ '*', .github/skills/run-device-tests/scripts/**, .github/scripts/shared/** ]
    exclude: [ .github, docs/*, src/Templates/*, CODE-OF-CONDUCT.md, CONTRIBUTING.md, LICENSE.TXT, PATENTS.TXT, README.md, THIRD-PARTY-NOTICES.TXT ]

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self
- template: /eng/pipelines/common/variables.yml@self
- template: /eng/pipelines/arcade/variables.yml@self

parameters:
- name: androidPoolPublic
  type: object
  default:
    name: MAUI-DNCENG
    demands:
    - ImageOverride -equals 1ESPT-Ubuntu22.04
- name: androidPoolInternal
  type: object
  default:
    name: MAUI-DNCENG
    demands:
    - ImageOverride -equals 1ESPT-Ubuntu22.04
- name: windowsPoolPublic
  type: object
  default:
    name: NetCore-Public
    demands:
    - ImageOverride -equals 1es-windows-2022-open
- name: windowsPoolInternal
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
    - ImageOverride -equals 1es-windows-2022
- name: requireWindows11
  type: boolean
  default: false
- name: runWindowsTests
  type: boolean
  default: true
- name: windowsPackaging
  type: string
  default: both
  values: [ both, packaged, unpackaged ]
- name: applePoolsPublic
  type: object
  default:
  - name: macos27
    osMajor: 27
    pool:
      name: AcesShared
      demands:
      - ImageOverride -equals $(AcesMacImageOverride)
- name: applePoolsInternal
  type: object
  default:
  - name: macos27
    osMajor: 27
    pool:
      name: AcesShared
      demands:
      - ImageOverride -equals $(AcesMacImageOverride)
- name: targetFrameworkVersions
  type: object
  default:
  - tfm: net11.0
- name: runtimes
  type: object
  default:
  - name: coreclr
    useCoreClr: true
  - name: mono
    useCoreClr: false

stages:
- ${{ each targetFrameworkVersion in parameters.targetFrameworkVersions }}:
  - template: /eng/pipelines/arcade/stage-device-tests.yml@self
    parameters:
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        androidPool: ${{ parameters.androidPoolInternal }}
        windowsPool: ${{ parameters.windowsPoolInternal }}
        applePools: ${{ parameters.applePoolsInternal }}
      ${{ else }}:
        androidPool: ${{ parameters.androidPoolPublic }}
        windowsPool: ${{ parameters.windowsPoolPublic }}
        applePools: ${{ parameters.applePoolsPublic }}
      runWindowsTests: ${{ parameters.runWindowsTests }}
      windowsPackaging: ${{ parameters.windowsPackaging }}
      requireWindows11: ${{ parameters.requireWindows11 }}
      runtimes: ${{ parameters.runtimes }}
      TargetFrameworkVersion: ${{ targetFrameworkVersion.tfm }}
