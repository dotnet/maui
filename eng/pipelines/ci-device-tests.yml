trigger:
  batch: true
  branches:
    include:
    - main
    - net11
    - release/*
    - net*.0
    - inflight/*
    - candidate/*
    - darc-*
    # `/review run-device-tests` dispatch commits (see eng/pipelines/common/run-devicetests-request.yml).
    - run-devicetests/*
  tags:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

pr:
  branches:
    include:
    - automation/release/*
    - main
    - net11
    - release/*
    - net*.0
    - inflight/*
    - candidate/*
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self
- template: /eng/pipelines/common/variables.yml@self
- template: /eng/pipelines/arcade/variables.yml@self
# A `/review run-device-tests` dispatch branch carries the AI selection for one PR (RunDeviceTests* variables).
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/run-devicetests/') }}:
  - template: /eng/pipelines/common/run-devicetests-request.yml@self
# Include Helix access token for internal builds
- ${{ if eq(variables['System.TeamProject'], 'internal') }}:
  - group: DotNet-HelixApi-Access

parameters:

# Internal pools (dnceng)
- name: windowsPoolInternal
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
        - ImageOverride -equals 1es-windows-2022
    image: 1es-windows-2022
    os: Windows

- name: macOSTestPoolInternal
  type: object
  default:
    name: AcesShared
    demands:
      - ImageOverride -equals $(AcesMacImageOverride)
    os: macOS

- name: macOSPoolInternal
  type: object
  default:
    name: AcesShared
    demands:
      - ImageOverride -equals $(AcesMacImageOverride)
    os: macOS

# Public pools (dnceng-public)
- name: windowsPoolPublic
  type: object
  default:
    name: NetCore-Public
    demands:
        - ImageOverride -equals 1es-windows-2022-open
    image: 1es-windows-2022-open
    os: Windows

- name: macOSTestPoolPublic
  type: object
  default:
    name: AcesShared
    demands:
      - ImageOverride -equals $(AcesMacImageOverride)

- name: macOSPoolPublic
  type: object
  default:
    name: AcesShared
    demands:
      - ImageOverride -equals $(AcesMacImageOverride)

- name: targetFrameworkVersions
  type: object
  default:
  - tfm: net12.0

stages:
- ${{ each targetFrameworkVersion in parameters.targetFrameworkVersions }}:

  # Use Helix for iOS / Android / MacCatalyst / Windows Device Tests
  - template: /eng/pipelines/arcade/stage-device-tests.yml@self
    parameters:
      # Select pools based on pipeline - internal vs public
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        buildPool: ${{ parameters.macOSPoolInternal }}
        testPool: ${{ parameters.windowsPoolInternal }}
        windowsBuildPool: ${{ parameters.windowsPoolInternal }}
        windowsTestPool: ${{ parameters.windowsPoolInternal }}
        runAsPublic: false
        HelixAccessToken: $(HelixApiAccessToken)
        HelixInternal: true
      ${{ else }}:
        buildPool: ${{ parameters.macOSPoolPublic }}
        testPool: ${{ parameters.windowsPoolPublic }}
        windowsBuildPool: ${{ parameters.windowsPoolPublic }}
        windowsTestPool: ${{ parameters.windowsPoolPublic }}
        runAsPublic: true
      runWindowsTests: true
      TargetFrameworkVersion: ${{ targetFrameworkVersion.tfm }}
      androidPrepareSteps:
      - template: /eng/pipelines/common/provision.yml@self
        parameters:
          checkoutDirectory: '$(System.DefaultWorkingDirectory)'
          skipJdk: false
          skipAndroidCommonSdks: false
          skipAndroidPlatformApis: false
          onlyAndroidPlatformDefaultApis: true
          skipAndroidEmulatorImages: true
          skipAndroidCreateAvds: true
          skipXcode: true
          skipSimulatorSetup: true
      # A `/review run-device-tests` dispatch: only the selected platforms (CoreCLR only), projects and
      # categories. Only RunTestsMode 'full' keeps everything; any other value narrows to the listed
      # platforms, so an unfilled request runs nothing.
      ${{ if and(startsWith(variables['Build.SourceBranch'], 'refs/heads/run-devicetests/'), ne(variables['RunTestsMode'], 'full')) }}:
        selectedRun: true
        selectedPlatforms:
        - ${{ each platform in split(variables['RunDeviceTestsPlatforms'], ',') }}:
          - ${{ platform }}
        extraHelixArguments: /p:RunDeviceTestsProjects=${{ variables['RunDeviceTestsProjects'] }} /p:RunDeviceTestsControlsSkip=${{ variables['RunDeviceTestsControlsSkip'] }} /p:RunDeviceTestsCoreSkip=${{ variables['RunDeviceTestsCoreSkip'] }} /p:RunDeviceTestsControlsRun=${{ variables['RunDeviceTestsControlsRun'] }} /p:RunDeviceTestsCoreRun=${{ variables['RunDeviceTestsCoreRun'] }}
      prepareSteps:
      - template: /eng/pipelines/common/provision.yml@self
        parameters:
          checkoutDirectory: '$(System.DefaultWorkingDirectory)'
          skipJdk: false
          skipAndroidCommonSdks: false
          skipAndroidPlatformApis: false
          onlyAndroidPlatformDefaultApis: true
          skipAndroidEmulatorImages: true
          skipAndroidCreateAvds: true
          skipProvisioning: true
          skipXcode: false
          skipSimulatorSetup: false
