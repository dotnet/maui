trigger:
  batch: true
  branches:
    include:
    - main
    - net11
    - release/*
    - net*.0
    - inflight/*
    - candidate/*
    - darc-*
    # `/review run-device-tests` dispatch commits (see eng/pipelines/common/run-devicetests-request.yml).
    - run-devicetests/*
  tags:
    include: [ '*' ]
  paths:
    include: [ '*', .github/skills/run-device-tests/scripts/**, .github/scripts/shared/** ]
    exclude: [ .github, docs/*, src/Templates/*, CODE-OF-CONDUCT.md, CONTRIBUTING.md, LICENSE.TXT, PATENTS.TXT, README.md, THIRD-PARTY-NOTICES.TXT ]

pr:
  branches:
    include: [ automation/release/*, main, net11, release/*, net*.0, inflight/*, candidate/* ]
  paths:
    include: [ '*', .github/skills/run-device-tests/scripts/**, .github/scripts/shared/** ]
    exclude: [ .github, docs/*, src/Templates/*, CODE-OF-CONDUCT.md, CONTRIBUTING.md, LICENSE.TXT, PATENTS.TXT, README.md, THIRD-PARTY-NOTICES.TXT ]

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self
- template: /eng/pipelines/common/variables.yml@self
- template: /eng/pipelines/arcade/variables.yml@self
# A `/review run-device-tests` dispatch branch carries the AI selection for one PR (RunDeviceTests* variables).
- ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/run-devicetests/') }}:
  - template: /eng/pipelines/common/run-devicetests-request.yml@self

parameters:
- name: androidPoolPublic
  type: object
  default:
    name: MAUI-DNCENG
    demands:
    - ImageOverride -equals 1ESPT-Ubuntu22.04
- name: androidPoolInternal
  type: object
  default:
    name: MAUI-DNCENG
    demands:
    - ImageOverride -equals 1ESPT-Ubuntu22.04
- name: windowsPoolPublic
  type: object
  default:
    name: NetCore-Public
    demands:
    - ImageOverride -equals 1es-windows-2022-open
- name: windowsPoolInternal
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
    - ImageOverride -equals 1es-windows-2022
- name: requireWindows11
  type: boolean
  default: false
- name: runWindowsTests
  type: boolean
  default: true
- name: windowsPackaging
  type: string
  default: both
  values: [ both, packaged, unpackaged ]
- name: applePoolsPublic
  type: object
  default:
  - name: macos27
    osMajor: 27
    pool:
      name: AcesShared
      demands:
      - ImageOverride -equals $(AcesMacImageOverride)
- name: applePoolsInternal
  type: object
  default:
  - name: macos27
    osMajor: 27
    pool:
      name: AcesShared
      demands:
      - ImageOverride -equals $(AcesMacImageOverride)
- name: targetFrameworkVersions
  type: object
  default:
  - tfm: net11.0
- name: runtimes
  type: object
  default:
  - name: coreclr
    useCoreClr: true
  - name: mono
    useCoreClr: false

stages:
- ${{ each targetFrameworkVersion in parameters.targetFrameworkVersions }}:
  - template: /eng/pipelines/arcade/stage-device-tests.yml@self
    parameters:
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        androidPool: ${{ parameters.androidPoolInternal }}
        windowsPool: ${{ parameters.windowsPoolInternal }}
        applePools: ${{ parameters.applePoolsInternal }}
      ${{ else }}:
        androidPool: ${{ parameters.androidPoolPublic }}
        windowsPool: ${{ parameters.windowsPoolPublic }}
        applePools: ${{ parameters.applePoolsPublic }}
      runWindowsTests: ${{ parameters.runWindowsTests }}
      windowsPackaging: ${{ parameters.windowsPackaging }}
      requireWindows11: ${{ parameters.requireWindows11 }}
      runtimes: ${{ parameters.runtimes }}
      TargetFrameworkVersion: ${{ targetFrameworkVersion.tfm }}
      # A `/review run-device-tests` dispatch: only the selected platforms (CoreCLR only), projects and
      # categories. Only RunTestsMode 'full' keeps everything; any other value narrows to the listed
      # platforms, so an unfilled request runs nothing.
      ${{ if and(startsWith(variables['Build.SourceBranch'], 'refs/heads/run-devicetests/'), ne(variables['RunTestsMode'], 'full')) }}:
        selectedRun: true
        selectedPlatforms:
        - ${{ each platform in split(variables['RunDeviceTestsPlatforms'], ',') }}:
          - ${{ platform }}
        selectedProjects: ${{ variables['RunDeviceTestsProjects'] }}
        selectedFilters:
          ${{ if ne(variables['RunDeviceTestsControlsSkip'], '') }}:
            controls: SkipCategories=${{ replace(variables['RunDeviceTestsControlsSkip'], '+', ',') }}
          ${{ if ne(variables['RunDeviceTestsCoreSkip'], '') }}:
            core: SkipCategories=${{ replace(variables['RunDeviceTestsCoreSkip'], '+', ',') }}
