# One gated publish of one package set.
#
# Internal stage definition used by ci-official-release.yml for every package set. It keeps
# approval, integrity checks, filtering, 1ES publishing, and verification identical across
# workload packs, workload manifests, and non-workload packages.
#
# The three-step shape is fixed: `release filter` -> 1ES.PublishNuget@1 -> `release verify`.
# Two tool invocations bracketing the compliance task, which owns the actual upload.

parameters:
- name: stageName
  type: string

- name: displayName
  type: string

- name: artifactName
  type: string

- name: dependsOn
  type: object

- name: approvalInstructions
  type: string

# The one production connection this release system publishes through. Not operator-facing:
# it is a property of the system, not of an individual release.
- name: nugetServiceConnection
  type: string
  default: nuget.org (dotnetframework)

- name: recoveryFilters
  type: string
  default: skip

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: succeeded()
  jobs:

  # ManualValidation@0 requires `pool: server`, and an agentless job cannot download
  # artifacts or run scripts. The gate therefore cannot live in the publishing job; the
  # split is imposed by Azure DevOps, not a style choice.
  - job: approval
    displayName: Wait to publish
    timeoutInMinutes: 240
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 120
      inputs:
        instructions: ${{ parameters.approvalInstructions }}
        onTimeout: reject

  - job: publish
    displayName: Publish to NuGet.org
    timeoutInMinutes: 90
    dependsOn: approval
    condition: eq(dependencies.approval.result, 'Succeeded')
    variables:
      ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.artifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
    steps:
    - checkout: self
      clean: true
      persistCredentials: false

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true

    # The plan hash is pinned by the preparing stage and covers package identities and hashes.
    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $planPath = "$root/release-plan.json"

        $actual = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:EXPECTED_PLAN_HASH) {
          throw "Release plan hash '$actual' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
        }

      displayName: Verify artifact integrity
      env:
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)

    # Removes already-published packages in place, so the push glob below sees only what
    # still needs publishing. Fails closed on a missing, tampered or unlisted file.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        dotnet run `
          --project "$env:RELEASE_PROJECT" `
          --configuration Release `
          --no-launch-profile `
          -- `
          filter `
          --plan "$env:ARTIFACT_DIR/release-plan.json" `
          --stage "$env:STAGE_ROOT" `
          --set "$env:SET_NAME" `
          --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
          --skip $env:RECOVERY_FILTERS
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Filter already-published packages
      env:
        RELEASE_PROJECT: $(Build.SourcesDirectory)/src/DotNet.Release/DotNet.Release.csproj
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        STAGE_ROOT: $(Pipeline.Workspace)
        SET_NAME: ${{ parameters.artifactName }}
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

    # The compliance boundary. The tool has no push capability; this task performs the
    # upload and carries the SBOM and provenance obligations.
    - task: 1ES.PublishNuget@1
      displayName: Push packages to NuGet.org
      condition: and(succeeded(), eq(variables['NuGetPackagesToPublish'], 'true'))
      inputs:
        useDotNetTask: false
        packagesToPush: $(Pipeline.Workspace)/${{ parameters.artifactName }}/*.nupkg
        packageParentPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        nuGetFeedType: external
        publishFeedCredentials: ${{ parameters.nugetServiceConnection }}

    # Requires every identity in the plan, including ones filter withheld: those were
    # withheld because they were already live, so their absence would disprove that.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        dotnet run `
          --project "$env:RELEASE_PROJECT" `
          --configuration Release `
          --no-launch-profile `
          -- `
          verify `
          --plan "$env:ARTIFACT_DIR/release-plan.json" `
          --set "$env:SET_NAME" `
          --stage "$env:STAGE_ROOT" `
          --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
          --max-duration-minutes 30 `
          --poll-seconds 20
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Verify packages on NuGet.org
      env:
        RELEASE_PROJECT: $(Build.SourcesDirectory)/src/DotNet.Release/DotNet.Release.csproj
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        STAGE_ROOT: $(Pipeline.Workspace)
        SET_NAME: ${{ parameters.artifactName }}
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
