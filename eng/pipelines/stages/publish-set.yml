# Prunes and validates one package set and, when enabled, publishes it.
#
# The preflight job always runs for the matching repository type. It downloads the Release
# artifact, queries NuGet.org for existing versions, removes those local files, validates the
# remaining set, and publishes the exact pruned artifact for review. Approval and the production
# release job run in dry runs too; only mutation and post-publish verification are excluded.

parameters:
- name: stageName
  type: string

- name: displayName
  type: string

- name: artifactName
  type: string
  default: Release

- name: preparedArtifactName
  type: string

- name: setName
  type: string

- name: expectedWorkload
  type: string
  values:
  - 'true'
  - 'false'

- name: publishPackages
  type: boolean
  default: false

- name: dependsOn
  type: object

- name: approvalInstructions
  type: string

- name: dryRunApprovalInstructions
  type: string

- name: nugetServiceConnection
  type: string
  default: nuget.org (dotnetframework)

- name: recoveryFilters
  type: string
  default: skip

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: and(succeeded(), eq(dependencies.prepare_release.outputs['prepare_release.resolveBuild.IsWorkload'], '${{ parameters.expectedWorkload }}'))
  jobs:

  - job: preflight
    displayName: Prune and validate package set
    workspace:
      clean: all
    variables:
      ReleaseManifestHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinManifest.ReleaseManifestHash'] ]
      ReleaseToolBundleHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolBundleHash'] ]
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.artifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
      outputs:
      - output: pipelineArtifact
        artifactName: ${{ parameters.preparedArtifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.preparedArtifactName }}
    steps:
    - checkout: none

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $bundlePath = "$root/release-tool.zip"
        $bundleHash = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($bundleHash -ne $env:EXPECTED_TOOL_BUNDLE_HASH) {
          throw "Release tool bundle hash '$bundleHash' does not match '$env:EXPECTED_TOOL_BUNDLE_HASH'."
        }

        $manifestPath = "$root/release-manifest.json"
        $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($manifestHash -ne $env:EXPECTED_MANIFEST_HASH) {
          throw "Release manifest hash '$manifestHash' does not match '$env:EXPECTED_MANIFEST_HASH'."
        }

        $expanded = "$(Agent.TempDirectory)/release-tool"
        Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction Ignore
        Expand-Archive -LiteralPath $bundlePath -DestinationPath $expanded
      displayName: Verify and expand release tool
      env:
        EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)
        EXPECTED_TOOL_BUNDLE_HASH: $(ReleaseToolBundleHash)

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true
        workingDirectory: $(Agent.TempDirectory)/release-tool

    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $recovery = @()
        if ($env:RECOVERY_FILTERS -ne 'skip') {
          $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
        }

        dotnet "$env:RELEASE_TOOL" `
          prune-published `
          --manifest "$env:ARTIFACT_DIR/release-manifest.json" `
          --stage "$env:ARTIFACT_DIR" `
          --set "$env:SET_NAME" `
          --expected-manifest-hash "$env:EXPECTED_MANIFEST_HASH" `
          @recovery
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Prune versions already published on NuGet.org
      env:
        RELEASE_TOOL: $(Agent.TempDirectory)/release-tool/_tool/release.dll
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        SET_NAME: ${{ parameters.setName }}
        EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

    - pwsh: |
        $source = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $prepared = "$(Pipeline.Workspace)/${{ parameters.preparedArtifactName }}"
        New-Item -ItemType Directory -Path $prepared -Force | Out-Null
        Copy-Item -LiteralPath "$source/release-manifest.json" -Destination $prepared
        Copy-Item -LiteralPath "$source/release-tool.zip" -Destination $prepared
        Copy-Item -LiteralPath "$source/${{ parameters.setName }}" -Destination $prepared -Recurse
      displayName: Create exact approval artifact

  - job: approval
    ${{ if eq(parameters.publishPackages, true) }}:
      displayName: Approve exact pruned package set
    ${{ else }}:
      displayName: Review dry-run package set
    dependsOn: preflight
    timeoutInMinutes: 240
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 120
      inputs:
        ${{ if eq(parameters.publishPackages, true) }}:
          instructions: ${{ parameters.approvalInstructions }}
        ${{ else }}:
          instructions: ${{ parameters.dryRunApprovalInstructions }}
        onTimeout: reject

  - job: publish
    ${{ if eq(parameters.publishPackages, true) }}:
      displayName: Publish to NuGet.org
    ${{ else }}:
      displayName: Rehearse production release job
    timeoutInMinutes: 90
    dependsOn: approval
    condition: eq(dependencies.approval.result, 'Succeeded')
    variables:
      ReleaseManifestHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinManifest.ReleaseManifestHash'] ]
      ReleaseToolBundleHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolBundleHash'] ]
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.preparedArtifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
    steps:
    - checkout: none

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $bundlePath = "$root/release-tool.zip"
        $bundleHash = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($bundleHash -ne $env:EXPECTED_TOOL_BUNDLE_HASH) {
          throw "Release tool bundle hash '$bundleHash' does not match '$env:EXPECTED_TOOL_BUNDLE_HASH'."
        }

        $manifestPath = "$root/release-manifest.json"
        $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($manifestHash -ne $env:EXPECTED_MANIFEST_HASH) {
          throw "Release manifest hash '$manifestHash' does not match '$env:EXPECTED_MANIFEST_HASH'."
        }

        $expanded = "$(Agent.TempDirectory)/release-tool"
        Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction Ignore
        Expand-Archive -LiteralPath $bundlePath -DestinationPath $expanded
      displayName: Verify and expand approved release tool
      env:
        EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)
        EXPECTED_TOOL_BUNDLE_HASH: $(ReleaseToolBundleHash)

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true
        workingDirectory: $(Agent.TempDirectory)/release-tool

    # Approval can remain open while another run publishes one of the same versions. This
    # recheck may only remove files from the approved set; it can never add a package.
    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $recovery = @()
        if ($env:RECOVERY_FILTERS -ne 'skip') {
          $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
        }

        dotnet "$env:RELEASE_TOOL" `
          prune-published `
          --manifest "$env:ARTIFACT_DIR/release-manifest.json" `
          --stage "$env:ARTIFACT_DIR" `
          --set "$env:SET_NAME" `
          --expected-manifest-hash "$env:EXPECTED_MANIFEST_HASH" `
          @recovery
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Refresh already-published versions
      env:
        RELEASE_TOOL: $(Agent.TempDirectory)/release-tool/_tool/release.dll
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        SET_NAME: ${{ parameters.setName }}
        EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

    - ${{ if eq(parameters.publishPackages, true) }}:
      - task: 1ES.PublishNuget@1
        displayName: Push approved packages to NuGet.org
        condition: and(succeeded(), eq(variables['NuGetPackagesToPublish'], 'true'))
        inputs:
          useDotNetTask: false
          packagesToPush: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}/*.nupkg
          packageParentPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}
          nuGetFeedType: external
          publishFeedCredentials: ${{ parameters.nugetServiceConnection }}

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          dotnet "$env:RELEASE_TOOL" `
            verify `
            --manifest "$env:ARTIFACT_DIR/release-manifest.json" `
            --set "$env:SET_NAME" `
            --expected-manifest-hash "$env:EXPECTED_MANIFEST_HASH" `
            --max-duration-minutes 30 `
            --poll-seconds 20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Verify packages on NuGet.org
        env:
          RELEASE_TOOL: $(Agent.TempDirectory)/release-tool/_tool/release.dll
          ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
          SET_NAME: ${{ parameters.setName }}
          EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)

    - ${{ else }}:
      - pwsh: |
          Write-Host 'DRY RUN. The production release job, approved artifact download, integrity checks, and final prune all succeeded.'
          Write-Host 'The NuGet.org publishing task and post-publish verification are not present in this job.'
        displayName: Confirm publish operations are excluded
