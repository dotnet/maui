# Prunes and validates one package set and, when enabled, publishes it.
#
# The preflight job always runs for the matching repository type. It downloads the Release
# artifact, queries NuGet.org for existing versions, removes those local files, validates the
# remaining set, and publishes the exact pruned artifact for review. Approval and the production
# release job run in dry runs too; only mutation and post-publish verification are excluded.

parameters:
- name: stageName
  type: string

- name: displayName
  type: string

- name: artifactName
  type: string
  default: Release

- name: preparedArtifactName
  type: string

- name: setName
  type: string

- name: expectedWorkload
  type: string
  values:
  - 'true'
  - 'false'

- name: publishPackages
  type: boolean
  default: false

- name: dependsOn
  type: object

- name: approvalInstructions
  type: string

- name: dryRunApprovalInstructions
  type: string

- name: nugetServiceConnection
  type: string
  default: nuget.org (dotnetframework)

- name: recoveryFilters
  type: string
  default: skip

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: and(succeeded(), eq(dependencies.prepare_release.outputs['prepare_release.releasePlan.IsWorkload'], '${{ parameters.expectedWorkload }}'))
  jobs:

  - job: preflight
    displayName: Prune and validate package set
    workspace:
      clean: all
    variables:
      ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
      ReleaseToolHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolHash'] ]
      GlobalJsonHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.GlobalJsonHash'] ]
      DirectoryHashScriptHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.DirectoryHashScriptHash'] ]
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.artifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
      outputs:
      - output: pipelineArtifact
        artifactName: ${{ parameters.preparedArtifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.preparedArtifactName }}
    steps:
    - checkout: none

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $globalJsonHash = (Get-FileHash -LiteralPath "$root/global.json" -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($globalJsonHash -ne $env:EXPECTED_GLOBAL_JSON_HASH) {
          throw "global.json hash '$globalJsonHash' does not match '$env:EXPECTED_GLOBAL_JSON_HASH'."
        }

        $hashScript = "$root/_infra/Get-DirectoryHash.ps1"
        $hashScriptHash = (Get-FileHash -LiteralPath $hashScript -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hashScriptHash -ne $env:EXPECTED_HASH_SCRIPT_HASH) {
          throw "Directory hash script hash '$hashScriptHash' does not match '$env:EXPECTED_HASH_SCRIPT_HASH'."
        }
      displayName: Verify release infrastructure
      env:
        EXPECTED_GLOBAL_JSON_HASH: $(GlobalJsonHash)
        EXPECTED_HASH_SCRIPT_HASH: $(DirectoryHashScriptHash)

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true
        workingDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $planPath = "$root/release-plan.json"
        $toolPath = "$root/_tool/release.dll"

        $planHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($planHash -ne $env:EXPECTED_PLAN_HASH) {
          throw "Release plan hash '$planHash' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
        }

        $toolHash = & "$root/_infra/Get-DirectoryHash.ps1" `
          -Path (Split-Path -Parent $toolPath)
        if ($toolHash -ne $env:EXPECTED_TOOL_HASH) {
          throw "Release tool hash '$toolHash' does not match the prepared hash '$env:EXPECTED_TOOL_HASH'."
        }
      displayName: Verify artifact integrity
      env:
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        EXPECTED_TOOL_HASH: $(ReleaseToolHash)

    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $recovery = @()
        if ($env:RECOVERY_FILTERS -ne 'skip') {
          $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
        }

        dotnet "$env:RELEASE_TOOL" `
          prune-published `
          --plan "$env:ARTIFACT_DIR/release-plan.json" `
          --stage "$env:ARTIFACT_DIR" `
          --set "$env:SET_NAME" `
          --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
          @recovery
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Prune versions already published on NuGet.org
      env:
        RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        SET_NAME: ${{ parameters.setName }}
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

    - pwsh: |
        $source = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $prepared = "$(Pipeline.Workspace)/${{ parameters.preparedArtifactName }}"
        New-Item -ItemType Directory -Path $prepared -Force | Out-Null
        Copy-Item -LiteralPath "$source/release-plan.json" -Destination $prepared
        Copy-Item -LiteralPath "$source/global.json" -Destination $prepared
        Copy-Item -LiteralPath "$source/_infra" -Destination $prepared -Recurse
        Copy-Item -LiteralPath "$source/_tool" -Destination $prepared -Recurse
        Copy-Item -LiteralPath "$source/${{ parameters.setName }}" -Destination $prepared -Recurse
      displayName: Create exact approval artifact

  - job: approval
    ${{ if eq(parameters.publishPackages, true) }}:
      displayName: Approve exact pruned package set
    ${{ else }}:
      displayName: Review dry-run package set
    dependsOn: preflight
    timeoutInMinutes: 240
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 120
      inputs:
        ${{ if eq(parameters.publishPackages, true) }}:
          instructions: ${{ parameters.approvalInstructions }}
        ${{ else }}:
          instructions: ${{ parameters.dryRunApprovalInstructions }}
        onTimeout: reject

  - job: publish
    ${{ if eq(parameters.publishPackages, true) }}:
      displayName: Publish to NuGet.org
    ${{ else }}:
      displayName: Rehearse production release job
    timeoutInMinutes: 90
    dependsOn: approval
    condition: eq(dependencies.approval.result, 'Succeeded')
    variables:
      ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
      ReleaseToolHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolHash'] ]
      GlobalJsonHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.GlobalJsonHash'] ]
      DirectoryHashScriptHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.DirectoryHashScriptHash'] ]
    templateContext:
      type: releaseJob
      isProduction: true
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.preparedArtifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
    steps:
    - checkout: none

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $globalJsonHash = (Get-FileHash -LiteralPath "$root/global.json" -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($globalJsonHash -ne $env:EXPECTED_GLOBAL_JSON_HASH) {
          throw "global.json hash '$globalJsonHash' does not match '$env:EXPECTED_GLOBAL_JSON_HASH'."
        }

        $hashScript = "$root/_infra/Get-DirectoryHash.ps1"
        $hashScriptHash = (Get-FileHash -LiteralPath $hashScript -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hashScriptHash -ne $env:EXPECTED_HASH_SCRIPT_HASH) {
          throw "Directory hash script hash '$hashScriptHash' does not match '$env:EXPECTED_HASH_SCRIPT_HASH'."
        }
      displayName: Verify release infrastructure
      env:
        EXPECTED_GLOBAL_JSON_HASH: $(GlobalJsonHash)
        EXPECTED_HASH_SCRIPT_HASH: $(DirectoryHashScriptHash)

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true
        workingDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $planPath = "$root/release-plan.json"
        $toolPath = "$root/_tool/release.dll"

        $planHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($planHash -ne $env:EXPECTED_PLAN_HASH) {
          throw "Release plan hash '$planHash' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
        }

        $toolHash = & "$root/_infra/Get-DirectoryHash.ps1" `
          -Path (Split-Path -Parent $toolPath)
        if ($toolHash -ne $env:EXPECTED_TOOL_HASH) {
          throw "Release tool hash '$toolHash' does not match the prepared hash '$env:EXPECTED_TOOL_HASH'."
        }
      displayName: Verify approved artifact integrity
      env:
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        EXPECTED_TOOL_HASH: $(ReleaseToolHash)

    # Approval can remain open while another run publishes one of the same versions. This
    # recheck may only remove files from the approved set; it can never add a package.
    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $recovery = @()
        if ($env:RECOVERY_FILTERS -ne 'skip') {
          $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
        }

        dotnet "$env:RELEASE_TOOL" `
          prune-published `
          --plan "$env:ARTIFACT_DIR/release-plan.json" `
          --stage "$env:ARTIFACT_DIR" `
          --set "$env:SET_NAME" `
          --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
          @recovery
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Refresh already-published versions
      env:
        RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        SET_NAME: ${{ parameters.setName }}
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

    - ${{ if eq(parameters.publishPackages, true) }}:
      - task: 1ES.PublishNuget@1
        displayName: Push approved packages to NuGet.org
        condition: and(succeeded(), eq(variables['NuGetPackagesToPublish'], 'true'))
        inputs:
          useDotNetTask: false
          packagesToPush: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}/*.nupkg
          packageParentPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}
          nuGetFeedType: external
          publishFeedCredentials: ${{ parameters.nugetServiceConnection }}

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          dotnet "$env:RELEASE_TOOL" `
            verify `
            --plan "$env:ARTIFACT_DIR/release-plan.json" `
            --set "$env:SET_NAME" `
            --stage "$env:ARTIFACT_DIR" `
            --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
            --max-duration-minutes 30 `
            --poll-seconds 20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Verify packages on NuGet.org
        env:
          RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
          ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
          SET_NAME: ${{ parameters.setName }}
          EXPECTED_PLAN_HASH: $(ReleasePlanHash)

    - ${{ else }}:
      - pwsh: |
          Write-Host 'DRY RUN. The production release job, approved artifact download, integrity checks, and final prune all succeeded.'
          Write-Host 'The NuGet.org publishing task and post-publish verification are not present in this job.'
        displayName: Confirm publish operations are excluded
