# Prunes and validates one package set and, when enabled, publishes it.
#
# The preflight job always runs for the matching repository type. It downloads the Release
# artifact, queries NuGet.org for existing versions, removes those local files, validates the
# remaining set, and publishes the exact pruned artifact for review. Approval and mutation
# jobs exist only when publishPackages is true.

parameters:
- name: stageName
  type: string

- name: displayName
  type: string

- name: artifactName
  type: string
  default: Release

- name: preparedArtifactName
  type: string

- name: setName
  type: string

- name: expectedWorkload
  type: string
  values:
  - 'true'
  - 'false'

- name: publishPackages
  type: boolean
  default: false

- name: dependsOn
  type: object

- name: approvalInstructions
  type: string

- name: nugetServiceConnection
  type: string
  default: nuget.org (dotnetframework)

- name: recoveryFilters
  type: string
  default: ''

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: and(succeeded(), eq(dependencies.prepare_release.outputs['prepare_release.releasePlan.IsWorkload'], '${{ parameters.expectedWorkload }}'))
  jobs:

  - job: preflight
    displayName: Prune and validate package set
    variables:
      ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
      ReleaseToolHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolHash'] ]
    templateContext:
      inputs:
      - input: pipelineArtifact
        artifactName: ${{ parameters.artifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
      outputs:
      - output: pipelineArtifact
        artifactName: ${{ parameters.preparedArtifactName }}
        targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
    steps:
    - checkout: self
      clean: true
      persistCredentials: false

    - task: UseDotNet@2
      displayName: Install the .NET SDK
      inputs:
        useGlobalJson: true

    - pwsh: |
        $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
        $planPath = "$root/release-plan.json"
        $toolPath = "$root/_tool/release.dll"

        $planHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($planHash -ne $env:EXPECTED_PLAN_HASH) {
          throw "Release plan hash '$planHash' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
        }

        $toolHash = (Get-FileHash -LiteralPath $toolPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($toolHash -ne $env:EXPECTED_TOOL_HASH) {
          throw "Release tool hash '$toolHash' does not match the prepared hash '$env:EXPECTED_TOOL_HASH'."
        }
      displayName: Verify artifact integrity
      env:
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        EXPECTED_TOOL_HASH: $(ReleaseToolHash)

    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $recovery = @()
        if (![string]::IsNullOrWhiteSpace($env:RECOVERY_FILTERS)) {
          $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
        }

        dotnet "$env:RELEASE_TOOL" `
          prune-published `
          --plan "$env:ARTIFACT_DIR/release-plan.json" `
          --stage "$env:ARTIFACT_DIR" `
          --set "$env:SET_NAME" `
          --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
          @recovery
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      displayName: Prune versions already published on NuGet.org
      env:
        RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
        ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
        SET_NAME: ${{ parameters.setName }}
        EXPECTED_PLAN_HASH: $(ReleasePlanHash)
        RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

  - ${{ if eq(parameters.publishPackages, true) }}:
    - job: approval
      displayName: Approve exact pruned package set
      dependsOn: preflight
      timeoutInMinutes: 240
      pool: server
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 120
        inputs:
          instructions: ${{ parameters.approvalInstructions }}
          onTimeout: reject

    - job: publish
      displayName: Publish to NuGet.org
      timeoutInMinutes: 90
      dependsOn: approval
      condition: eq(dependencies.approval.result, 'Succeeded')
      variables:
        ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
        ReleaseToolHash: $[ stageDependencies.prepare_release.prepare_release.outputs['buildTool.ToolHash'] ]
      templateContext:
        type: releaseJob
        isProduction: true
        inputs:
        - input: pipelineArtifact
          artifactName: ${{ parameters.preparedArtifactName }}
          targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
      steps:
      - checkout: self
        clean: true
        persistCredentials: false

      - task: UseDotNet@2
        displayName: Install the .NET SDK
        inputs:
          useGlobalJson: true

      - pwsh: |
          $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
          $planPath = "$root/release-plan.json"
          $toolPath = "$root/_tool/release.dll"

          $planHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($planHash -ne $env:EXPECTED_PLAN_HASH) {
            throw "Release plan hash '$planHash' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
          }

          $toolHash = (Get-FileHash -LiteralPath $toolPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($toolHash -ne $env:EXPECTED_TOOL_HASH) {
            throw "Release tool hash '$toolHash' does not match the prepared hash '$env:EXPECTED_TOOL_HASH'."
          }
        displayName: Verify approved artifact integrity
        env:
          EXPECTED_PLAN_HASH: $(ReleasePlanHash)
          EXPECTED_TOOL_HASH: $(ReleaseToolHash)

      # Approval can remain open while another run publishes one of the same versions. This
      # recheck may only remove files from the approved set; it can never add a package.
      - pwsh: |
          $ErrorActionPreference = 'Stop'

          $recovery = @()
          if (![string]::IsNullOrWhiteSpace($env:RECOVERY_FILTERS)) {
            $recovery = @('--recovery-filters', $env:RECOVERY_FILTERS)
          }

          dotnet "$env:RELEASE_TOOL" `
            prune-published `
            --plan "$env:ARTIFACT_DIR/release-plan.json" `
            --stage "$env:ARTIFACT_DIR" `
            --set "$env:SET_NAME" `
            --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
            @recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Refresh already-published versions
        env:
          RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
          ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
          SET_NAME: ${{ parameters.setName }}
          EXPECTED_PLAN_HASH: $(ReleasePlanHash)
          RECOVERY_FILTERS: ${{ parameters.recoveryFilters }}

      - task: 1ES.PublishNuget@1
        displayName: Push approved packages to NuGet.org
        condition: and(succeeded(), eq(variables['NuGetPackagesToPublish'], 'true'))
        inputs:
          useDotNetTask: false
          packagesToPush: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}/*.nupkg
          packageParentPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.setName }}
          nuGetFeedType: external
          publishFeedCredentials: ${{ parameters.nugetServiceConnection }}

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          dotnet "$env:RELEASE_TOOL" `
            verify `
            --plan "$env:ARTIFACT_DIR/release-plan.json" `
            --set "$env:SET_NAME" `
            --stage "$env:ARTIFACT_DIR" `
            --expected-plan-hash "$env:EXPECTED_PLAN_HASH" `
            --max-duration-minutes 30 `
            --poll-seconds 20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Verify packages on NuGet.org
        env:
          RELEASE_TOOL: $(Pipeline.Workspace)/${{ parameters.artifactName }}/_tool/release.dll
          ARTIFACT_DIR: $(Pipeline.Workspace)/${{ parameters.artifactName }}
          SET_NAME: ${{ parameters.setName }}
          EXPECTED_PLAN_HASH: $(ReleasePlanHash)
