trigger:
  branches:
    include:
    - main
    - net11
    - net*.0
    - release/*
    - internal/release/*
  tags:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

schedules:
- cron: "0 5 * * *"
  displayName: Run daily at 5:00 UTC
  branches:
    include:
    - main
    - net11
    - net*.0
    - inflight/current
    - inflight/*xx-sr*
    exclude:
    # net11 is the servicing branch; retired .0 refs must not duplicate its nightlies.
    - net10.0
    - net11.0
  always: true

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self
- template: /eng/pipelines/common/variables.yml@self
- template: /eng/pipelines/arcade/variables.yml@self
- group: AzureDevOps-Artifact-Feeds-Pats

parameters:
- name: WindowsPool
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
      - ImageOverride -equals 1es-windows-2022
    os: windows
# Hosted macOS does not yet provide Xcode 27; use the same image as PR builds.
- name: MacOSPool
  type: object
  default:
    name: AcesShared
    demands:
      - ImageOverride -equals $(AcesMacImageOverride)
    os: macOS

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    pool: ${{ parameters.WindowsPool }}
    sdl:
      binskim:
        scanOutputDirectoryOnly: true
      codeql:
        runSourceLanguagesInSourceAnalysis: true
      policheck:
        enabled: true
      spotBugs:
        enabled: false
        justification: 'Failing with "Could not successfully find the java tool launcher"'
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\eng\automation\guardian\source.gdnsuppress
    stages:

    - ${{ if and(eq(variables['Build.Reason'], 'Schedule'), startsWith(variables['Build.SourceBranch'], 'refs/heads/inflight/')) }}:
      - stage: SelectInflightNightly
        displayName: Select active inflight nightly
        dependsOn: []
        jobs:
        - job: Select
          timeoutInMinutes: 10
          steps:
          - checkout: self
            persistCredentials: false
            fetchDepth: 1
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $remote = @(& git ls-remote --heads -- https://github.com/dotnet/maui.git refs/heads/main)
              if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or $remote[0] -cnotmatch '^([0-9a-f]{40})\trefs/heads/main$') {
                throw 'Unable to pin the canonical release-state commit.'
              }
              $stateCommit = $Matches[1]
              $statePath = Join-Path $env:AGENT_TEMPDIRECTORY 'nightly-release-state.json'
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/dotnet/maui/$stateCommit/eng/release-rollover.json" -OutFile $statePath -TimeoutSec 30
              $selection = & ./eng/scripts/Get-InflightNightlyEligibility.ps1 -StatePath $statePath -SourceBranch $env:BUILD_SOURCEBRANCH |
                ConvertFrom-Json
              Write-Host "Release state: $stateCommit; active nightly: $($selection.activeBranch); source: $($selection.sourceBranch)"
              $shouldBuild = ([bool] $selection.shouldBuild).ToString().ToLowerInvariant()
              Write-Host "##vso[task.setvariable variable=shouldBuild;isOutput=true]$shouldBuild"
            name: Resolve
            displayName: Resolve active nightly from canonical release state

    - template: /eng/pipelines/arcade/stage-pack.yml@self
      parameters:
        ${{ if and(eq(variables['Build.Reason'], 'Schedule'), startsWith(variables['Build.SourceBranch'], 'refs/heads/inflight/')) }}:
          dependsOn:
          - SelectInflightNightly
          condition: and(succeeded(), eq(dependencies.SelectInflightNightly.outputs['Select.Resolve.shouldBuild'], 'true'))
        pool: ${{ parameters.WindowsPool }}
        macPool: ${{ parameters.MacOSPool }}
        enableSourceIndex: false
        runAsPublic: false
        is1ESPipeline: true
        enableMicrobuild: true
        publishAssets: true
        sourceIndexParams:
          sourceIndexBuildCommand: build.cmd -restore -build -ci /bl:$(Build.Arcade.LogsPath)sourceIndexBuild.binlog /p:OfficialBuildId=$(_BuildOfficialId) /p:_SkipUpdateBuildNumber=true
          binlogPath: $(Build.Arcade.LogsPath)sourceIndexBuild.binlog
        prepareSteps:
        - template: /eng/pipelines/common/provision.yml@self
          parameters:
            checkoutDirectory: '$(System.DefaultWorkingDirectory)'
            skipJdk: false
            skipAndroidCommonSdks: false
            skipAndroidPlatformApis: false
            onlyAndroidPlatformDefaultApis: true
            skipAndroidEmulatorImages: true
            skipAndroidCreateAvds: true
            skipSimulatorSetup: true
            skipProvisioning: true
            skipXcode: false
            base64Encode: true
            outputVariableName: dotnetbuilds-internal-container-read-token-base64

    - ${{ if or(in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/net11'), and(startsWith(variables['Build.SourceBranch'], 'refs/heads/net'), endsWith(variables['Build.SourceBranch'], '.0')), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
      - template: /eng/pipelines/arcade/stage-api-scan.yml@self
        parameters:
          pool: ${{ parameters.WindowsPool }}
          dependsOnStage: Pack

    # Localization with OneLocBuild. Only run on official builds for handoff branches.
    - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
      - stage: Localization
        displayName: Localization
        dependsOn: []
        condition: and(succeeded(), eq(variables.isLocHandoffBranch, true))
        jobs:
          - template: /eng/common/templates-official/job/onelocbuild.yml@self
            parameters:
              CeapexServiceConnection: dnceng-onelocbuild-ceapex
              SkipLocProjectJsonGeneration: true
              MirrorRepo: 'maui'
              MirrorBranch: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}

    # Publish and validation steps. Only run in official builds
    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 3
        enableSymbolValidation: true
        enableSigningValidation: false
        # Disable for now as we test the new signing process
        enableSourceLinkValidation: false
        validateDependsOn:
        - Pack
        publishDependsOn:
        - Validate