# =============================================================================================
# THE .NET package release pipeline.
#
# Azure DevOps entry point. The configured pipeline definition references this path, so the
# filename is part of the release system's operational contract.
#
# This is the shared release system. It is hooked up ONCE in Azure DevOps, and everyone
# triggers *this* pipeline with parameters describing what to release. Nothing consumes this
# repository as a template and no other repository copies it: releasing repositories do not
# change, they are named by parameter.
#
#   Run pipeline -> choose the repository, give it a commit and optional BAR ID, review each
#   applicable human-readable preflight log at its manual gate, then approve or reject.
#
# What it does, in order:
#   1. Prepare the release.
#      1.1. Build and pin the C# tool bundle.
#      1.2. `release resolve` verifies the BAR build and initializes `release-manifest.json`.
#      1.3. Read the BAR ID and workload classification from the manifest.
#      1.4. `darc gather-drop` downloads the build's shipping packages.
#      1.5. `release stage` validates the packages and completes the manifest.
#      1.6. Pin the completed manifest and publish the Release artifact.
#   2. When requested for a workload release, run the separately approved promotion stage.
#   3. Release each applicable package set; workload packs complete before manifests begin.
#      3.1. Verify the pinned artifact and run `release prune-published`.
#      3.2. Publish the exact pruned set as the approval artifact.
#      3.3. Wait at the agentless manual approval gate.
#      3.4. In the production release job, reverify the artifact and refresh pruning.
#      3.5. In publish modes, publish any remaining packages, then run `release verify`.
#   4. Fail if no package-set topology matched the resolved workload classification.
#
# Safety properties worth knowing before you press Run:
#   - `releaseMode` defaults to a package preview. The default run publishes nothing while
#     still exercising package stages, approvals, and production release jobs.
#   - The tool cannot push. `1ES.PublishNuget@1` performs every upload.
#   - Workload repositories publish packs and manifests as two separately gated stages, in
#     that order, because manifests reference packs and NuGet.org packages are immutable.
#
# See docs/design.md for the full rationale.
# =============================================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-${{ parameters.ghOwner }}-${{ parameters.ghRepo }}

trigger: none
pr: none

parameters:
# ---- what to release -----------------------------------------------------------------------
- name: ghOwner
  displayName: GitHub owner
  type: string
  default: dotnet

- name: ghRepo
  displayName: GitHub repository (must be enabled in config/repositories.json)
  type: string
  default: select-repository
  values:
  - select-repository
  - maui
  - android
  - macios
  - android-libraries
  - skiasharp

- name: commitHash
  displayName: Commit to release (full SHA, as registered in BAR)
  type: string

- name: barBuildId
  displayName: "[OPTIONAL] BAR build ID, or 'skip'"
  type: string
  default: skip

# ---- what to actually do --------------------------------------------------------------------
- name: releaseMode
  displayName: What should this release run do?
  type: string
  default: Preview the package release without making changes
  values:
  - Preview the package release without making changes
  - Preview packages and workload promotion without making changes
  - Publish packages to NuGet.org
  - Publish packages and promote the workload build

# ---- selection and recovery -----------------------------------------------------------------
- name: includeFilters
  displayName: "[OPTIONAL] Semicolon-separated package file filters to include, or 'skip'"
  type: string
  default: skip

- name: excludeFilters
  displayName: "[OPTIONAL] Semicolon-separated package file filters to exclude, or 'skip'"
  type: string
  default: skip

- name: recoveryFilters
  displayName: "[RECOVERY] Packages already submitted to NuGet.org, or 'skip'"
  type: string
  default: skip

# ---- infrastructure --------------------------------------------------------------------------
- name: pool
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
    - ImageOverride -equals 1es-windows-2022
    os: windows

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self
- ${{ if in(parameters.releaseMode, 'Publish packages to NuGet.org', 'Publish packages and promote the workload build') }}:
  - name: publishPackages
    value: true
- ${{ else }}:
  - name: publishPackages
    value: false
- ${{ if in(parameters.releaseMode, 'Preview packages and workload promotion without making changes', 'Publish packages and promote the workload build') }}:
  - name: includePromotion
    value: true
- ${{ else }}:
  - name: includePromotion
    value: false
- ${{ if eq(parameters.releaseMode, 'Publish packages and promote the workload build') }}:
  - name: promoteWorkloadSet
    value: true
- ${{ else }}:
  - name: promoteWorkloadSet
    value: false

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.pool }}
    sdl:
      binskim:
        scanOutputDirectoryOnly: true
      codeql:
        runSourceLanguagesInSourceAnalysis: true
      policheck:
        enabled: true
      spotBugs:
        enabled: false
        justification: 'Not a Java repository.'

    stages:

    # -----------------------------------------------------------------------------------------
    # 1. Prepare the release: resolve the build, gather and validate its packages, complete the
    # manifest, and publish the pinned Release artifact.
    # This stage runs for a dry run too — that is the point of a dry run.
    # -----------------------------------------------------------------------------------------
    - stage: prepare_release
      displayName: Prepare release
      dependsOn: []
      jobs:
      - job: prepare_release
        displayName: Resolve, gather and stage
        timeoutInMinutes: 240
        workspace:
          clean: all
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: Publish release manifest and packages
            targetPath: $(Build.ArtifactStagingDirectory)
            artifactName: Release
        steps:
        # `self` is this release-tooling repository. The repository being *released* is never
        # checked out: its packages come from BAR via darc.
        - checkout: self
          clean: true
          persistCredentials: false

        - task: UseDotNet@2
          displayName: Install the .NET SDK
          inputs:
            useGlobalJson: true

        # Build once before any task acquires the Maestro production identity. Publish jobs
        # execute this exact tool bundle from the immutable Release artifact without rebuilding.
        - pwsh: |
            $artifactDirectory = "$(Build.ArtifactStagingDirectory)"
            $toolDirectory = Join-Path $artifactDirectory '_tool'
            dotnet build "$(Build.SourcesDirectory)/src/DotNet.Release/DotNet.Release.csproj" `
              --configuration Release `
              --output $toolDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Failed to build the release tool.' }

            $bundleDirectory = "$(Agent.TempDirectory)/release-tool"
            New-Item -ItemType Directory -Path $bundleDirectory -Force | Out-Null
            Copy-Item -LiteralPath "$(Build.SourcesDirectory)/global.json" -Destination $bundleDirectory
            Copy-Item -LiteralPath $toolDirectory -Destination $bundleDirectory -Recurse

            $bundlePath = Join-Path $artifactDirectory 'release-tool.zip'
            Compress-Archive -Path "$bundleDirectory/*" -DestinationPath $bundlePath -CompressionLevel Optimal

            $toolPath = Join-Path $toolDirectory 'release.dll'
            $bundleHash = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "##vso[task.setvariable variable=ToolPath]$toolPath"
            Write-Host "##vso[task.setvariable variable=ToolBundleHash;isOutput=true]$bundleHash"
          name: buildTool
          displayName: Build the release tool

        - task: AzureCLI@2
          displayName: Resolve and verify the BAR build
          inputs:
            azureSubscription: "Darc: Maestro Production"
            scriptType: pscore
            scriptLocation: inlineScript
            # Queue-time values enter executable PowerShell only through environment
            # variables. Shape validation runs before the tool authenticates with Maestro.
            inlineScript: |
              $ErrorActionPreference = 'Stop'

              if ($env:COMMIT_HASH -notmatch '^[0-9a-fA-F]{40}$') {
                throw "Commit '$env:COMMIT_HASH' is not a 40-character hexadecimal SHA."
              }

              $barId = @()
              if ($env:BAR_BUILD_ID -ne 'skip') {
                if ($env:BAR_BUILD_ID -notmatch '^[0-9]+$') {
                  throw "BAR build ID '$env:BAR_BUILD_ID' is not a positive integer."
                }
                $barId = @('--bar-id', $env:BAR_BUILD_ID)
              }

              if ($env:GH_OWNER -notmatch '^[A-Za-z0-9\-]+$' -or $env:GH_REPO -notmatch '^[A-Za-z0-9\-\._]+$') {
                throw "Repository '$env:GH_OWNER/$env:GH_REPO' contains unexpected characters."
              }

              dotnet "$env:RELEASE_TOOL" `
                resolve `
                --config "$env:CONFIG_PATH" `
                --repo "$env:GH_OWNER/$env:GH_REPO" `
                --commit $env:COMMIT_HASH `
                --manifest "$env:MANIFEST_PATH" `
                @barId
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          env:
            RELEASE_TOOL: $(ToolPath)
            CONFIG_PATH: $(Build.SourcesDirectory)/config/repositories.json
            GH_OWNER: ${{ parameters.ghOwner }}
            GH_REPO: ${{ parameters.ghRepo }}
            COMMIT_HASH: ${{ parameters.commitHash }}
            BAR_BUILD_ID: ${{ parameters.barBuildId }}
            MANIFEST_PATH: $(Build.ArtifactStagingDirectory)/release-manifest.json

        - pwsh: |
            $manifest = Get-Content -LiteralPath $env:MANIFEST_PATH -Raw | ConvertFrom-Json
            $barId = 0
            if (-not [int]::TryParse([string]$manifest.source.barBuildId, [ref]$barId) -or $barId -le 0) {
              throw "The release manifest contains invalid BAR build ID '$($manifest.source.barBuildId)'."
            }
            if ($manifest.source.workload -isnot [bool]) {
              throw "The release manifest contains invalid workload classification '$($manifest.source.workload)'."
            }

            $isWorkload = $manifest.source.workload.ToString().ToLowerInvariant()
            Write-Host "##vso[task.setvariable variable=BarId;isOutput=true]$barId"
            Write-Host "##vso[task.setvariable variable=IsWorkload;isOutput=true]$isWorkload"

            # Match Arcade's established "BAR ID - <id>" build tag format.
            Write-Host "##vso[build.addbuildtag]BAR ID - $barId"
            Write-Host "##vso[build.addbuildtag]REPO - $env:REPOSITORY"
          name: loadResolvedBuild
          displayName: Load resolved release manifest
          env:
            MANIFEST_PATH: $(Build.ArtifactStagingDirectory)/release-manifest.json
            REPOSITORY: ${{ parameters.ghOwner }}/${{ parameters.ghRepo }}

        - task: AzureCLI@2
          displayName: Gather the drop
          inputs:
            azureSubscription: "Darc: Maestro Production"
            scriptType: pscore
            scriptLocation: inlineScript
            # darc owns feed discovery, authentication, retries and --include-released.
            # Invoked here so Azure DevOps owns the exit code and --verbose lands in this log.
            inlineScript: |
              . "$(Build.SourcesDirectory)/eng/common/tools.ps1"
              $darc = Get-Darc
              if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $darc -PathType Leaf)) {
                throw 'Arcade failed to install the Darc CLI.'
              }

              & $darc gather-drop --ci `
                --id $(loadResolvedBuild.BarId) `
                -o "$(Agent.TempDirectory)/drop" `
                --azdev-pat $env:AZDO_TOKEN `
                --include-released `
                --asset-filter '^[^/]+$' `
                --verbose
              if ($LASTEXITCODE -ne 0) { throw "darc gather-drop failed for BAR build $(loadResolvedBuild.BarId)." }
          env:
            AZDO_TOKEN: $(System.AccessToken)

        - pwsh: |
            $ErrorActionPreference = 'Stop'

            $filters = @()
            if ($env:INCLUDE_FILTERS -ne 'skip') {
              $filters += @('--include', $env:INCLUDE_FILTERS)
            }
            if ($env:EXCLUDE_FILTERS -ne 'skip') {
              $filters += @('--exclude', $env:EXCLUDE_FILTERS)
            }

            dotnet "$env:RELEASE_TOOL" `
              stage `
              --config "$env:CONFIG_PATH" `
              --manifest "$env:MANIFEST_PATH" `
              --drop "$env:DROP_DIR" `
              @filters
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          displayName: Validate and stage packages
          env:
            RELEASE_TOOL: $(ToolPath)
            CONFIG_PATH: $(Build.SourcesDirectory)/config/repositories.json
            MANIFEST_PATH: $(Build.ArtifactStagingDirectory)/release-manifest.json
            DROP_DIR: $(Agent.TempDirectory)/drop
            INCLUDE_FILTERS: ${{ parameters.includeFilters }}
            EXCLUDE_FILTERS: ${{ parameters.excludeFilters }}

        # Get-FileHash independently pins the exact manifest bytes written by `release stage`.
        - pwsh: |
            $manifestPath = "$(Build.ArtifactStagingDirectory)/release-manifest.json"
            $hash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Release manifest SHA-256: $hash"
            Write-Host "##vso[task.setvariable variable=ReleaseManifestHash;isOutput=true]$hash"
          name: pinManifest
          displayName: Pin the release manifest hash

        # Record release intent as a build tag. The run name is already fixed at queue time.
        - ${{ if eq(variables.publishPackages, 'true') }}:
          - pwsh: Write-Host '##vso[build.addbuildtag]PUBLISH'
            displayName: Tag this run as PUBLISH

        - ${{ if eq(variables.publishPackages, 'false') }}:
          - pwsh: |
              Write-Host '##vso[build.addbuildtag]DRY-RUN'
              Write-Host 'DRY RUN. Package approval and production release jobs will run.'
              Write-Host 'Nothing will be pushed to NuGet.org and no BAR channel will change.'
              Write-Host 'Review the staged package summary above.'
            displayName: Dry run - nothing will be published

        - ${{ if eq(variables.includePromotion, 'true') }}:
          - pwsh: |
              if ($env:IS_WORKLOAD -ne 'true') {
                throw 'The selected release mode includes workload promotion, but the repository policy classifies this as a package-only repository.'
              }
            displayName: Validate workload promotion mode
            env:
              IS_WORKLOAD: $(loadResolvedBuild.IsWorkload)

    # -----------------------------------------------------------------------------------------
    # 2. Optionally promote the workload build. A BAR mutation, so it remains a separately
    # approved, explicit Darc step.
    # -----------------------------------------------------------------------------------------
    - ${{ if eq(variables.includePromotion, 'true') }}:
      - stage: promote_workload_set
        ${{ if eq(variables.promoteWorkloadSet, 'true') }}:
          displayName: Promote to workload set channel
        ${{ else }}:
          displayName: Preview workload set promotion
        dependsOn: prepare_release
        condition: and(succeeded(), eq(dependencies.prepare_release.outputs['prepare_release.loadResolvedBuild.IsWorkload'], 'true'))
        jobs:
        # Promotion mutates BAR and therefore requires explicit approval of the completed,
        # pinned release manifest.
        - job: promote_approval
          ${{ if eq(variables.promoteWorkloadSet, 'true') }}:
            displayName: Approve workload promotion
          ${{ else }}:
            displayName: Review workload promotion preview
          timeoutInMinutes: 240
          pool: server
          steps:
          - task: ManualValidation@0
            timeoutInMinutes: 120
            inputs:
              ${{ if eq(variables.promoteWorkloadSet, 'true') }}:
                instructions: 'Review the resolved workload target printed by Prepare release, then press "Resume" to add this build to that channel. This mutates BAR.'
              ${{ else }}:
                instructions: 'DRY RUN: Review the workload target printed by Prepare release, then press "Resume" to validate the promotion job without changing BAR.'
              onTimeout: reject

        - job: promote
          ${{ if eq(variables.promoteWorkloadSet, 'true') }}:
            displayName: Add build to workload set channel
          ${{ else }}:
            displayName: Validate workload promotion job
          timeoutInMinutes: 60
          dependsOn: promote_approval
          condition: eq(dependencies.promote_approval.result, 'Succeeded')
          variables:
            ReleaseManifestHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinManifest.ReleaseManifestHash'] ]
          templateContext:
            inputs:
            - input: pipelineArtifact
              artifactName: Release
              targetPath: $(Pipeline.Workspace)/Release
          steps:
          - checkout: self
            clean: true
            persistCredentials: false

          - pwsh: |
              $manifestPath = "$(Pipeline.Workspace)/Release/release-manifest.json"
              $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($manifestHash -ne $env:EXPECTED_MANIFEST_HASH) {
                throw "Release manifest hash '$manifestHash' does not match the prepared hash '$env:EXPECTED_MANIFEST_HASH'."
              }
            displayName: Verify release manifest integrity
            env:
              EXPECTED_MANIFEST_HASH: $(ReleaseManifestHash)

          - ${{ if eq(variables.promoteWorkloadSet, 'true') }}:
            - task: AzureCLI@2
              displayName: Add build to channel
              inputs:
                azureSubscription: "Darc: Maestro Production"
                scriptType: pscore
                scriptLocation: inlineScript
                # Channel and BAR build ID come from the pinned manifest, so there is one
                # source of truth.
                inlineScript: |
                  $manifest = Get-Content "$(Pipeline.Workspace)/Release/release-manifest.json" -Raw | ConvertFrom-Json
                  . "$(Build.SourcesDirectory)/eng/common/tools.ps1"
                  $darc = Get-Darc
                  if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $darc -PathType Leaf)) {
                    throw 'Arcade failed to install the Darc CLI.'
                  }

                  & $darc add-build-to-channel --ci `
                    --channel "$($manifest.workloadSet.channel)" `
                    --id "$($manifest.source.barBuildId)" `
                    --skip-assets-publishing `
                    --azdev-pat $env:AZDO_TOKEN --verbose
                  if ($LASTEXITCODE -ne 0) { throw 'darc add-build-to-channel failed.' }
              env:
                AZDO_TOKEN: $(System.AccessToken)

          - ${{ else }}:
            - task: AzureCLI@2
              displayName: Validate promotion tooling
              inputs:
                azureSubscription: "Darc: Maestro Production"
                scriptType: pscore
                scriptLocation: inlineScript
                inlineScript: |
                  $manifest = Get-Content "$(Pipeline.Workspace)/Release/release-manifest.json" -Raw | ConvertFrom-Json
                  . "$(Build.SourcesDirectory)/eng/common/tools.ps1"
                  $darc = Get-Darc
                  if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $darc -PathType Leaf)) {
                    throw 'Arcade failed to install the Darc CLI.'
                  }

                  Write-Host "DRY RUN. BAR build $($manifest.source.barBuildId) would be added to '$($manifest.workloadSet.channel)'."

    # -----------------------------------------------------------------------------------------
    # 3. Run the applicable package-set stages on every run. The internal template includes
    # NuGet.org mutation and post-publish verification only in publish modes.
    # -----------------------------------------------------------------------------------------
    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_packs
        displayName: Release workload packs
        setName: ReleasePacks
        preparedArtifactName: PreparedReleasePacks
        expectedWorkload: 'true'
        publishPackages: ${{ eq(variables.publishPackages, 'true') }}
        ${{ if eq(variables.includePromotion, 'true') }}:
          dependsOn: [prepare_release, promote_workload_set]
        ${{ else }}:
          dependsOn: [prepare_release]
        approvalInstructions: 'Review every package and disposition printed by the preceding preflight job, then press "Resume" to publish the pending workload packs.'
        dryRunApprovalInstructions: 'DRY RUN: Review every package and disposition printed by the preceding preflight job, then press "Resume" to rehearse the production release job. Nothing will be published.'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    # Manifests reference packs, so manifest approval is unreachable until the pack stage
    # verifies publication or completes its dry-run rehearsal.
    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_manifests
        displayName: Release workload manifests
        setName: ReleaseManifests
        preparedArtifactName: PreparedReleaseManifests
        expectedWorkload: 'true'
        publishPackages: ${{ eq(variables.publishPackages, 'true') }}
        dependsOn: [prepare_release, publish_packs]
        approvalInstructions: 'Packs are verified. Review every manifest and disposition printed by the preceding preflight job, then press "Resume".'
        dryRunApprovalInstructions: 'DRY RUN: The pack rehearsal succeeded. Review every manifest and disposition printed by the preceding preflight job, then press "Resume" to rehearse the manifest release job. Nothing will be published.'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_packages
        displayName: Release NuGet packages
        setName: ReleasePackages
        preparedArtifactName: PreparedReleasePackages
        expectedWorkload: 'false'
        publishPackages: ${{ eq(variables.publishPackages, 'true') }}
        dependsOn: [prepare_release]
        approvalInstructions: 'Review every package and disposition printed by the preceding preflight job, then press "Resume" to publish the pending packages.'
        dryRunApprovalInstructions: 'DRY RUN: Review every package and disposition printed by the preceding preflight job, then press "Resume" to rehearse the production release job. Nothing will be published.'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    # 4. If the workload output is missing or invalid, all package-set stages skip. Turn that
    # otherwise-green result into a failure.
    - stage: fail_if_no_release_topology
      displayName: Validate release topology
      dependsOn: [prepare_release, publish_packs, publish_manifests, publish_packages]
      condition: and(always(), eq(dependencies.prepare_release.result, 'Succeeded'), eq(dependencies.publish_packs.result, 'Skipped'), eq(dependencies.publish_manifests.result, 'Skipped'), eq(dependencies.publish_packages.result, 'Skipped'))
      jobs:
      - job: fail
        steps:
        - pwsh: throw 'No package-set stage ran. The IsWorkload output is missing or invalid.'
          displayName: Fail closed
