# =============================================================================================
# THE .NET package release pipeline.
#
# Azure DevOps entry point. The configured pipeline definition references this path, so the
# filename is part of the release system's operational contract.
#
# This is the shared release system. It is hooked up ONCE in Azure DevOps, and everyone
# triggers *this* pipeline with parameters describing what to release. Nothing consumes this
# repository as a template and no other repository copies it: releasing repositories do not
# change, they are named by parameter.
#
#   Run pipeline -> choose the repository, give it a commit (or a BAR ID), review the audit
#   at the manual gate, approve, done.
#
# What it does, in order:
#   1. build the C# tool once into the Release artifact
#   2. `release plan`  - resolve and verify the BAR build for the requested repo/commit
#   3. `darc gather-drop` - download that build's shipping packages
#   4. `release stage`  - validate every package, write the hashed release plan, stage artifacts
#   5. manual approval gate (agentless)
#   6. `release prune-published` -> approval -> refresh -> `1ES.PublishNuget@1` -> verification
#
# Safety properties worth knowing before you press Run:
#   - `publishPackages` defaults to FALSE. The default run is a dry run that publishes
#     nothing and does not even emit the publish stages.
#   - The tool cannot push. `1ES.PublishNuget@1` performs every upload.
#   - Workload repositories publish packs and manifests as two separately gated stages, in
#     that order, because manifests reference packs and NuGet.org packages are immutable.
#
# See docs/design.md for the full rationale.
# =============================================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-${{ parameters.ghOwner }}-${{ parameters.ghRepo }}

trigger: none
pr: none

parameters:
# ---- what to release -----------------------------------------------------------------------
- name: ghOwner
  displayName: GitHub owner
  type: string
  default: dotnet

- name: ghRepo
  displayName: GitHub repository (must be enabled in config/repositories.json)
  type: string
  default: select-repository
  values:
  - select-repository
  - maui
  - android
  - macios
  - android-libraries
  - skiasharp

- name: commitHash
  displayName: Commit to release (full SHA, as registered in BAR)
  type: string

- name: barBuildId
  displayName: "[OPTIONAL] BAR build ID, or 'none'"
  type: string
  default: none

# ---- what to actually do --------------------------------------------------------------------
- name: publishPackages
  displayName: "PUBLISH to NuGet.org. Leave unchecked for a dry run."
  type: boolean
  default: false

- name: promoteWorkloadSet
  displayName: "Workload repos only: promote the build to its workload-set channel"
  type: boolean
  default: false

# ---- selection and recovery -----------------------------------------------------------------
- name: includeFilters
  displayName: "[OPTIONAL] Semicolon-separated package file filters to include, or 'none'"
  type: string
  default: none

- name: excludeFilters
  displayName: "[OPTIONAL] Semicolon-separated package file filters to exclude, or 'none'"
  type: string
  default: none

- name: recoveryFilters
  displayName: "[RECOVERY] Packages already submitted to NuGet.org, or 'none'"
  type: string
  default: none

# ---- infrastructure --------------------------------------------------------------------------
- name: pool
  type: object
  default:
    name: NetCore1ESPool-Internal
    demands:
    - ImageOverride -equals 1es-windows-2022
    os: windows

variables:
- template: /eng/common/templates/variables/pool-providers.yml@self

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.pool }}
    sdl:
      binskim:
        scanOutputDirectoryOnly: true
      codeql:
        runSourceLanguagesInSourceAnalysis: true
      policheck:
        enabled: true
      spotBugs:
        enabled: false
        justification: 'Not a Java repository.'

    stages:

    # -----------------------------------------------------------------------------------------
    # Prepare. Resolve the build, gather its packages, validate them, stage the artifacts.
    # This stage runs for a dry run too — that is the point of a dry run.
    # -----------------------------------------------------------------------------------------
    - stage: prepare_release
      displayName: Prepare release
      dependsOn: []
      jobs:
      - job: prepare_release
        displayName: Resolve, gather and stage
        timeoutInMinutes: 240
        workspace:
          clean: all
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: Publish release plan and packages
            targetPath: $(Build.ArtifactStagingDirectory)
            artifactName: Release
        steps:
        # `self` is this release-tooling repository. The repository being *released* is never
        # checked out: its packages come from BAR via darc.
        - checkout: self
          clean: true
          persistCredentials: false

        - task: UseDotNet@2
          displayName: Install the .NET SDK
          inputs:
            useGlobalJson: true

        # Build once before any task acquires the Maestro production identity. Publish jobs
        # execute this exact tool directory from the immutable Release artifact without rebuilding.
        - pwsh: |
            $toolDirectory = "$(Build.ArtifactStagingDirectory)/_tool"
            dotnet build "$(Build.SourcesDirectory)/src/DotNet.Release/DotNet.Release.csproj" `
              --configuration Release `
              --output $toolDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Failed to build the release tool.' }

            $toolPath = Join-Path $toolDirectory 'release.dll'
            $toolHash = & "$(Build.SourcesDirectory)/eng/scripts/Get-ReleaseToolHash.ps1" `
              -Path $toolDirectory
            Write-Host "##vso[task.setvariable variable=ToolPath]$toolPath"
            Write-Host "##vso[task.setvariable variable=ToolHash;isOutput=true]$toolHash"
          name: buildTool
          displayName: Build the release tool

        - task: AzureCLI@2
          name: releasePlan
          displayName: Resolve and verify the BAR build
          inputs:
            azureSubscription: "Darc: Maestro Production"
            scriptType: pscore
            scriptLocation: inlineScript
            # Queue-time values enter executable PowerShell only through environment
            # variables. Shape validation runs before the tool authenticates with Maestro.
            inlineScript: |
              $ErrorActionPreference = 'Stop'

              if ($env:COMMIT_HASH -notmatch '^[0-9a-fA-F]{40}$') {
                throw "Commit '$env:COMMIT_HASH' is not a 40-character hexadecimal SHA."
              }

              $barId = @()
              if ($env:BAR_BUILD_ID -ne 'none') {
                if ($env:BAR_BUILD_ID -notmatch '^[0-9]+$') {
                  throw "BAR build ID '$env:BAR_BUILD_ID' is not a positive integer."
                }
                $barId = @('--bar-id', $env:BAR_BUILD_ID)
              }

              if ($env:GH_OWNER -notmatch '^[A-Za-z0-9\-]+$' -or $env:GH_REPO -notmatch '^[A-Za-z0-9\-\._]+$') {
                throw "Repository '$env:GH_OWNER/$env:GH_REPO' contains unexpected characters."
              }

              dotnet "$env:RELEASE_TOOL" `
                plan `
                --config "$env:CONFIG_PATH" `
                --repo "$env:GH_OWNER/$env:GH_REPO" `
                --commit $env:COMMIT_HASH `
                --out "$env:STAGE_DIR" `
                @barId
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          env:
            RELEASE_TOOL: $(ToolPath)
            CONFIG_PATH: $(Build.SourcesDirectory)/config/repositories.json
            STAGE_DIR: $(Agent.TempDirectory)/stage
            GH_OWNER: ${{ parameters.ghOwner }}
            GH_REPO: ${{ parameters.ghRepo }}
            COMMIT_HASH: ${{ parameters.commitHash }}
            BAR_BUILD_ID: ${{ parameters.barBuildId }}

        - task: AzureCLI@2
          displayName: Gather the drop
          inputs:
            azureSubscription: "Darc: Maestro Production"
            scriptType: pscore
            scriptLocation: inlineScript
            # darc owns feed discovery, authentication, retries and --include-released.
            # Invoked here so Azure DevOps owns the exit code and --verbose lands in this log.
            inlineScript: |
              darc gather-drop --ci `
                --id $(releasePlan.BarId) `
                -o "$(Agent.TempDirectory)/drop" `
                --azdev-pat $env:AZDO_TOKEN `
                --include-released `
                --asset-filter '^[^/]+$' `
                --verbose
              if ($LASTEXITCODE -ne 0) { throw "darc gather-drop failed for BAR build $(releasePlan.BarId)." }
          env:
            AZDO_TOKEN: $(System.AccessToken)

        - pwsh: |
            $ErrorActionPreference = 'Stop'

            $filters = @()
            if ($env:INCLUDE_FILTERS -ne 'none') {
              $filters += @('--include', $env:INCLUDE_FILTERS)
            }
            if ($env:EXCLUDE_FILTERS -ne 'none') {
              $filters += @('--exclude', $env:EXCLUDE_FILTERS)
            }

            dotnet "$env:RELEASE_TOOL" `
              stage `
              --config "$env:CONFIG_PATH" `
              --plan "$env:STAGE_DIR/plan.json" `
              --drop "$env:DROP_DIR" `
              --out "$env:ARTIFACT_DIR" `
              @filters
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          displayName: Validate and stage packages
          env:
            RELEASE_TOOL: $(ToolPath)
            CONFIG_PATH: $(Build.SourcesDirectory)/config/repositories.json
            STAGE_DIR: $(Agent.TempDirectory)/stage
            DROP_DIR: $(Agent.TempDirectory)/drop
            ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)
            INCLUDE_FILTERS: ${{ parameters.includeFilters }}
            EXCLUDE_FILTERS: ${{ parameters.excludeFilters }}

        # Get-FileHash independently pins the exact plan bytes written by release stage.
        - pwsh: |
            $planPath = "$(Build.ArtifactStagingDirectory)/release-plan.json"
            $hash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Release plan SHA-256: $hash"
            Write-Host "##vso[task.setvariable variable=ReleasePlanHash;isOutput=true]$hash"
          name: pinPlan
          displayName: Pin the release plan hash

        # Record release intent as a build tag. The run name is already fixed at queue time.
        - ${{ if eq(parameters.publishPackages, true) }}:
          - pwsh: Write-Host '##vso[build.addbuildtag]PUBLISH'
            displayName: Tag this run as PUBLISH

          - ${{ if eq(parameters.promoteWorkloadSet, true) }}:
            - pwsh: |
                if ($env:IS_WORKLOAD -ne 'true') {
                  Write-Host '##vso[task.logissue type=warning]promoteWorkloadSet applies only to workload repositories and will be skipped.'
                }
              displayName: Check promotion applicability
              env:
                IS_WORKLOAD: $(releasePlan.IsWorkload)

        - ${{ if eq(parameters.publishPackages, false) }}:
          - pwsh: |
              Write-Host '##vso[build.addbuildtag]DRY-RUN'
              Write-Host 'DRY RUN. The publish stages do not exist in this run.'
              Write-Host 'Nothing will be pushed to NuGet.org and no BAR channel will change.'
              Write-Host 'Review the staged artifacts and release-plan.json above.'
            displayName: Dry run - nothing will be published

          # Report that promotion is inactive when publishing is disabled.
          - ${{ if eq(parameters.promoteWorkloadSet, true) }}:
            - pwsh: |
                Write-Host '##vso[task.logissue type=warning]promoteWorkloadSet was requested but is ignored on a dry run. Re-run with publishPackages enabled to promote.'
              displayName: Warn - promotion ignored on a dry run

    # -----------------------------------------------------------------------------------------
    # Promote to the workload-set channel. A BAR mutation, so it stays an explicit darc step.
    # -----------------------------------------------------------------------------------------
    - ${{ if and(eq(parameters.promoteWorkloadSet, true), eq(parameters.publishPackages, true)) }}:
      - stage: promote_workload_set
        displayName: Promote to workload set channel
        dependsOn: prepare_release
        condition: and(succeeded(), eq(dependencies.prepare_release.outputs['prepare_release.releasePlan.IsWorkload'], 'true'))
        jobs:
        # Promotion mutates BAR and therefore requires explicit approval of the staged plan.
        - job: promote_approval
          displayName: Wait to promote
          timeoutInMinutes: 240
          pool: server
          steps:
          - task: ManualValidation@0
            timeoutInMinutes: 120
            inputs:
              instructions: 'Review release-plan.json, then press "Resume" to add this build to its workload-set channel. This mutates BAR.'
              onTimeout: reject

        - job: promote
          displayName: Add build to workload set channel
          timeoutInMinutes: 60
          dependsOn: promote_approval
          condition: eq(dependencies.promote_approval.result, 'Succeeded')
          variables:
            ReleasePlanHash: $[ stageDependencies.prepare_release.prepare_release.outputs['pinPlan.ReleasePlanHash'] ]
          templateContext:
            inputs:
            - input: pipelineArtifact
              artifactName: Release
              targetPath: $(Pipeline.Workspace)/Release
          steps:
          - checkout: self
            clean: true
            persistCredentials: false

          - pwsh: |
              $planPath = "$(Pipeline.Workspace)/Release/release-plan.json"
              $planHash = (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($planHash -ne $env:EXPECTED_PLAN_HASH) {
                throw "Release plan hash '$planHash' does not match the prepared hash '$env:EXPECTED_PLAN_HASH'."
              }
            displayName: Verify release plan integrity
            env:
              EXPECTED_PLAN_HASH: $(ReleasePlanHash)

          - task: AzureCLI@2
            displayName: Add build to channel
            inputs:
              azureSubscription: "Darc: Maestro Production"
              scriptType: pscore
              scriptLocation: inlineScript
              # Channel and feed are read from the plan, so there is one source of truth.
              inlineScript: |
                $plan = Get-Content "$(Pipeline.Workspace)/Release/release-plan.json" -Raw | ConvertFrom-Json
                darc add-build-to-channel --ci `
                  --channel "$($plan.workloadSet.channel)" `
                  --id "$($plan.source.barBuildId)" `
                  --skip-assets-publishing `
                  --azdev-pat $env:AZDO_TOKEN --verbose
                if ($LASTEXITCODE -ne 0) { throw 'darc add-build-to-channel failed.' }
            env:
              AZDO_TOKEN: $(System.AccessToken)

    # -----------------------------------------------------------------------------------------
    # Validate the package-set jobs and artifact wiring on every run. The internal template
    # includes approval, push, and verification only when publishing.
    # -----------------------------------------------------------------------------------------
    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_packs
        displayName: Release workload packs
        setName: ReleasePacks
        preparedArtifactName: PreparedReleasePacks
        expectedWorkload: 'true'
        publishPackages: ${{ parameters.publishPackages }}
        ${{ if and(eq(parameters.promoteWorkloadSet, true), eq(parameters.publishPackages, true)) }}:
          dependsOn: [prepare_release, promote_workload_set]
        ${{ else }}:
          dependsOn: [prepare_release]
        approvalInstructions: 'Review release-prune.json and the exact nupkgs in PreparedReleasePacks, then press "Resume" to publish them.'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    # Manifests reference packs, so manifest approval is unreachable until pack
    # verification succeeds.
    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_manifests
        displayName: Release workload manifests
        setName: ReleaseManifests
        preparedArtifactName: PreparedReleaseManifests
        expectedWorkload: 'true'
        publishPackages: ${{ parameters.publishPackages }}
        dependsOn: [prepare_release, publish_packs]
        approvalInstructions: 'Packs are verified. Review release-prune.json and the exact nupkgs in PreparedReleaseManifests, then press "Resume".'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    - template: /eng/pipelines/stages/publish-set.yml@self
      parameters:
        stageName: publish_packages
        displayName: Release NuGet packages
        setName: ReleasePackages
        preparedArtifactName: PreparedReleasePackages
        expectedWorkload: 'false'
        publishPackages: ${{ parameters.publishPackages }}
        dependsOn: [prepare_release]
        approvalInstructions: 'Review release-prune.json and the exact nupkgs in PreparedReleasePackages, then press "Resume" to publish them.'
        recoveryFilters: ${{ parameters.recoveryFilters }}

    # If the workload output is missing or invalid, all release stages skip. Turn that
    # otherwise-green result into a failure.
    - stage: fail_if_no_release_topology
      displayName: Validate release topology
      dependsOn: [publish_packs, publish_manifests, publish_packages]
      condition: and(always(), eq(dependencies.publish_packs.result, 'Skipped'), eq(dependencies.publish_manifests.result, 'Skipped'), eq(dependencies.publish_packages.result, 'Skipped'))
      jobs:
      - job: fail
        steps:
        - pwsh: throw 'No package-set stage ran. The IsWorkload output is missing or invalid.'
          displayName: Fail closed
