trigger:
  batch: true
  branches:
    include:
    - main
    - net11
    - release/*
    - net*.0
    - inflight/*
    - candidate/*
    - darc-*
    # `/review run-ui-tests` dispatch commits (see eng/pipelines/common/run-tests-request.yml).
    - run-tests/*
  tags:
    include:
    - '*'
  paths:
    include:
    - '*'
    - .github/scripts/shared/**
    exclude:
    - .github
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

pr:
  branches:
    include:
    - automation/release/*
    - main
    - net11
    - release/*
    - net*.0
    - inflight/*
    - candidate/*
  paths:
    include:
    - '*'
    - .github/scripts/shared/**
    exclude:
    - .github
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

variables:
  - template: /eng/pipelines/common/variables.yml@self
  - name: IosUITestImageOverride
    value: ACES_VM_SharedPool_Tahoe
  # A `/review run-ui-tests` dispatch branch carries the AI selection for one PR (RunTests* variables).
  - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/run-tests/') }}:
    - template: /eng/pipelines/common/run-tests-request.yml@self

parameters:

  - name: selectedRun
    type: boolean
    default: false

  # /review run-ui-tests selection: on which platforms each UI test category runs. Every value comes
  # from a fixed list, because Azure DevOps lets an identity with only 'Queue builds' set such
  # parameters, while free-text or object parameters need 'Edit queue build configuration'.
  # Platforms are joined with '+'; uitestPlatform* say which platforms build and run at all.
  # One uitest_<Category> per category in eng/pipelines/common/ui-tests.yml (RunTests.Tests.ps1
  # checks they stay in sync).
  - name: uitestPlatformAndroid
    type: boolean
    default: false
  - name: uitestPlatformIos
    type: boolean
    default: false
  - name: uitestPlatformCatalyst
    type: boolean
    default: false
  - name: uitestPlatformWindows
    type: boolean
    default: false
  - name: uitest_Accessibility
    type: string
    default: none
    values: [none, android, ios, catalyst, windows, android+ios, android+catalyst, android+windows, ios+catalyst, ios+windows, catalyst+windows, android+ios+catalyst, android+ios+windows, android+catalyst+windows, ios+catalyst+windows, android+ios+catalyst+windows]
