stages:

  - template: common/ui-tests.yml
    parameters:
      # A selection (/review run-ui-tests) only narrows pull-request builds. Branch, scheduled and
      # manual builds of main, release/*, candidate/* and the other CI branches always run the
      # full suite, whatever parameters they were queued with.
      ${{ if startsWith(variables['Build.SourceBranch'], 'refs/pull/') }}:
        selectedRun: ${{ parameters.selectedRun }}
        ${{ if eq(parameters.selectedRun, true) }}:
          # Platforms with at least one selected category, and every selection as <platform>:<Category>.
          selectedPlatforms:
            - ${{ if eq(parameters.uitestPlatformAndroid, true) }}:
              - android
            - ${{ if eq(parameters.uitestPlatformIos, true) }}:
              - ios
            - ${{ if eq(parameters.uitestPlatformCatalyst, true) }}:
              - catalyst
            - ${{ if eq(parameters.uitestPlatformWindows, true) }}:
              - windows
          selectedCategories:
            # Never empty: an empty list means every category. 'none:none' matches no stage or job.
            - none:none
            - ${{ each selection in parameters }}:
              - ${{ if and(startsWith(selection.key, 'uitest_'), ne(selection.value, 'none')) }}:
                - ${{ each platform in split(selection.value, '+') }}:
                  - ${{ format('{0}:{1}', platform, replace(selection.key, 'uitest_', '')) }}
      # A `/review run-ui-tests` dispatch branch: the selection comes from run-tests-request.yml, written by
      # .github/scripts/Invoke-RunTests.ps1 with the same values the parameters above would carry.
      # Only RunTestsMode 'full' keeps the defaults (every category on every platform); any other value
      # narrows to the listed platforms and categories, so an unfilled request runs nothing.
      ${{ if and(startsWith(variables['Build.SourceBranch'], 'refs/heads/run-tests/'), ne(variables['RunTestsMode'], 'full')) }}:
        selectedRun: true
        selectedPlatforms:
          - ${{ each platform in split(variables['RunTestsPlatforms'], ',') }}:
            - ${{ if ne(platform, '') }}:
              - ${{ platform }}
        selectedCategories:
          # Never empty: an empty list means every category. 'none:none' matches no stage or job.
          - none:none
          - ${{ each category in split(variables['RunTestsCategories'], ',') }}:
            - ${{ if ne(category, '') }}:
              - ${{ category }}
      iosXcodeVersion: ${{ parameters.iosXcodeVersion }}
      # Select pools based on pipeline - internal vs public
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        androidPool: ${{ parameters.androidPoolInternal }}
        androidLinuxPool: ${{ parameters.androidPoolLinuxInternal }}
        iosPool: ${{ parameters.iosPoolInternal }}
        windowsPool: ${{ parameters.windowsPoolInternal }}
        windowsBuildPool: ${{ parameters.windowsBuildPoolInternal }}
        macosPool: ${{ parameters.macosPoolInternal }}
      ${{ else }}:
        androidPool: ${{ parameters.androidPoolPublic }}
        androidLinuxPool: ${{ parameters.androidPoolLinuxPublic }}
        iosPool: ${{ parameters.iosPoolPublic }}
        windowsPool: ${{ parameters.windowsPoolPublic }}
        windowsBuildPool: ${{ parameters.windowsBuildPoolPublic }}
        macosPool: ${{ parameters.macosPoolPublic }}
      # BuildNativeAOT is false by default, but true in devdiv environment
      BuildNativeAOT: ${{ or(parameters.BuildNativeAOT, and(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['System.TeamProject'], 'devdiv'))) }}
      RunNativeAOT: ${{ parameters.RunNativeAOT }}
      # `/review run-ui-tests` dispatch branches build a PR, so they get the pull-request lanes.
      ${{ if or(parameters.BuildEverything, and(ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/run-tests/')))) }}:
        androidApiLevels: [ 30 ]
        iosVersions: [ '18.5', 'latest' ]
      ${{ else }}:
        androidApiLevels: [ 30 ]
        iosVersions: [ 'latest' ]
      projects:
        - name: controls
          desc: Controls
          androidApiLevelsExclude: [25] # Ignore for now API25 since the runs's are not stable
          android: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Android.Tests/Controls.TestCases.Android.Tests.csproj
          app: $(Pipeline.Workspace)/Controls.TestCases.HostApp/
          iosVersionsExclude: [ '12.4'] # Ignore iOS 12.4 while we can't make it work on CI
          ios: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.iOS.Tests/Controls.TestCases.iOS.Tests.csproj
          winui: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.WinUI.Tests/Controls.TestCases.WinUI.Tests.csproj
          mac: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Mac.Tests/Controls.TestCases.Mac.Tests.csproj
