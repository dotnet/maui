# TEMPORARY probe (do not merge): can the maui-pr-uitests job token queue maui-pr-uitests?
trigger: none
pr:
  branches:
    include:
    - main
parameters:
  - name: selectedRun
    type: boolean
    default: false
  - name: uitestPlatformAndroid
    type: boolean
    default: false
stages:
- stage: probe
  jobs:
  - job: probe
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none
    - ${{ if eq(parameters.selectedRun, true) }}:
      - script: echo "Queued by the probe with selectedRun=true; nothing to do."
    - ${{ else }}:
      - pwsh: |
          $headers = @{ Authorization = "Bearer $env:TOKEN" }
          $org = "$env:SYSTEM_COLLECTIONURI".TrimEnd('/')
          $cd = Invoke-RestMethod "$org/_apis/connectionData" -Headers $headers
          Write-Host "Identity: $($cd.authenticatedUser.providerDisplayName) ($($cd.authenticatedUser.id))"
          $tok = [uri]::EscapeDataString("$env:SYSTEM_TEAMPROJECTID/dotnet/maui/313")
          foreach ($bit in 128, 32768) {
            try { $r = Invoke-RestMethod "$org/_apis/permissions/33344d9c-fc72-4d6f-aba5-fa317101a7e9/$($bit)?tokens=$tok&api-version=7.1" -Headers $headers; Write-Host "Permission $bit => $($r.value -join ',')" } catch { Write-Host "Permission $bit check failed: $($_.Exception.Message) $($_.ErrorDetails.Message)" }
          }
          $body = @{
            definition = @{ id = 313 }
            reason = 'pullRequest'
            sourceBranch = "$env:BUILD_SOURCEBRANCH"
            sourceVersion = "$env:BUILD_SOURCEVERSION"
            triggerInfo = @{ 'pr.sourceBranch' = "$env:SYSTEM_PULLREQUEST_SOURCEBRANCH"; 'pr.sourceSha' = "$env:SYSTEM_PULLREQUEST_SOURCECOMMITID"; 'pr.targetBranch' = 'main'; 'pr.number' = "$env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER"; 'pr.id' = "$env:SYSTEM_PULLREQUEST_PULLREQUESTID"; 'pr.isFork' = 'False' }
            templateParameters = @{ selectedRun = 'true'; uitestPlatformAndroid = 'true' }
          } | ConvertTo-Json -Depth 5
          try {
            $b = Invoke-RestMethod -Method Post "$($org)/$env:SYSTEM_TEAMPROJECTID/_apis/build/builds?api-version=7.1" -Headers $headers -ContentType 'application/json' -Body $body
            Write-Host "QUEUE OK: build $($b.id) reason=$($b.reason) params=$($b.templateParameters | ConvertTo-Json -Compress)"
          } catch { Write-Host "QUEUE FAILED: $($_.Exception.Message) $($_.ErrorDetails.Message)" }
        env:
          TOKEN: $(System.AccessToken)
