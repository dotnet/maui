# Temporary probe for runtime UI-test selection mechanics. Not for merge.
trigger: none
pr: none

variables:
  probeSha: 85ec75d5adf6d971020107b5d0549dd2a789e486

stages:
- stage: sel
  dependsOn: []
  jobs:
  - job: select
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    timeoutInMinutes: 15
    steps:
    - checkout: self
      fetchDepth: 1
      fetchTags: false
      sparseCheckoutDirectories: eng/scripts
    - pwsh: |
        Write-Host "Reason=$env:BUILD_REASON Branch=$env:BUILD_SOURCEBRANCH Version=$env:BUILD_SOURCEVERSION PRSource=$env:SYSTEM_PULLREQUEST_SOURCECOMMITID PRNumber=$env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER Agent=$env:AGENT_VERSION"
        git cat-file -p HEAD | Select-Object -First 4
        Write-Host "Top-level entries:"; Get-ChildItem -Force -Name
        Write-Host "eng/scripts present: $(Test-Path eng/scripts) src present: $(Test-Path src)"
        $url = "https://api.github.com/repos/dotnet/maui/commits/$(probeSha)/check-runs?check_name=$([uri]::EscapeDataString('maui-pr-uitests (test selection)'))&filter=latest"
        for ($i = 0; $i -lt 2; $i++) {
          $r = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -Headers @{ Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Write-Host "GitHub status $($r.StatusCode) limit $($r.Headers['X-RateLimit-Limit']) remaining $($r.Headers['X-RateLimit-Remaining']) reset $($r.Headers['X-RateLimit-Reset']) total_count $((($r.Content | ConvertFrom-Json).total_count))"
        }
        Write-Host '##vso[task.setvariable variable=applies;isOutput=true]true'
        Write-Host '##vso[task.setvariable variable=lane;isOutput=true]{"Button":{"CATEGORYGROUP":"Button"},"Label":{"CATEGORYGROUP":"Label"}}'
        Write-Host '##vso[task.setvariable variable=buildA;isOutput=true]false'
      name: selection
      displayName: Probe selection

- stage: t_cross
  dependsOn: sel
  condition: and(not(canceled()), eq(dependencies.sel.outputs['select.selection.applies'], 'true'))
  jobs:
  - job: selected
    condition: eq(stageDependencies.sel.select.outputs['selection.applies'], 'true')
    strategy:
      matrix: $[ stageDependencies.sel.select.outputs['selection.lane'] ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "leg CATEGORYGROUP=[$env:CATEGORYGROUP]"
  - job: static
    condition: ne(stageDependencies.sel.select.outputs['selection.applies'], 'true')
    strategy:
      matrix:
        'Border,BoxView':
          CATEGORYGROUP: Border,BoxView
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "static CATEGORYGROUP=[$env:CATEGORYGROUP]"

- stage: t_missing_false
  dependsOn: sel
  jobs:
  - job: missing
    condition: eq(stageDependencies.sel.select.outputs['selection.applies'], 'false')
    strategy:
      matrix: $[ stageDependencies.sel.select.outputs['selection.missing'] ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "missing leg [$env:CATEGORYGROUP]"
  - job: sibling
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host sibling

- stage: t_coalesce
  dependsOn: sel
  jobs:
  - job: placeholder
    strategy:
      matrix: $[ coalesce(stageDependencies.sel.select.outputs['selection.missing'], '{"none":{"CATEGORYGROUP":"none"}}') ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "placeholder leg [$env:CATEGORYGROUP]"

- stage: t_gen
  dependsOn: sel
  jobs:
  - job: gen
    variables:
      laneJson: $[ stageDependencies.sel.select.outputs['selection.lane'] ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "##vso[task.setvariable variable=lane;isOutput=true]$env:LANEJSON"
      name: emit
  - job: use
    dependsOn: gen
    strategy:
      matrix: $[ dependencies.gen.outputs['emit.lane'] ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "gen leg [$env:CATEGORYGROUP]"

- stage: build_skipped
  dependsOn: sel
  condition: and(not(canceled()), or(ne(dependencies.sel.outputs['select.selection.applies'], 'true'), eq(dependencies.sel.outputs['select.selection.buildA'], 'true')))
  jobs:
  - job: b
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "should not run"

- stage: test_after_skipped
  dependsOn: [build_skipped, sel]
  condition: and(not(canceled()), succeeded('build_skipped'), or(ne(dependencies.sel.outputs['select.selection.applies'], 'true'), eq(dependencies.sel.outputs['select.selection.buildA'], 'true')))
  jobs:
  - job: t
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "should not run"

- stage: sel_fail
  dependsOn: []
  jobs:
  - job: select
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: exit 1
      name: selection

- stage: full_on_fail
  dependsOn: sel_fail
  condition: and(not(canceled()), ne(dependencies.sel_fail.outputs['select.selection.applies'], 'true'))
  jobs:
  - job: static
    condition: ne(stageDependencies.sel_fail.select.outputs['selection.applies'], 'true')
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "full run after failed selection"
  - job: selected
    condition: eq(stageDependencies.sel_fail.select.outputs['selection.applies'], 'true')
    strategy:
      matrix: $[ coalesce(stageDependencies.sel_fail.select.outputs['selection.lane'], '{"none":{"CATEGORYGROUP":"none"}}') ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "should not run"

- stage: full_on_fail_nocoalesce
  dependsOn: sel_fail
  condition: and(not(canceled()), ne(dependencies.sel_fail.outputs['select.selection.applies'], 'true'))
  jobs:
  - job: static
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "full run"
  - job: selected
    condition: eq(stageDependencies.sel_fail.select.outputs['selection.applies'], 'true')
    strategy:
      matrix: $[ stageDependencies.sel_fail.select.outputs['selection.lane'] ]
    pool:
      name: MAUI-DNCENG
      demands:
      - ImageOverride -equals 1ESPT-Ubuntu22.04
    steps:
    - checkout: none
    - pwsh: Write-Host "should not run"
