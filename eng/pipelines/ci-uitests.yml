trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
    - net*.0
    - inflight/*
    - darc-*
  tags:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

pr:
  branches:
    include:
    - main
    - release/*
    - net*.0
    - inflight/*
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

variables:
  - template: /eng/pipelines/common/variables.yml@self

parameters:

  - name: BuildEverything
    type: boolean
    default: false

  - name: BuildNativeAOT
    displayName: 'Build NativeAOT artifacts'
    type: boolean
    default: false

  - name: RunNativeAOT
    displayName: 'Run NativeAOT UI Tests'
    type: boolean
    default: false

  - name: RunIssue38080
    displayName: 'Run only the Android WebView overscroll regression on API 36'
    type: boolean
    default: false

  - name: RunIssue38080DeviceAdjacency
    displayName: 'Run only the Issue 38080 Android device-test adjacency checks on API 36'
    type: boolean
    default: false

  # Internal pools (dnceng)
  - name: androidPoolInternal
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-15-arm64
  
  - name: androidPoolLinuxInternal
    type: object
    default:
      name: MAUI-DNCENG
      demands:
        - ImageOverride -equals 1ESPT-Ubuntu22.04

  - name: iosPoolInternal
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-15-arm64
  
  - name: windowsBuildPoolInternal
    type: object
    default:
      name: NetCore1ESPool-Internal
      demands:
        - ImageOverride -equals 1es-windows-2022
    
  - name: windowsPoolInternal
    type: object
    default:
      name: NetCore1ESPool-Internal
      demands:
        - ImageOverride -equals 1es-windows-2022

  - name: macosPoolInternal
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-14

  # Public pools (dnceng-public)
  - name: androidPoolPublic
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals ACES_VM_SharedPool_Tahoe
  
  - name: androidPoolLinuxPublic
    type: object
    default:
      name: MAUI-DNCENG
      demands:
        - ImageOverride -equals 1ESPT-Ubuntu22.04

  - name: iosPoolPublic
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals ACES_VM_SharedPool_Tahoe
  
  - name: windowsBuildPoolPublic
    type: object
    default:
      name: NetCore-Public
      demands:
        - ImageOverride -equals 1es-windows-2022-open
    
  - name: windowsPoolPublic
    type: object
    default:
      name: NetCore-Public
      demands:
        - ImageOverride -equals 1es-windows-2022-open

  - name: macosPoolPublic
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-14

stages:

  - ${{ if and(eq(parameters.RunIssue38080, false), eq(parameters.RunIssue38080DeviceAdjacency, false)) }}:
    - template: common/ui-tests.yml
      parameters:
        # Select pools based on pipeline - internal vs public
        ${{ if eq(variables['System.TeamProject'], 'internal') }}:
          androidPool: ${{ parameters.androidPoolInternal }}
          androidLinuxPool: ${{ parameters.androidPoolLinuxInternal }}
          iosPool: ${{ parameters.iosPoolInternal }}
          windowsPool: ${{ parameters.windowsPoolInternal }}
          windowsBuildPool: ${{ parameters.windowsBuildPoolInternal }}
          macosPool: ${{ parameters.macosPoolInternal }}
        ${{ else }}:
          androidPool: ${{ parameters.androidPoolPublic }}
          androidLinuxPool: ${{ parameters.androidPoolLinuxPublic }}
          iosPool: ${{ parameters.iosPoolPublic }}
          windowsPool: ${{ parameters.windowsPoolPublic }}
          windowsBuildPool: ${{ parameters.windowsBuildPoolPublic }}
          macosPool: ${{ parameters.macosPoolPublic }}
        # BuildNativeAOT is false by default, but true in devdiv environment
        BuildNativeAOT: ${{ or(parameters.BuildNativeAOT, and(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['System.TeamProject'], 'devdiv'))) }}
        RunNativeAOT: ${{ parameters.RunNativeAOT }}
        ${{ if or(parameters.BuildEverything, ne(variables['Build.Reason'], 'PullRequest')) }}:
          androidApiLevels: [ 30 ]
          iosVersions: [ '18.5', 'latest' ]
        ${{ else }}:
          androidApiLevels: [ 30 ]
          iosVersions: [ 'latest' ]
        projects:
          - name: controls
            desc: Controls
            androidApiLevelsExclude: [25] # Ignore for now API25 since the runs's are not stable
            android: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Android.Tests/Controls.TestCases.Android.Tests.csproj
            app: $(Pipeline.Workspace)/Controls.TestCases.HostApp/
            iosVersionsExclude: [ '12.4'] # Ignore iOS 12.4 while we can't make it work on CI
            ios: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.iOS.Tests/Controls.TestCases.iOS.Tests.csproj
            winui: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.WinUI.Tests/Controls.TestCases.WinUI.Tests.csproj
            mac: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Mac.Tests/Controls.TestCases.Mac.Tests.csproj

  - ${{ if and(eq(parameters.RunIssue38080, true), eq(parameters.RunIssue38080DeviceAdjacency, false)) }}:
    - stage: build_issue38080
      displayName: Build Issue 38080 Android UITest
      dependsOn: []
      jobs:
        - job: build_issue38080
          displayName: Build Issue 38080 Android HostApp
          ${{ if eq(variables['System.TeamProject'], 'internal') }}:
            pool: ${{ parameters.androidPoolInternal }}
          ${{ else }}:
            pool: ${{ parameters.androidPoolPublic }}
          variables:
            REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
            APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
          steps:
            - checkout: self
              persistCredentials: false
            - template: common/ui-tests-build-sample.yml
              parameters:
                platform: android
                runtimeVariant: Mono
                skipProvisioning: true

    - stage: test_issue38080
      displayName: Test Issue 38080 on Android API 36 Pixel 8a
      dependsOn: build_issue38080
      jobs:
        - job: test_issue38080
          displayName: Issue 38080 Android API 36 Pixel 8a
          timeoutInMinutes: 60
          workspace:
            clean: all
          ${{ if eq(variables['System.TeamProject'], 'internal') }}:
            pool: ${{ parameters.androidPoolLinuxInternal }}
          ${{ else }}:
            pool: ${{ parameters.androidPoolLinuxPublic }}
          variables:
            REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
            APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
          steps:
            - checkout: self
              persistCredentials: false
            - template: common/ui-tests-steps.yml
              parameters:
                platform: android
                version: 36
                path: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Android.Tests/Controls.TestCases.Android.Tests.csproj
                app: $(Pipeline.Workspace)/Controls.TestCases.HostApp/
                device: android-emulator-64_36
                deviceType: pixel_8a
                runtimeVariant: Mono
                runIssue38080: true
                skipProvisioning: true

  - ${{ if and(eq(parameters.RunIssue38080, false), eq(parameters.RunIssue38080DeviceAdjacency, true)) }}:
    - stage: test_issue38080_device_adjacency
      displayName: Test Issue 38080 native adjacency on Android API 36
      dependsOn: []
      jobs:
        - job: test_issue38080_device_adjacency
          displayName: Issue 38080 Android API 36 native adjacency
          timeoutInMinutes: 75
          workspace:
            clean: all
          ${{ if eq(variables['System.TeamProject'], 'internal') }}:
            pool: ${{ parameters.androidPoolLinuxInternal }}
          ${{ else }}:
            pool: ${{ parameters.androidPoolLinuxPublic }}
          variables:
            Issue38080AdjacencyRoot: $(Agent.TempDirectory)/issue38080-device-adjacency-$(Build.BuildId)-$(System.JobAttempt)
            LogDirectory: $(Agent.TempDirectory)/issue38080-device-adjacency-$(Build.BuildId)-$(System.JobAttempt)/logs
          steps:
            - checkout: self
              persistCredentials: false
            - template: common/issue38080-device-adjacency.yml

  - ${{ if and(eq(parameters.RunIssue38080, true), eq(parameters.RunIssue38080DeviceAdjacency, true)) }}:
    - stage: invalid_issue38080_selection
      displayName: Reject conflicting Issue 38080 modes
      dependsOn: []
      jobs:
        - job: invalid_issue38080_selection
          displayName: Select one Issue 38080 mode
          ${{ if eq(variables['System.TeamProject'], 'internal') }}:
            pool: ${{ parameters.androidPoolLinuxInternal }}
          ${{ else }}:
            pool: ${{ parameters.androidPoolLinuxPublic }}
          steps:
            - checkout: none
            - bash: |
                echo "RunIssue38080 and RunIssue38080DeviceAdjacency cannot both be enabled."
                exit 1
              displayName: Reject conflicting Issue 38080 modes
