trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
    - net*.0
    - inflight/*
    - darc-*
  tags:
    include:
    - '*'
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

pr:
  branches:
    include:
    - main
    - release/*
    - net*.0
    - inflight/*
  paths:
    include:
    - '*'
    exclude:
    - .github/**
    - docs/*
    - src/Templates/*
    - CODE-OF-CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE.TXT
    - PATENTS.TXT
    - README.md
    - THIRD-PARTY-NOTICES.TXT

variables:
  - template: /eng/pipelines/common/variables.yml@self
  - name: IosUITestImageOverride
    value: ACES_VM_SharedPool_Tahoe

parameters:

  - name: macValidationSource
    type: string
    default: ''

  - name: macValidationMode
    type: string
    default: diagnostic
    values: [ diagnostic, clean ]

  - name: macValidationCategory
    type: string
    default: Both
    values: [ Both, Layout, Shell ]

  - name: BuildEverything
    type: boolean
    default: false

  - name: BuildNativeAOT
    displayName: 'Build NativeAOT artifacts'
    type: boolean
    default: false

  - name: RunNativeAOT
    displayName: 'Run NativeAOT UI Tests'
    type: boolean
    default: false

  - name: iosXcodeVersion
    type: string
    default: '26.5'

  # Compile Apple apps on GoldenGate with Xcode 27; execute prebuilt apps on
  # established Appium images until GoldenGate supports Simulator UI and Mac2.
  # Internal pools (dnceng)
  - name: androidPoolInternal
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals $(AcesMacImageOverride)
  
  - name: androidPoolLinuxInternal
    type: object
    default:
      name: MAUI-DNCENG
      demands:
        - ImageOverride -equals 1ESPT-Ubuntu22.04

  - name: iosPoolInternal
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals $(IosUITestImageOverride)
  
  - name: windowsBuildPoolInternal
    type: object
    default:
      name: NetCore1ESPool-Internal
      demands:
        - ImageOverride -equals 1es-windows-2022
    
  - name: windowsPoolInternal
    type: object
    default:
      name: NetCore1ESPool-Internal
      demands:
        - ImageOverride -equals 1es-windows-2022

  - name: macosPoolInternal
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-14

  # Public pools (dnceng-public)
  - name: androidPoolPublic
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals $(AcesMacImageOverride)
  
  - name: androidPoolLinuxPublic
    type: object
    default:
      name: MAUI-DNCENG
      demands:
        - ImageOverride -equals 1ESPT-Ubuntu22.04

  - name: iosPoolPublic
    type: object
    default:
      name: AcesShared
      demands:
        - ImageOverride -equals $(IosUITestImageOverride)
  
  - name: windowsBuildPoolPublic
    type: object
    default:
      name: NetCore-Public
      demands:
        - ImageOverride -equals 1es-windows-2022-open
    
  - name: windowsPoolPublic
    type: object
    default:
      name: NetCore-Public
      demands:
        - ImageOverride -equals 1es-windows-2022-open

  - name: macosPoolPublic
    type: object
    default:
      name: Azure Pipelines
      vmImage: macOS-14

stages:
  - stage: build_ui_tests_coreclr
    displayName: Build exact-source Mac UI test HostApp
    dependsOn: []
    jobs:
      - job: build_ui_tests
        displayName: Build Sample App
        pool: ${{ parameters.androidPoolPublic }}
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: common/ui-tests-build-sample.yml
            parameters:
              runtimeVariant: CoreCLR
              platform: maccatalyst
              skipProvisioning: true
              ${{ if eq(parameters.macValidationMode, 'clean') }}:
                macValidationSource: ${{ parameters.macValidationSource }}
              ${{ else }}:
                macDiagnosticSource: ${{ parameters.macValidationSource }}

  - stage: maccatalyst_ui_tests_coreclr
    displayName: Exact-source Mac UI tests
    dependsOn: build_ui_tests_coreclr
    jobs:
      - job: maccatalyst_ui_tests_coreclr_controls
        displayName: Controls
        strategy:
          matrix:
            ${{ if or(eq(parameters.macValidationCategory, 'Both'), eq(parameters.macValidationCategory, 'Layout')) }}:
              Layout:
                CATEGORYGROUP: Layout
            ${{ if or(eq(parameters.macValidationCategory, 'Both'), eq(parameters.macValidationCategory, 'Shell')) }}:
              Shell:
                CATEGORYGROUP: Shell
        timeoutInMinutes: 180
        workspace:
          clean: all
        pool: ${{ parameters.macosPoolPublic }}
        variables:
          REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: common/ui-tests-steps.yml
            parameters:
              platform: catalyst
              version: '15.3'
              device: mac
              path: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.Mac.Tests/Controls.TestCases.Mac.Tests.csproj
              app: $(Pipeline.Workspace)/Controls.TestCases.HostApp/
              runtimeVariant: CoreCLR
              testFilter: $(CATEGORYGROUP)
              skipProvisioning: true
              macValidation: true
              ${{ if eq(parameters.macValidationMode, 'clean') }}:
                macValidationSource: ${{ parameters.macValidationSource }}
              ${{ else }}:
                macDiagnosticSource: ${{ parameters.macValidationSource }}
