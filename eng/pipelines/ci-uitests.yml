# Validation-only branch: build and capture on one isolated Windows worker.
trigger: none
pr: none

variables:
  - template: /eng/pipelines/common/variables.yml@self

stages:
  - stage: winui_ui_tests
    displayName: Build and capture the Windows ImageButton matrix
    jobs:
      - job: winui_ui_tests_imagebutton_verification
        timeoutInMinutes: 120
        pool:
          name: NetCore-Public
          demands:
            - ImageOverride -equals 1es-windows-2022-open
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)\.appium\
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - template: common/ui-tests-build-sample.yml
            parameters:
              platform: windows
              skipProvisioning: true
          - template: common/ui-tests-steps.yml
            parameters:
              platform: windows
              version: "10.0.19041.0"
              device: windows10
              path: $(System.DefaultWorkingDirectory)/src/Controls/tests/TestCases.WinUI.Tests/Controls.TestCases.WinUI.Tests.csproj
              app: $(System.DefaultWorkingDirectory)/artifacts/bin/Controls.TestCases.HostApp/
              skipAppDownload: true
              testFilter: 'ImageButton&FullyQualifiedName~ImageButtonAspectVerificationTests'
              skipProvisioning: true
