# `/review run-device-tests` request for maui-pr-devicetests (eng/pipelines/ci-device-tests.yml).
#
# GitHub Actions cannot queue Azure DevOps builds, so .github/scripts/Invoke-RunTests.ps1 pushes a
# dispatch commit to a refs/heads/run-devicetests/* branch and the CI trigger of maui-pr-devicetests
# builds it. That commit is the PR's test-merge tree with eng/pipelines, eng/devices,
# eng/helix_xharness.proj and .github taken from a trusted branch, and this file rewritten with the
# validated selection. It is only read for run-devicetests/* branches; this checked-in copy runs nothing.
variables:
  # 'selected' runs the listed projects and categories on RunDeviceTestsPlatforms, 'full' everything.
  - name: RunTestsMode
    value: 'none'
  - name: RunTestsPullRequest
    value: ''
  - name: RunTestsHeadSha
    value: ''
  # Pipeline platform ids, comma-separated: android, ios, catalyst, windows.
  - name: RunDeviceTestsPlatforms
    value: ''
  # Device test scenarios (eng/helix_xharness.proj MAUIScenario), '+'-separated.
  - name: RunDeviceTestsProjects
    value: ''
  # Controls.DeviceTests / Core.DeviceTests categories to skip, '+'-separated; empty runs all of them.
  - name: RunDeviceTestsControlsSkip
    value: ''
  - name: RunDeviceTestsCoreSkip
    value: ''
  # Controls.DeviceTests / Core.DeviceTests categories to run on Windows, '+'-separated; empty runs all of them.
  - name: RunDeviceTestsControlsRun
    value: ''
  - name: RunDeviceTestsCoreRun
    value: ''
