parameters:
  - name: platform
    type: string

steps:
  - template: issue-replicate-tools.yml
  - pwsh: |
      & "$(Pipeline.Workspace)/IssueTools/IssueReplicate.Transport.ps1" -Mode Import -Kind Input `
        -Encoded $env:REPRO_INPUT -Directory "$(Pipeline.Workspace)/IssueInput"
      & "$(Pipeline.Workspace)/IssueTools/IssueReplicate.Transport.ps1" -Mode FetchSample `
        -Directory "$(Pipeline.Workspace)/IssueInput"
    displayName: 'Restore snapshot and re-fetch hash-checked author sample'
    env:
      REPRO_INPUT: $(reproInput)
  - pwsh: |
      & pwsh -NoProfile -File "$(Pipeline.Workspace)/IssueTools/IssueReplicate.Checkout.ps1" `
        -ManifestPath "$(Pipeline.Workspace)/IssueInput/manifest.json" `
        -Destination "$(Pipeline.Workspace)/maui"
      if ($LASTEXITCODE -ne 0) { throw 'Public MAUI checkout failed.' }
    displayName: 'Fetch pinned public source without a checkout credential'
  - template: issue-replicate-sdk.yml
  - ${{ if eq(parameters.platform, 'ios') }}:
    - pwsh: |
        & "$(Pipeline.Workspace)/IssueTools/IssueReplicate.SelectXcode.ps1" `
          -RepoRoot "$(Pipeline.Workspace)/maui" -Provider Azure
      displayName: 'Require Xcode matching the pinned iOS SDK'
  - pwsh: New-Item -ItemType Directory -Path "$(LogDirectory)" -Force | Out-Null
    displayName: 'Prepare local provisioning logs'
  - ${{ if eq(parameters.platform, 'android') }}:
    - template: enable-kvm.yml
  - template: provision.yml
    parameters:
      checkoutDirectory: $(Pipeline.Workspace)/maui
      skipDotNetSdk: true
      skipProvisionator: true
      skipInternalFeeds: true
      skipCertificates: true
      skipGradleCache: true
      skipXcode: ${{ eq(parameters.platform, 'android') }}
      skipSimulatorSetup: ${{ eq(parameters.platform, 'android') }}
      skipJdk: ${{ eq(parameters.platform, 'ios') }}
      skipAndroidCommonSdks: ${{ eq(parameters.platform, 'ios') }}
      skipAndroidPlatformApis: true
      skipAndroidEmulatorImages: true
      skipAndroidCreateAvds: true
  - pwsh: ./build.ps1 --target=dotnet --configuration=Release --verbosity=minimal
    workingDirectory: $(Pipeline.Workspace)/maui
    displayName: 'Install pinned public native SDK/workloads'
    timeoutInMinutes: 50
  - pwsh: |
      & pwsh -NoProfile -File "$(Pipeline.Workspace)/IssueTools/IssueReplicate.ProvisionSample.ps1" `
        -RepoRoot "$(Pipeline.Workspace)/maui" `
        -InstallDirectory "$(Agent.TempDirectory)/issue-sample-dotnet" `
        -Platform '${{ parameters.platform }}'
      if ($LASTEXITCODE -ne 0) { throw 'Public author sample workload preparation failed.' }
    displayName: 'Install isolated public MAUI author sample workload'
    timeoutInMinutes: 35
  - bash: echo "##vso[task.prependpath]$(Agent.TempDirectory)/issue-sample-dotnet"
    displayName: 'Use isolated author sample SDK'
  - pwsh: |
      & pwsh -NoProfile -File "$(Pipeline.Workspace)/IssueTools/IssueReplicate.Run.ps1" -Mode Sample `
        -InputDirectory "$(Pipeline.Workspace)/IssueInput" `
        -OutputDirectory "$(Pipeline.Workspace)/SampleOutput" `
        -NuGetConfigPath "$(Pipeline.Workspace)/maui/NuGet.config" -Provider Azure
      if ($LASTEXITCODE -ne 0) { throw 'Author sample build failed (inconclusive).' }
    displayName: 'Build author sample without credentials'
    timeoutInMinutes: 35
    name: sample
