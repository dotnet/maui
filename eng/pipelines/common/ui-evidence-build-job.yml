parameters:
- name: jobName
  type: string
- name: displayName
  type: string
- name: variant
  type: string
- name: platform
  type: string
- name: pool
  type: object

jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}
  timeoutInMinutes: 90
  pool: ${{ parameters.pool }}
  workspace:
    clean: all
  steps:
  - checkout: self
    fetchDepth: 0
    clean: true
    persistCredentials: false

  - download: current
    artifact: ui_evidence_harness
    displayName: Download trusted UI evidence harness

  - pwsh: |
      $trustedRoot = "$(Agent.TempDirectory)/ui-evidence-harness"
      Remove-Item $trustedRoot -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path $trustedRoot | Out-Null

      $paths = @(
        "src/Controls/tests/TestCases.HostApp/Controls.TestCases.HostApp.csproj",
        "src/Controls/tests/TestCases.HostApp/MauiProgram.cs",
        "src/Controls/tests/TestCases.HostApp/UiEvidence",
        "eng/scripts/Invoke-UiEvidenceBuild.ps1"
      )
      foreach ($relativePath in $paths) {
        $source = Join-Path "$(Build.SourcesDirectory)" $relativePath
        $destination = Join-Path $trustedRoot $relativePath
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
        Copy-Item $source -Destination $destination -Recurse -Force
      }
    displayName: Snapshot trusted UI evidence build harness

  - template: /eng/pipelines/common/provision.yml@self
    parameters:
      checkoutDirectory: '$(System.DefaultWorkingDirectory)'
      skipJdk: ${{ ne(parameters.platform, 'android') }}
      skipAndroidCommonSdks: ${{ ne(parameters.platform, 'android') }}
      skipAndroidPlatformApis: ${{ ne(parameters.platform, 'android') }}
      onlyAndroidPlatformDefaultApis: true
      skipAndroidEmulatorImages: true
      skipAndroidCreateAvds: true
      skipProvisionator: true
      skipXcode: true
      skipSimulatorSetup: true
      skipInternalFeeds: true

  - pwsh: ./build.ps1 --target=dotnet --configuration=Release --verbosity=diagnostic
    displayName: Install .NET
    retryCountOnTaskFailure: 2
    env:
      DOTNET_TOKEN: $(dotnetbuilds-internal-container-read-token)
      PRIVATE_BUILD: $(PrivateBuild)

  - pwsh: echo "##vso[task.prependpath]$(DotNet.Dir)"
    displayName: Add .NET to PATH

  - bash: |
      set -euo pipefail
      REQUEST="$(Pipeline.Workspace)/ui_evidence_harness/request.json"
      if [ '${{ parameters.variant }}' = 'base' ]; then
        SHA=$(jq -r .baseCommitSha "$REQUEST")
      else
        SHA=$(jq -r .headCommitSha "$REQUEST")
      fi
      PR_NUMBER=$(jq -r .pullRequestNumber "$REQUEST")
      git cat-file -e "$SHA^{commit}" 2>/dev/null || \
        git fetch --quiet --no-tags origin \
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ui-evidence-pr"
      git cat-file -e "$SHA^{commit}"
      git checkout --detach "$SHA"
      git remote set-url origin https://github.com/dotnet/maui.git
      git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
    displayName: Checkout pinned ${{ parameters.variant }} commit

  - pwsh: |
      Copy-Item "$(Agent.TempDirectory)/ui-evidence-harness/*" `
        -Destination "$(Build.SourcesDirectory)" `
        -Recurse `
        -Force
    displayName: Overlay trusted UI evidence harness

  - pwsh: |
      foreach ($name in @(
        "GH_TOKEN",
        "GITHUB_TOKEN",
        "COPILOT_GITHUB_TOKEN",
        "AZDO_TOKEN",
        "SYSTEM_ACCESSTOKEN",
        "DOTNET_TOKEN"
      )) {
        if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
          throw "Forbidden credential environment variable '$name' is present before target build."
        }
      }
      $harness = "$(Pipeline.Workspace)/ui_evidence_harness"
      $feed = Join-Path $harness "devflow-feed"
      $request = Get-Content (Join-Path $harness "request.json") -Raw | ConvertFrom-Json
      & "$(Agent.TempDirectory)/ui-evidence-harness/eng/scripts/Invoke-UiEvidenceBuild.ps1" `
        -Platform "${{ parameters.platform }}" `
        -ScenarioId ([string]$request.scenarioId) `
        -DevFlowFeed $feed `
        -DevFlowSourceRoot (Join-Path $harness "devflow-source") `
        -LogDirectory "$(Agent.TempDirectory)/ui-evidence-build-logs" `
        -Configuration Release
    displayName: Build trusted ${{ parameters.variant }} UI evidence app

  - publish: $(System.DefaultWorkingDirectory)/artifacts/bin
    displayName: Publish ${{ parameters.variant }} UI evidence app
    artifact: ui_evidence_${{ parameters.variant }}
