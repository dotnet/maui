# Run only from the pipeline's trusted checkout, before any baseline switch or
# generated code. The guard uses PowerShell's bundled Roslyn; no MAUI build or
# device provisioning is needed to exercise these deterministic contracts.
steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expected = '$(Build.SourceVersion)'
      $actual = & git -C "$(Build.SourcesDirectory)" rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40}$' -or
          $actual -cne $expected) {
        throw 'Replication contract checks require the exact pipeline source checkout.'
      }
      $pester = Get-Module -ListAvailable -Name Pester |
        Where-Object { $_.Version -eq [version]'5.9.0' }
      if (-not $pester) {
        Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
      }
      New-Item -ItemType Directory -Force `
        -Path "$(Agent.TempDirectory)/replication-contract-checks" | Out-Null
    displayName: 'Prepare trusted replication contract checks'
    timeoutInMinutes: 3

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module Pester -RequiredVersion 5.9.0
      $config = New-PesterConfiguration
      $config.Run.Path = "$(Build.SourcesDirectory)/.github/scripts/tests/Assert-ReplicationExecutionEnvironment.Tests.ps1"
      $config.Run.PassThru = $true
      $config.Output.Verbosity = 'Detailed'
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputPath = "$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml"
      $config.TestResult.OutputFormat = 'NUnitXml'
      $result = Invoke-Pester -Configuration $config
      if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 78 -or
          $result.PassedCount -ne $result.TotalCount) {
        throw ("Replication execution-environment checks did not all pass: " +
          "$($result.Result), passed=$($result.PassedCount), total=$($result.TotalCount).")
      }
    displayName: 'Test trusted Android execution-boundary helpers'
    timeoutInMinutes: 5

  - task: PublishTestResults@2
    displayName: 'Publish execution-boundary regression results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml'
      testRunTitle: 'Replication execution boundary'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Write-Host '##vso[task.setvariable variable=replicationSemanticChecksStarted]true'
      Import-Module Pester -RequiredVersion 5.9.0
      foreach ($assembly in @('Microsoft.CodeAnalysis.dll', 'Microsoft.CodeAnalysis.CSharp.dll')) {
        $assemblyPath = Join-Path $PSHOME $assembly
        if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
          throw "PowerShell's bundled semantic-check dependency is missing: $assembly"
        }
        Add-Type -Path $assemblyPath
      }
      $filters = @(
        'the test prompt names the compile traps runs actually hit*keeps Catalyst Issue35511 window-helper guidance out of other prompts'
        'the test prompt names the compile traps runs actually hit*tells authoring and repair attempts to use only the one-argument AssertEventually shape'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*delivers the issue-derived visual scene guidance without generated-test syntax'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*scopes Issue26505 Sandbox scene guidance to Android Issue26505'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*keeps Sandbox-only Issue26505 guidance out of generated-test phases'
        'Replication orchestrator security boundary*clears trusted Android preflight residue before Sandbox authoring'
        'Agent prompt deliverability*leaves no control character in any string literal of the orchestrator'
        'New-ReplicationControlVariant*allows Android Issue26505 ButtonHandler text-fit oracle'
        'New-ReplicationControlVariant*reports the captured Android Issue26505 missing static import'
        'New-ReplicationControlVariant*allows the captured Android Issue26505 source after importing the trusted helper'
        'New-ReplicationControlVariant*rejects Android Issue26505 helper outside exact issue path'
        'New-ReplicationControlVariant*rejects Android Issue26505 source-defined native shadows'
        'New-ReplicationControlVariant*rejects Android Issue26505 missing setup or non-FontSize trigger'
        'New-ReplicationControlVariant*rejects Android Issue26505 wrong helper overload or handler provenance'
        'New-ReplicationControlVariant*rejects Android Issue26505 foreign button or native receiver'
        'New-ReplicationControlVariant*rejects Android Issue26505 stretched geometry or computed oracle'
        'New-ReplicationControlVariant*rejects Android Issue26505 alias mutations and extra method state'
        'New-ReplicationControlVariant*rejects Android Issue26505 native writes and broad native reads'
        'New-ReplicationControlVariant*prevents Android Issue26505 metadata cache bleed'
        'New-ReplicationControlVariant*does not add a broad Android native surface to the closed control contract'
        'New-ReplicationControlVariant*allows the immutable AssertEventually boolean helper for the Catalyst Issue35511 observation'
        'New-ReplicationControlVariant*allows the empirically captured Windows reload helper shape'
        'New-ReplicationControlVariant*rejects wrong Window attachment helper overloads type arguments and constructor inputs'
        'New-ReplicationControlVariant*requires lifecycle then AssertEventually before a helper callback oracle'
        'New-ReplicationControlVariant*rejects the immutable AssertEventually async-predicate overload'
        'New-ReplicationControlVariant*rejects writes calls and ambient state inside AssertEventually predicates'
        'New-ReplicationControlVariant*continues to reject every other source-defined await'
        'New-ReplicationControlVariant*rejects an early return that can skip the oracle'
        'MAUI Copilot mode routing*places the review-default Mode selector before target numbers'
        'MAUI Copilot mode routing*isolates the empirically proven MauiBot publication smoke mode'
        'MAUI Copilot mode routing*runs guard-only mode without agents devices or publication'
        'MAUI Copilot mode routing*shares fail-fast checks before Android provisioning and baseline restoration'
      )
      $config = New-PesterConfiguration
      $config.Run.Path = @(
        "$(Build.SourcesDirectory)/.github/scripts/Replicate-Issue.Tests.ps1"
        "$(Build.SourcesDirectory)/.github/scripts/Replication-Pipeline.Tests.ps1"
      )
      $config.Run.PassThru = $true
      $config.Filter.FullName = $filters
      $config.Output.Verbosity = 'Detailed'
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputPath = "$(Agent.TempDirectory)/replication-contract-checks/test-semantics.xml"
      $config.TestResult.OutputFormat = 'NUnitXml'
      $result = Invoke-Pester -Configuration $config
      if ($result.Result -ne 'Passed' -or $result.PassedCount -ne $filters.Count -or
          $result.SkippedCount -ne 0) {
        throw ("Focused replication semantic checks did not all pass: " +
          "$($result.Result), passed=$($result.PassedCount), expected=$($filters.Count).")
      }
    displayName: 'Test generated-test contract and prompt regressions'
    timeoutInMinutes: 5

  - task: PublishTestResults@2
    displayName: 'Publish generated-test contract results'
    condition: and(succeededOrFailed(), eq(variables['replicationSemanticChecksStarted'], 'true'))
    inputs:
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(Agent.TempDirectory)/replication-contract-checks/test-semantics.xml'
      testRunTitle: 'Replication generated-test contract'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish replication contract diagnostics'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Agent.TempDirectory)/replication-contract-checks'
      artifact: 'ReplicationContractChecks'
      publishLocation: 'pipeline'
