        'Complete post-patch product source scanning*accepts the normal Controls Button mapper registration patch beside its existing ImageSource key'
        'Complete post-patch product source scanning*rejects changed executable ImageSource use in the Controls Button mapper file'
        'Complete post-patch product source scanning*rejects a changed Controls Button ImageSource mapper callback'
        'Complete post-patch product source scanning*rejects contextual nameof shadows before Controls Button mapper neutralization'
        'Complete post-patch product source scanning*allows conservative changed static primitive literal initialization'
        'Complete post-patch product source scanning*allows benign unchanged static object initialization beside a safe edit'
