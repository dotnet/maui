# Run only from the pipeline's trusted checkout, before any baseline switch or
# generated code. The guard uses PowerShell's bundled Roslyn; no MAUI build or
# device provisioning is needed to exercise these deterministic contracts.
steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expected = '$(Build.SourceVersion)'
      $actual = & git -C "$(Build.SourcesDirectory)" rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40}$' -or
          $actual -cne $expected) {
        throw 'Replication contract checks require the exact pipeline source checkout.'
      }
      $pester = Get-Module -ListAvailable -Name Pester |
        Where-Object { $_.Version -eq [version]'5.9.0' }
      if (-not $pester) {
        Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
      }
      New-Item -ItemType Directory -Force `
        -Path "$(Agent.TempDirectory)/replication-contract-checks" | Out-Null
    displayName: 'Prepare trusted replication contract checks'
    timeoutInMinutes: 3

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module Pester -RequiredVersion 5.9.0
      $config = New-PesterConfiguration
      $config.Run.Path = "$(Build.SourcesDirectory)/.github/scripts/tests/Assert-ReplicationExecutionEnvironment.Tests.ps1"
      $config.Run.PassThru = $true
      $config.Output.Verbosity = 'Detailed'
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputPath = "$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml"
      $config.TestResult.OutputFormat = 'NUnitXml'
      $result = Invoke-Pester -Configuration $config
      if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 78 -or
          $result.PassedCount -ne $result.TotalCount) {
        throw ("Replication execution-environment checks did not all pass: " +
          "$($result.Result), passed=$($result.PassedCount), total=$($result.TotalCount).")
      }
    displayName: 'Test trusted Android execution-boundary helpers'
    timeoutInMinutes: 5

  - task: PublishTestResults@2
    displayName: 'Publish execution-boundary regression results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml'
      testRunTitle: 'Replication execution boundary'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Write-Host '##vso[task.setvariable variable=replicationSemanticChecksStarted]true'
      Import-Module Pester -RequiredVersion 5.9.0
      foreach ($assembly in @('Microsoft.CodeAnalysis.dll', 'Microsoft.CodeAnalysis.CSharp.dll')) {
        $assemblyPath = Join-Path $PSHOME $assembly
        if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
          throw "PowerShell's bundled semantic-check dependency is missing: $assembly"
        }
        Add-Type -Path $assemblyPath
      }
      $filters = @(
        'the test prompt names the compile traps runs actually hit*keeps Catalyst Issue35511 window-helper guidance out of other prompts'
        'the test prompt names the compile traps runs actually hit*tells authoring and repair attempts to use only the one-argument AssertEventually shape'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*delivers the issue-derived visual scene guidance without generated-test syntax'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*scopes Issue26505 Sandbox scene guidance to Android Issue26505'
        'Replication orchestrator security boundary*Android Issue26505 Sandbox prompt guidance*keeps Sandbox-only Issue26505 guidance out of generated-test phases'
        'Replication orchestrator security boundary*scopes Issue33315 rendered-pixel generated-test guidance to Android Issue33315'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*rejects the captured self-announced Sandbox verdict shape'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*allows state-dependent property and null-pattern predicates on the final result target'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*allows a state-dependent positive else branch and rejects a constant false selector'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*accepts guarded verdict writes beyond the old lexical window and with braces inside strings'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*rejects concatenated and interpolated positive literals when no state decides them'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*rejects constant selectors like if true, one equals one, and bool locals initialized to constants'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*allows bool locals that are reassigned from observed state before the verdict branch'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*allows preceding state-dependent early returns that guard later positive verdict writes'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*parses active platform directives before evaluating final verdict writes'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*ignores benign logs and non-positive captions around the result target'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*propagates bounded XAML analysis errors instead of silently skipping them'
        'Replication orchestrator security boundary*Sandbox final result target verdict writes*does not silently pass when the configured Appium plan path is missing'
        'Replication orchestrator security boundary*tells Sandbox authors the bounded rule and the required repair guidance'
        'Replication orchestrator security boundary*rejects dangerous capabilities in generated Sandbox source'
        'Replication orchestrator security boundary*rejects replacing the affected control content with the semantic verdict'
        'A sandbox attempt that decided something is not called other*leaves no guard in the sandbox guard functions able to go unnamed'
        'Replication orchestrator security boundary*accepts a current-contract generated-test refusal on the first attempt'
        'Replication orchestrator security boundary*rejects malformed generated-test refusal declarations without granting them authority'
        'Replication orchestrator security boundary*rejects a linked test refusal without reading or deleting its target'
