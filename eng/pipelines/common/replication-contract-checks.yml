# Run only from the pipeline's trusted checkout, before any baseline switch or
# generated code. The guard uses PowerShell's bundled Roslyn; no MAUI build or
# device provisioning is needed to exercise these deterministic contracts.
steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $expected = '$(Build.SourceVersion)'
      $actual = & git -C "$(Build.SourcesDirectory)" rev-parse HEAD
      if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40}$' -or
          $actual -cne $expected) {
        throw 'Replication contract checks require the exact pipeline source checkout.'
      }
      $pester = Get-Module -ListAvailable -Name Pester |
        Where-Object { $_.Version -eq [version]'5.9.0' }
      if (-not $pester) {
        Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
      }
      New-Item -ItemType Directory -Force `
        -Path "$(Agent.TempDirectory)/replication-contract-checks" | Out-Null
    displayName: 'Prepare trusted replication contract checks'
    timeoutInMinutes: 3

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module Pester -RequiredVersion 5.9.0
      $config = New-PesterConfiguration
      $config.Run.Path = "$(Build.SourcesDirectory)/.github/scripts/tests/Assert-ReplicationExecutionEnvironment.Tests.ps1"
      $config.Run.PassThru = $true
      $config.Output.Verbosity = 'Detailed'
      $config.TestResult.Enabled = $true
      $config.TestResult.OutputPath = "$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml"
      $config.TestResult.OutputFormat = 'NUnitXml'
      $result = Invoke-Pester -Configuration $config
      if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 78 -or
          $result.PassedCount -ne $result.TotalCount) {
        throw ("Replication execution-environment checks did not all pass: " +
          "$($result.Result), passed=$($result.PassedCount), total=$($result.TotalCount).")
      }
    displayName: 'Test trusted Android execution-boundary helpers'
    timeoutInMinutes: 5

  - task: PublishTestResults@2
    displayName: 'Publish execution-boundary regression results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(Agent.TempDirectory)/replication-contract-checks/execution-environment.xml'
      testRunTitle: 'Replication execution boundary'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Write-Host '##vso[task.setvariable variable=replicationSemanticChecksStarted]true'
      Import-Module Pester -RequiredVersion 5.9.0
      foreach ($assembly in @('Microsoft.CodeAnalysis.dll', 'Microsoft.CodeAnalysis.CSharp.dll')) {
        $assemblyPath = Join-Path $PSHOME $assembly
        if (-not (Test-Path -LiteralPath $assemblyPath -PathType Leaf)) {
          throw "PowerShell's bundled semantic-check dependency is missing: $assembly"
        }
        Add-Type -Path $assemblyPath
      }
      $filters = @(
