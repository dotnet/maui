parameters:
  platform: '' # [ android, ios, windows, catalyst ]
  path: '' # path to csproj
  device: '' # the xharness device to use
  deviceType: '' # the device type/skin for Android emulator (e.g., pixel_3XL, Nexus 5X)
  cakeArgs: '' # additional cake args
  app: '' #path to app to test
  version: '' #the iOS version'
  provisionatorChannel: 'latest'
  configuration: "Release"
  runtimeVariant: "Mono"
  useMaterial3: false # NEW PARAMETER - Enable Material3 build
  testFilter: '' # comma-separated category list, expanded into ORed TestCategory= terms
  headless: true
  testConfigurationArgs: ''
  skipProvisioning: true
  checkoutDirectory: $(System.DefaultWorkingDirectory)
  runIssue38080: false

steps:
- task: DownloadPipelineArtifact@2
  condition: and(ne('${{ parameters.platform }}' , 'windows'), eq('${{ parameters.runtimeVariant }}' , 'Mono'), eq('${{ parameters.useMaterial3 }}', 'false'))
  inputs:
    artifact: ui-tests-samples

- task: DownloadPipelineArtifact@2
  condition: and(ne('${{ parameters.platform }}' , 'windows'), eq('${{ parameters.runtimeVariant }}' , 'Mono'), eq('${{ parameters.useMaterial3 }}', 'true'))
  inputs:
    artifact: ui-tests-samples-material3

- task: DownloadPipelineArtifact@2
  condition: and(ne('${{ parameters.platform }}' , 'windows'), eq('${{ parameters.runtimeVariant }}' , 'NativeAOT'))
  inputs:
    artifact: ui-tests-samples-nativeaot

- task: DownloadPipelineArtifact@2
  condition: and(ne('${{ parameters.platform }}' , 'windows'), eq('${{ parameters.runtimeVariant }}' , 'CoreCLR'), eq('${{ parameters.useMaterial3 }}', 'false'))
  inputs:
    artifact: ui-tests-samples-coreclr

- task: DownloadPipelineArtifact@2
  condition: eq('${{ parameters.platform }}' , 'windows')
  inputs:
    artifact: ui-tests-samples-windows

- ${{ if eq(parameters.platform, 'ios')}}:
  - bash: |
      chmod +x $(System.DefaultWorkingDirectory)/eng/scripts/clean-bot.sh
      $(System.DefaultWorkingDirectory)/eng/scripts/clean-bot.sh
    displayName: 'Clean bot'
    continueOnError: true
    timeoutInMinutes: 60

- ${{ if and(ne(parameters.buildType, 'buildOnly'), eq(parameters.platform, 'android')) }}:
  - template: enable-kvm.yml

- ${{ if eq(parameters.platform, 'catalyst')}}:
  - bash: |
      chmod +x $(System.DefaultWorkingDirectory)/eng/scripts/disable-notification-center.sh
      $(System.DefaultWorkingDirectory)/eng/scripts/disable-notification-center.sh
    displayName: 'Disable Notification Center'
    continueOnError: true
    timeoutInMinutes: 60

- template: provision.yml
  parameters:
    skipJdk: ${{ ne(parameters.platform, 'android') }}
    skipAndroidCommonSdks: ${{ ne(parameters.platform, 'android') }}
    skipAndroidPlatformApis: true
    onlyAndroidPlatformDefaultApis: true
    skipAndroidEmulatorImages: ${{ ne(parameters.platform, 'android') }}
    skipAndroidCreateAvds: true
    androidEmulatorApiLevel: ${{ parameters.version }}
    skipXcode: ${{ or(eq(parameters.platform, 'android'), eq(parameters.platform, 'windows'), eq(parameters.platform, 'catalyst')) }}
    skipSimulatorSetup: ${{ or(eq(parameters.platform, 'android'), eq(parameters.platform, 'windows'), eq(parameters.platform, 'catalyst')) }}
    provisionatorChannel: ${{ parameters.provisionatorChannel }}
    ${{ if parameters.skipProvisioning }}:
      skipProvisionator: true
    ${{ else }}:
      skipProvisionator: false
    ${{ if eq(parameters.platform, 'catalyst') }}:
      openSslArgs: '' # Do not use legacy openssl for Catalyst builds

- ${{ if eq(parameters.runIssue38080, true) }}:
  - bash: |
      set -euo pipefail
      host_diagnostics="$(LogDirectory)/issue38080/emulator-host"
      mkdir -p "$host_diagnostics"

      sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
      emulator="$sdk_root/emulator/emulator"
      emulator_lib64="$sdk_root/emulator/lib64"
      emulator_qt_lib="$emulator_lib64/qt/lib"
      qemu="$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64"
      qemu_headless="$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64-headless"
      if [[ -z "$sdk_root" || ! -x "$emulator" || ! -d "$emulator_lib64" || ! -d "$emulator_qt_lib" || ! -x "$qemu" || ! -x "$qemu_headless" ]]; then
        echo "Provisioned Android emulator runtime was not found under '$sdk_root/emulator'."
        exit 1
      fi

      timeout 120s sudo -n apt-get update -qq \
        > "$host_diagnostics/apt-libpulse0.txt" 2>&1
      timeout 120s sudo -n apt-get install -y -qq --no-install-recommends libpulse0 \
        >> "$host_diagnostics/apt-libpulse0.txt" 2>&1

      launcher_exit_code=0
      timeout 30s "$emulator" -version \
        > "$host_diagnostics/version.txt" 2>&1 || launcher_exit_code=$?
      echo "ExitCode: $launcher_exit_code" >> "$host_diagnostics/version.txt"
      if [[ "$launcher_exit_code" -ne 0 ]]; then
        echo "Android emulator launcher failed after restoring QEMU prerequisites."
        cat "$host_diagnostics/version.txt"
        exit 1
      fi

      # The launcher adds both bundled roots and selects the headless QEMU binary for -no-window.
      qemu_ld_library_path="$emulator_lib64:$emulator_qt_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      headless_ldd_exit_code=0
      LD_LIBRARY_PATH="$qemu_ld_library_path" /usr/bin/ldd "$qemu_headless" \
        > "$host_diagnostics/headless-ldd.txt" 2>&1 || headless_ldd_exit_code=$?
      if [[ "$headless_ldd_exit_code" -ne 0 ]] || grep -Fq "=> not found" "$host_diagnostics/headless-ldd.txt"; then
        echo "Headless Android emulator QEMU still has unresolved shared libraries."
        cat "$host_diagnostics/headless-ldd.txt"
        exit 1
      fi

      gui_ldd_exit_code=0
      LD_LIBRARY_PATH="$qemu_ld_library_path" /usr/bin/ldd "$qemu" \
        > "$host_diagnostics/ldd.txt" 2>&1 || gui_ldd_exit_code=$?
      echo "ExitCode: $gui_ldd_exit_code" >> "$host_diagnostics/ldd.txt"
    displayName: Verify Issue 38080 emulator runtime prerequisites
    timeoutInMinutes: 5

- ${{ if eq(parameters.runIssue38080, true) }}:
  - bash: |
      set -euo pipefail
      mkdir -p "$(LogDirectory)"
      sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
      issue_avd_home="$(Agent.TempDirectory)/maui-issue38080-avd-$(Build.BuildId)-$(System.JobAttempt)"
      mkdir -p "$issue_avd_home"
      export ANDROID_AVD_HOME="$issue_avd_home"
      echo "$issue_avd_home" > "$(LogDirectory)/issue38080-avd-home.txt"
      echo "##vso[task.setvariable variable=ANDROID_AVD_HOME]$issue_avd_home"

      sdkmanager13="$sdk_root/cmdline-tools/13.0/bin/sdkmanager"
      tools19="$sdk_root/cmdline-tools/19.0/bin"
      if [[ -z "$sdk_root" || ! -x "$sdkmanager13" ]]; then
        echo "Provisioned Android SDK or sdkmanager was not found: '$sdkmanager13'."
        exit 1
      fi

      if ! timeout 180s "$sdkmanager13" --sdk_root="$sdk_root" "cmdline-tools;19.0" \
        > "$(LogDirectory)/cmdline-tools-19-install.txt" 2>&1; then
        cat "$(LogDirectory)/cmdline-tools-19-install.txt"
        exit 1
      fi

      avdmanager="$tools19/avdmanager"
      sdkmanager19="$tools19/sdkmanager"
      if [[ ! -x "$avdmanager" || ! -x "$sdkmanager19" ]]; then
        echo "Command-line tools 19.0 were not installed under '$tools19'."
        exit 1
      fi

      timeout 30s "$sdkmanager19" --version > "$(LogDirectory)/cmdline-tools-version.txt"
      timeout 30s "$avdmanager" list device > "$(LogDirectory)/android-device-definitions.txt"
      if ! grep -Eq 'id: [0-9]+ or "pixel_8a"' "$(LogDirectory)/android-device-definitions.txt"; then
        echo "Required Android device definition pixel_8a is unavailable."
        cat "$(LogDirectory)/android-device-definitions.txt"
        exit 1
      fi

      export PATH="$tools19:$PATH"
      resolved_avdmanager="$(command -v avdmanager)"
      if [[ "$resolved_avdmanager" != "$avdmanager" ]]; then
        echo "Expected avdmanager '$avdmanager' but resolved '$resolved_avdmanager'."
        exit 1
      fi
      echo "$resolved_avdmanager" > "$(LogDirectory)/resolved-avdmanager.txt"
      echo "##vso[task.prependpath]$tools19"

      host_diagnostics="$(LogDirectory)/issue38080/emulator-host"
      mkdir -p "$host_diagnostics"
      capture_host_command() {
        output="$1"
        shift
        exit_code=0
        timeout 10s "$@" > "$output" 2>&1 || exit_code=$?
        echo "ExitCode: $exit_code" >> "$output"
      }

      emulator="$sdk_root/emulator/emulator"
      capture_host_command "$host_diagnostics/acceleration.txt" "$emulator" -accel-check
      capture_host_command "$host_diagnostics/kvm.txt" /usr/bin/ls -l /dev/kvm
    displayName: Verify Pixel 8a device definition
    timeoutInMinutes: 5

- task: PowerShell@2
  condition: and(ne('${{ parameters.platform }}', 'windows'), ne('${{ parameters.platform }}', 'android'))
  inputs:
    targetType: 'inline'
    script: |
      defaults write -g NSAutomaticCapitalizationEnabled -bool false
      defaults write -g NSAutomaticTextCompletionEnabled -bool false
      defaults write -g NSAutomaticSpellingCorrectionEnabled -bool false
  displayName: "Modify defaults"
  continueOnError: true

- pwsh: ./build.ps1 --target=dotnet --configuration="${{ parameters.configuration }}" --verbosity=diagnostic
  displayName: 'Install .NET'
  retryCountOnTaskFailure: 2
  env:
    DOTNET_TOKEN: $(dotnetbuilds-internal-container-read-token)
    PRIVATE_BUILD: $(PrivateBuild)

- pwsh: echo "##vso[task.prependpath]$(DotNet.Dir)"
  displayName: 'Add .NET to PATH'

# AzDO hosted agents default to 1024x768; set something bigger for Windows UI tests
- pwsh: |
    $scriptPath = Join-Path "$(System.DefaultWorkingDirectory)" "eng" "scripts" "Set-ScreenResolution.ps1"
    & $scriptPath -Width 1920 -Height 1080
  condition: eq('${{ parameters.platform }}' , 'windows')
  displayName: "Set screen resolution"

- task: UseNode@1
  inputs:
    version: "20.3.1"
  displayName: "Install node"

- pwsh: |
    $skipAppiumDoctor = if ($IsMacOS -or $IsLinux) { "true" } else { "false" }
    dotnet build ./src/Provisioning/Provisioning.csproj -t:ProvisionAppium -p:SkipAppiumDoctor="$skipAppiumDoctor" -bl:"$(LogDirectory)/provision-appium.binlog"
  displayName: "Install Appium"
  continueOnError: false
  retryCountOnTaskFailure: 2
  timeoutInMinutes: 10
  env:
    APPIUM_HOME: $(APPIUM_HOME)

- pwsh: |
    Get-Content $PSCommandPath
    $command = "./build.ps1 -Script eng/devices/${{ parameters.platform }}.cake --target=uitest --project=""${{ parameters.path }}"""
    $command += " --appproject=""${{ parameters.app }}"" --device=""${{ parameters.device }}"" --apiversion=""${{ parameters.version }}"" --configuration=""${{ parameters.configuration }}"""
    $command += " --runtimevariant=""${{ parameters.runtimeVariant }}"""
    $command += " --results=""$(TestResultsDirectory)"" --binlog=""$(LogDirectory)"" ${{ parameters.cakeArgs }} --verbosity=diagnostic"

    # Add device skin parameter if specified (for Android emulator hardware profile)
    $deviceType = "${{ parameters.deviceType }}"
    if ($deviceType) {
      $command += " --skin=""$deviceType"""
    }

    $testFilter = ""
    $testConfigrationArgs = "${{ parameters.testConfigurationArgs }}"
    $runIssue38080 = "${{ parameters.runIssue38080 }}" -eq "true"

    if ($runIssue38080) {
      if ("${{ parameters.testFilter }}") {
        throw "runIssue38080 cannot be combined with the category testFilter parameter."
      }

      $command += " --run-issue-38080=true"
      $testFilter = "FullyQualifiedName=Microsoft.Maui.TestCases.Tests.Issues.Issue38080.FastOverscrollAndBackNavigationWithOffscreenWebViewDoesNotCrash"
    } else {
      "${{ parameters.testFilter }}".Split(",") | ForEach {
        $testFilter += "TestCategory=" + $_ + "|"
      }

      $testFilter = $testFilter.TrimEnd("|")
    }

    # Cake does not allow empty parameters, so check if our filter is empty before adding it
    if ($testConfigrationArgs) {
      $command += " --TEST_CONFIGURATION_ARGS=""$testConfigrationArgs"""
    }
    if ($testFilter) {
      $command += " --test-filter ""$testFilter"""
    }

    $headless = ${{ parameters.headless }}
    if ($headless) {
      $command += " --headless ""$headless"""
    }

    Write-Host "Running command: $command"

    Invoke-Expression $command  
  displayName: $(Agent.JobName)
  ${{ if ne(parameters.platform, 'android')}}:
    retryCountOnTaskFailure: 1
  env:
    APPIUM_HOME: $(APPIUM_HOME)
    ${{ if eq(parameters.runIssue38080, true) }}:
      ANDROID_AVD_HOME: $(ANDROID_AVD_HOME)

- ${{ if eq(parameters.runIssue38080, true) }}:
  - bash: |
      set +e
      mkdir -p "$(LogDirectory)/issue38080"
      sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
      adb="$sdk_root/platform-tools/adb"
      if [[ -z "$sdk_root" || ! -x "$adb" ]]; then
        echo "Provisioned Android SDK or adb was not found: '$adb'." \
          > "$(LogDirectory)/issue38080/adb-path-error.txt"
        exit 0
      fi
      timeout 30s "$adb" shell getprop > "$(LogDirectory)/issue38080/getprop.txt" 2>&1
      timeout 30s "$adb" shell dumpsys webviewupdate > "$(LogDirectory)/issue38080/webview-provider.txt" 2>&1
      timeout 30s "$adb" shell dumpsys SurfaceFlinger > "$(LogDirectory)/issue38080/surfaceflinger.txt" 2>&1
      timeout 30s "$adb" logcat -d > "$(LogDirectory)/issue38080/logcat.txt" 2>&1
      timeout 30s "$adb" pull /data/tombstones "$(LogDirectory)/issue38080/tombstones" \
        > "$(LogDirectory)/issue38080/tombstone-pull.txt" 2>&1
      exit 0
    displayName: Capture Issue 38080 Android diagnostics
    condition: always()
    timeoutInMinutes: 5

- bash: |
    cat ${BASH_SOURCE[0]}
    pwsh ./build.ps1 --target=Cleanup -Script eng/devices/${{ parameters.platform }}.cake ---results="$(TestResultsDirectory)" ${{ parameters.cakeArgs }}
  displayName: Cleanup and Create Simulator Logs if Test Run Failed To
  condition: ${{ eq(parameters.platform, 'ios') }}
  continueOnError: true

- task: PublishTestResults@2
  displayName: Publish the $(System.PhaseName) test results
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(TestResultsDirectory)/*.trx'
    testRunTitle: '${{ parameters.testFilter }}_$(System.PhaseName)'
    failTaskOnFailedTests: true

- task: PublishBuildArtifacts@1
  condition: always()
  displayName: publish artifacts
  inputs:
    artifactName: drop-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)

# Enable Notification Center re-enabled only for catalyst
- ${{ if eq(parameters.platform, 'catalyst')}}:
  - bash: |
      chmod +x $(System.DefaultWorkingDirectory)/eng/scripts/enable-notification-center.sh
      $(System.DefaultWorkingDirectory)/eng/scripts/enable-notification-center.sh
    displayName: 'Enable Notification Center'
    continueOnError: true
    timeoutInMinutes: 60
