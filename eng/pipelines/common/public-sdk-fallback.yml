# TEMPORARY WORKAROUND for release/11.0.1xx-rc2.
#
# The branch pins RC2 SDK 11.0.100-rc.2.26478.115 (BAR 334412), which is published only
# to internal locations. Builds that cannot use the internal feeds (public maui-pr and other
# untrusted pipelines) would fail with HTTP 404 while provisioning it.
#
# While the pinned SDK is not publicly downloadable, this step switches the local checkout's
# global.json and eng/Versions.props to an older public RC2 build (BAR 334092) so those
# pipelines can still validate changes. Its net10 workload manifests reference unreleased .NET
# 10.0.13 packs, so the step also adds the public release/10.0.1xx build feed (BAR 333293) that
# contains them. Trusted internal builds never include this template and always build with the
# pinned SDK and internal 10.0.13 packs. Public CI does not validate the pinned internal SDK.
# The step becomes a no-op as soon as the pinned SDK is public.
#
# Remove this template and its references once the pinned SDK is publicly available or the branch
# moves to a public SDK.
parameters:
  checkoutDirectory: $(System.DefaultWorkingDirectory)
  publicFallbackSdkVersion: 11.0.100-rc.2.26475.137
  publicFallbackPackageFeedName: temporary-darc-pub-dotnet-dotnet-e4bafa1e
  publicFallbackPackageFeed: https://pkgs.dev.azure.com/dnceng/public/_packaging/darc-pub-dotnet-dotnet-e4bafa1e/nuget/v3/index.json

steps:
- pwsh: |
    $ErrorActionPreference = 'Stop'

    $root = '${{ parameters.checkoutDirectory }}'
    $fallback = '${{ parameters.publicFallbackSdkVersion }}'
    $globalJsonPath = Join-Path $root 'global.json'
    $versionsPropsPath = Join-Path $root 'eng/Versions.props'
    $pinned = (Get-Content -LiteralPath $globalJsonPath -Raw | ConvertFrom-Json).tools.dotnet

    if ($pinned -eq $fallback) {
      Write-Host "global.json already uses SDK $fallback."
      exit 0
    }

    $probeUrl = "https://ci.dot.net/public/Sdk/$pinned/dotnet-sdk-$pinned-linux-x64.tar.gz"
    $status = 0
    for ($attempt = 1; $attempt -le 3; $attempt++) {
      try {
        $status = [int](Invoke-WebRequest -Method Head -Uri $probeUrl -UseBasicParsing -SkipHttpErrorCheck).StatusCode
      } catch {
        Write-Host "Attempt ${attempt}: $($_.Exception.Message)"
        $status = 0
      }
      if ($status -eq 200 -or $status -eq 404) { break }
      Start-Sleep -Seconds 5
    }

    if ($status -eq 200) {
      Write-Host "SDK $pinned is publicly available; no fallback needed. This temporary workaround can be removed."
      exit 0
    }
    if ($status -ne 404) {
      Write-Host "##vso[task.logissue type=error]Could not determine whether SDK $pinned is publicly available (HTTP $status from $probeUrl)."
      exit 1
    }

    $replacements = @(
      @{ Path = $globalJsonPath; Pattern = '("dotnet"\s*:\s*")' + [regex]::Escape($pinned) + '"'; Replacement = '${1}' + $fallback + '"' }
      @{ Path = $versionsPropsPath; Pattern = '<MicrosoftNETSdkPackageVersion>' + [regex]::Escape($pinned) + '</MicrosoftNETSdkPackageVersion>'; Replacement = "<MicrosoftNETSdkPackageVersion>$fallback</MicrosoftNETSdkPackageVersion>" }
    )
    foreach ($item in $replacements) {
      $content = [IO.File]::ReadAllText($item.Path)
      $matchCount = [regex]::Matches($content, $item.Pattern).Count
      if ($matchCount -ne 1) {
        Write-Host "##vso[task.logissue type=error]Expected one SDK pin in $($item.Path), found $matchCount."
        exit 1
      }
      [IO.File]::WriteAllText($item.Path, [regex]::Replace($content, $item.Pattern, $item.Replacement))
    }

    $feedName = '${{ parameters.publicFallbackPackageFeedName }}'
    $feedUrl = '${{ parameters.publicFallbackPackageFeed }}'
    $nugetConfigPath = Join-Path $root 'NuGet.config'
    $nugetConfig = New-Object xml
    $nugetConfig.PreserveWhitespace = $true
    $nugetConfig.Load($nugetConfigPath)
    $packageSources = $nugetConfig.SelectSingleNode('/configuration/packageSources')
    if (-not $packageSources.SelectSingleNode("add[@key='$feedName']")) {
      $source = $nugetConfig.CreateElement('add')
      $source.SetAttribute('key', $feedName)
      $source.SetAttribute('value', $feedUrl)
      $closingWhitespace = $packageSources.LastChild
      $null = $packageSources.InsertBefore($nugetConfig.CreateWhitespace("`n    "), $closingWhitespace)
      $null = $packageSources.InsertBefore($source, $closingWhitespace)
      $nugetConfig.Save($nugetConfigPath)
    }

    Write-Host "##vso[task.logissue type=warning]TEMPORARY: SDK $pinned is internal-only; this build uses public SDK $fallback and package feed $feedUrl instead."
  displayName: 'TEMPORARY: Use public RC2 SDK when the pinned SDK is internal-only'
