# `/review run-ui-tests` request for maui-pr-uitests (eng/pipelines/ci-uitests.yml).
#
# GitHub Actions cannot queue Azure DevOps builds (Microsoft Entra blocks the federated identity and
# Azure Pipelines ignores `/azp run` from bots), so .github/scripts/Invoke-RunTests.ps1 pushes a
# dispatch commit to a refs/heads/run-tests/* branch instead, and the CI trigger of maui-pr-uitests
# builds it. That commit is the PR's test-merge tree with eng/pipelines and .github taken from the
# PR's target branch, and this file rewritten with the validated selection. It is only read for
# run-tests/* branches; this checked-in copy runs nothing.
variables:
  # 'selected' runs RunTestsCategories on RunTestsPlatforms, 'full' the whole suite, anything else nothing.
  - name: RunTestsMode
    value: 'none'
  - name: RunTestsPullRequest
    value: ''
  - name: RunTestsHeadSha
    value: ''
  # Pipeline platform ids, comma-separated: android, ios, catalyst, windows.
  - name: RunTestsPlatforms
    value: ''
  # <platform>:<Category>, comma-separated, as ui-tests.yml selectedCategories expects.
  - name: RunTestsCategories
    value: ''
