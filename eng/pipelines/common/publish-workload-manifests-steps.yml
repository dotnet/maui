parameters:
- name: helperDirectory
  type: string
  default: '$(Pipeline.Workspace)\MauiManifestsForNuGet'
- name: skipFilters
  type: string
  default: skip
- name: validateIdentities
  type: boolean
  default: false

steps:
- pwsh: |
    $scriptPath = Join-Path $env:HELPER_DIRECTORY 'nuget_release_packages.ps1'
    $actualHash = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash
    if ($actualHash -ne $env:EXPECTED_SCRIPT_HASH) {
      throw "Package status script hash '$actualHash' does not match the prepared hash."
    }

    if ([bool]::Parse($env:VALIDATE_IDENTITIES)) {
      & $scriptPath -Action ValidateManifests `
        -PackagesPath '$(Pipeline.Workspace)\MauiManifestsForNuGet' `
        -RecoveryAuditPath (Join-Path $env:HELPER_DIRECTORY 'recovery-audit.json')
    }

    & $scriptPath `
      -Action FilterExisting `
      -PackagesPath '$(Pipeline.Workspace)\MauiManifestsForNuGet' `
      -SkipFilters $env:NUGET_ALREADY_ATTEMPTED_FILTERS
  displayName: Filter already-published workload manifests
  env:
    HELPER_DIRECTORY: ${{ parameters.helperDirectory }}
    EXPECTED_SCRIPT_HASH: $(PackageStatusScriptHash)
    VALIDATE_IDENTITIES: ${{ parameters.validateIdentities }}
    NUGET_ALREADY_ATTEMPTED_FILTERS: ${{ parameters.skipFilters }}

- task: 1ES.PublishNuget@1
  displayName: Push workload manifests to NuGet.org
  condition: and(succeeded(), eq(variables['NuGetPackagesToPublish'], 'true'))
  inputs:
    useDotNetTask: false
    packagesToPush: '$(Pipeline.Workspace)\MauiManifestsForNuGet\*.nupkg'
    packageParentPath: '$(Pipeline.Workspace)\MauiManifestsForNuGet'
    nuGetFeedType: external
    publishFeedCredentials: 'nuget.org (dotnetframework)'

- pwsh: |
    $scriptPath = Join-Path $env:HELPER_DIRECTORY 'nuget_release_packages.ps1'
    $actualHash = (Get-FileHash -LiteralPath $scriptPath -Algorithm SHA256).Hash
    if ($actualHash -ne $env:EXPECTED_SCRIPT_HASH) {
      throw "Package status script hash '$actualHash' does not match the prepared hash."
    }

    & $scriptPath `
      -Action Verify `
      -PackagesPath '$(Pipeline.Workspace)\MauiManifestsForNuGet' `
      -MaxAttempts 90 `
      -DelaySeconds 20 `
      -MaxDurationMinutes 30
  displayName: Verify workload manifests on NuGet.org
  env:
    HELPER_DIRECTORY: ${{ parameters.helperDirectory }}
    EXPECTED_SCRIPT_HASH: $(PackageStatusScriptHash)
