parameters:
  platform: ''
  pool: {}
  versions: []
  timeoutInMinutes: 120
  useCoreClr: true
  targetFrameworkVersion:
    tfm: net11.0
  project:
    name: name
    desc: Tests
    path: ''
    versionsExclude: []
    configuration: Release

jobs:
- ${{ each version in parameters.versions }}:
  - ${{ if not(containsValue(parameters.project.versionsExclude, version)) }}:
    - ${{ each shard in split(iif(and(eq(parameters.platform, 'ios'), eq(parameters.project.name, 'controls')), 'CollectionView;Shell;HybridWebView;General', 'All'), ';') }}:
      - job: ${{ parameters.platform }}_${{ parameters.project.name }}_${{ replace(replace(version, '.', ''), '-', '') }}_${{ shard }}_${{ parameters.useCoreClr }}
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        cancelTimeoutInMinutes: 15
        workspace:
          clean: all
        displayName: ${{ parameters.project.desc }} ${{ parameters.platform }} ${{ version }} ${{ shard }} CoreCLR=${{ parameters.useCoreClr }}
        pool: ${{ parameters.pool }}
        steps:
        - template: device-tests-steps.yml
          parameters:
            platform: ${{ parameters.platform }}
            path: ${{ parameters.project.path }}
            targetFrameworkVersion: ${{ parameters.targetFrameworkVersion.tfm }}
            deviceTestConfiguration: ${{ parameters.project.configuration }}
            useCoreClr: ${{ parameters.useCoreClr }}
            ${{ if eq(parameters.platform, 'android') }}:
              apiVersion: ${{ version }}
            ${{ if eq(parameters.platform, 'ios') }}:
              apiVersion: ${{ replace(version, 'simulator-', '') }}
              applicationId: ${{ parameters.project.applicationId }}
            ${{ if eq(parameters.platform, 'windows') }}:
              device: ${{ version }}
            ${{ if eq(shard, 'General') }}:
              testFilter: SkipCategories=CollectionView,Shell,HybridWebView
            ${{ elseif ne(shard, 'All') }}:
              testFilter: Category=${{ shard }}
