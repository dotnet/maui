parameters:
  platform: ''
  path: ''
  apiVersion: latest
  device: ''
  deviceTestConfiguration: Release
  targetFrameworkVersion: net11.0
  useCoreClr: true
  testFilter: ''
  applicationId: ''
  expectedOSMajor: 0
  expectedArchitecture: ''
  requireWindows11: false

steps:
- checkout: self
  clean: true
  persistCredentials: false

- pwsh: |
    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/tests/$(System.JobId)/$(System.JobAttempt)" | Out-Null
    New-Item -ItemType Directory -Force -Path "$(Build.Arcade.LogsPath)" | Out-Null
    Write-Host "##vso[task.setvariable variable=TestResultsDirectory]$(Build.ArtifactStagingDirectory)/tests/$(System.JobId)/$(System.JobAttempt)"
  displayName: Initialize unique results directory

- ${{ if eq(parameters.platform, 'android') }}:
  - template: enable-kvm.yml

- template: provision.yml
  parameters:
    skipXcode: ${{ or(eq(parameters.platform, 'android'), eq(parameters.platform, 'windows')) }}
    skipSimulatorSetup: true
    skipJdk: ${{ ne(parameters.platform, 'android') }}
    skipAndroidCommonSdks: ${{ ne(parameters.platform, 'android') }}
    skipAndroidPlatformApis: ${{ ne(parameters.platform, 'android') }}
    onlyAndroidPlatformDefaultApis: true
    skipAndroidEmulatorImages: true
    skipAndroidCreateAvds: true
    skipInternalFeeds: true

- script: dotnet cake --target=dotnet-buildtasks --configuration="${{ parameters.deviceTestConfiguration }}" --verbosity=diagnostic
  displayName: Provision SDK and build BuildTasks
  env:
    DOTNET_TOKEN: $(dotnetbuilds-internal-container-read-token)
    PRIVATE_BUILD: $(PrivateBuild)

- pwsh: |
    & ./.github/skills/run-device-tests/scripts/Start-TestDevice.ps1 -Platform '${{ parameters.platform }}' -ApiVersion '${{ parameters.apiVersion }}' -ResultsDirectory "$(TestResultsDirectory)" -DeviceDirectory "$(Pipeline.Workspace)/test-devices/$(System.JobId)/$(System.JobAttempt)" -ExpectedOSMajor ${{ parameters.expectedOSMajor }} -ExpectedArchitecture '${{ parameters.expectedArchitecture }}' -RequireWindows11 ([System.Convert]::ToBoolean('${{ parameters.requireWindows11 }}'))
  displayName: Provision and select job-owned device
  timeoutInMinutes: 15

- ${{ if and(eq(parameters.platform, 'windows'), eq(parameters.device, 'unpackaged')) }}:
  - pwsh: |
      $arguments = '-p:SelfContained=true -p:WindowsPackageType=None -p:_MauiDeviceTestUnpackaged=true -p:ExtraDefineConstants=UNPACKAGED'
      Write-Host "##vso[task.setvariable variable=DeviceTestArguments]$arguments"
    displayName: Configure Windows unpackaged execution

- ${{ if and(eq(parameters.platform, 'windows'), eq(parameters.device, 'packaged')) }}:
  - pwsh: |
      $state = & ./.github/skills/run-device-tests/scripts/WindowsTestPackage.ps1 -Action Prepare -StatePath "$(TestResultsDirectory)/package-state.json" -ProjectPath "${{ parameters.path }}" -TimeoutSeconds 6600
      $arguments = @(
          '-p:MauiTestPackaged=true'
          '-p:WindowsPackageType=MSIX'
          '-p:_MauiDeviceTestUnpackaged=false'
          "-p:ApplicationId=$($state.IdentityName)"
          "-p:MauiTestPackageIdentityName=$($state.IdentityName)"
          "-p:MauiTestPackagePublisher=$($state.Publisher)"
          "-p:PackageCertificateThumbprint=$($state.CertificateThumbprint)"
          '-p:AppxPackageSigningEnabled=true'
          '-p:UapAppxPackageBuildMode=SideloadOnly'
          '-p:AppxBundle=Never'
          '-p:SelfContained=true'
          '-p:ExtraDefineConstants=PACKAGED'
          '-p:AppxPackageDir="$(TestResultsDirectory)/msix/"'
          '-p:MauiTestLauncherPath="$(TestResultsDirectory)/launcher/WindowsTestLauncher.dll"'
          '-p:MauiTestPackageStatePath="$(TestResultsDirectory)/package-state.json"'
          '-p:MauiTestPackageManifestPath="$(TestResultsDirectory)/Package.appxmanifest"'
      )
      Write-Host "##vso[task.setvariable variable=DeviceTestArguments]$($arguments -join ' ')"
    displayName: Prepare unique MSIX identity and signing certificate

  - template: run-dotnet-preview.yml
    parameters:
      displayName: Build installed-package MTP launcher
      command: build
      project: .github/skills/run-device-tests/scripts/windows-launcher/WindowsTestLauncher.csproj
      arguments: --configuration Release --output "$(TestResultsDirectory)/launcher"
      continueOnError: false
      useExitCodeForErrors: true

  - template: run-dotnet-preview.yml
    parameters:
      displayName: Build and sign owned MSIX
      command: build
      project: '"${{ parameters.path }}"'
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-windows10.0.19041.0
        -p:RuntimeIdentifier=win-x64
        -p:RuntimeIdentifierOverride=win-x64
        -p:IsRidAgnostic=false
        -p:MauiTestFilter="${{ replace(parameters.testFilter, ',', '%2C') }}"
        -p:MauiTestResultsDirectory="$(TestResultsDirectory)"
        $(DeviceTestArguments)
        -bl:"$(TestResultsDirectory)/build-packaged.binlog"
      continueOnError: false
      useExitCodeForErrors: true

  - pwsh: |
      $null = & ./.github/skills/run-device-tests/scripts/WindowsTestPackage.ps1 -Action Install -StatePath "$(TestResultsDirectory)/package-state.json" -PackageDirectory "$(TestResultsDirectory)/msix"
    displayName: Install signed MSIX and its SDK dependencies

- ${{ if eq(parameters.platform, 'android') }}:
  - template: run-dotnet-preview.yml
    parameters:
      displayName: Run Android tests directly
      command: test
      project: --project "${{ parameters.path }}"
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-android
        --device "$(TestDevice)"
        --report-trx
        --results-directory "$(TestResultsDirectory)"
        -p:RuntimeIdentifier=$(TestRuntimeIdentifier)
        -p:UseMonoRuntime=${{ ne(parameters.useCoreClr, true) }}
        -p:_DisableCheckForUnsupportedMonoMobileRuntime=true
        -p:MauiTestFilter="${{ replace(parameters.testFilter, ',', '%2C') }}"
        -bl:"$(TestResultsDirectory)/test.binlog"
      continueOnError: false
      useExitCodeForErrors: true

- ${{ if eq(parameters.platform, 'ios') }}:
  - template: run-dotnet-preview.yml
    parameters:
      displayName: Run iOS tests directly
      command: test
      project: --project "${{ parameters.path }}"
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-ios
        --device "$(TestDevice)"
        -p:RuntimeIdentifier=$(TestRuntimeIdentifier)
        -p:CodesignRequireProvisioningProfile=false
        -p:UseMonoRuntime=${{ ne(parameters.useCoreClr, true) }}
        -p:_DisableCheckForUnsupportedMonoMobileRuntime=true
        -p:MauiTestFilter="${{ replace(parameters.testFilter, ',', '%2C') }}"
        -bl:"$(TestResultsDirectory)/test.binlog"
      continueOnError: false
      useExitCodeForErrors: true

- ${{ if eq(parameters.platform, 'catalyst') }}:
  - template: run-dotnet-preview.yml
    parameters:
      displayName: Run Mac Catalyst tests directly
      command: test
      project: --project "${{ parameters.path }}"
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-maccatalyst
        -p:RuntimeIdentifier=$(TestRuntimeIdentifier)
        -p:CodesignRequireProvisioningProfile=false
        -p:UseMonoRuntime=${{ ne(parameters.useCoreClr, true) }}
        -p:MauiTestFilter="${{ replace(parameters.testFilter, ',', '%2C') }}"
        -p:MauiTestResultsDirectory="$(TestResultsDirectory)"
        -bl:"$(TestResultsDirectory)/test.binlog"
      continueOnError: false
      useExitCodeForErrors: true

- ${{ if eq(parameters.platform, 'windows') }}:
  - template: run-dotnet-preview.yml
    parameters:
      displayName: Run Windows ${{ parameters.device }} tests directly
      command: test
      project: --project "${{ parameters.path }}"
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-windows10.0.19041.0
        --report-trx
        --results-directory "$(TestResultsDirectory)"
        --diagnostic
        --diagnostic-synchronous-write
        --diagnostic-output-directory "$(TestResultsDirectory)/diagnostics"
        --crashdump
        --crashdump-type Mini
        -p:RuntimeIdentifier=win-x64
        -p:RuntimeIdentifierOverride=win-x64
        -p:IsRidAgnostic=false
        -p:MauiTestFilter="${{ replace(parameters.testFilter, ',', '%2C') }}"
        -p:MauiTestResultsDirectory="$(TestResultsDirectory)"
        $(DeviceTestArguments)
        -bl:"$(TestResultsDirectory)/test.binlog"
        ${{ iif(eq(parameters.device, 'packaged'), '--no-build', '') }}
      continueOnError: false
      useExitCodeForErrors: true

- ${{ if and(eq(parameters.platform, 'windows'), eq(parameters.device, 'unpackaged'), eq(parameters.applicationId, 'com.microsoft.maui.controls.devicetests')) }}:
  - template: run-dotnet-preview.yml
    parameters:
      displayName: Verify native ownership and focus regressions
      command: test
      project: --project "${{ parameters.path }}"
      arguments: >-
        --configuration ${{ parameters.deviceTestConfiguration }}
        --framework ${{ parameters.targetFrameworkVersion }}-windows10.0.19041.0
        --no-build
        --filter-class
        Microsoft.Maui.DeviceTests.WindowTests
        Microsoft.Maui.DeviceTests.FlyoutPageTests
        Microsoft.Maui.DeviceTests.Memory.WindowOverlayTests
        Microsoft.Maui.DeviceTests.ScrollViewTests
        --filter-method
        "*NativeAttachmentDisposesItsWindowScope*"
        "*DoesNotLeakAsModal*"
        "*DoesNotLeak"
        "*EntryDoesNotReceiveFocusWhenScrollViewReloads*"
        "*RemovingScrollViewDuringLoadingDoesNotStrandTemporaryTabStop*"
        "*QueuedTabStopRestoreDoesNotRunAfterDisconnect*"
        --report-trx
        --results-directory "$(TestResultsDirectory)/ownership-regressions"
        -p:RuntimeIdentifier=win-x64
        -p:RuntimeIdentifierOverride=win-x64
        -p:IsRidAgnostic=false
        $(DeviceTestArguments)
      condition: always()
      continueOnError: false
      useExitCodeForErrors: true

- ${{ if eq(parameters.platform, 'windows') }}:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $dumps = @(Get-ChildItem -LiteralPath "$(TestResultsDirectory)" -File -Filter 'native-process-*.dmp')
      if (!$dumps.Count) {
          Write-Host 'No owned native process snapshot was produced.'
          exit 0
      }
      foreach ($name in @('GITHUB_TOKEN', 'GH_TOKEN', 'GH_ENTERPRISE_TOKEN', 'GITHUB_ENTERPRISE_TOKEN', 'COPILOT_GITHUB_TOKEN')) {
          [Environment]::SetEnvironmentVariable($name, $null, 'Process')
      }
      $env:DOTNET_ROOT = "$(Build.SourcesDirectory)/.dotnet"
      $dotnet = Join-Path $env:DOTNET_ROOT 'dotnet.exe'
      $tools = "$(Agent.TempDirectory)/maui-dump-tools/$(System.JobId)/$(System.JobAttempt)"
      $analyzer = Join-Path $tools 'dotnet-dump.exe'
      if (!(Test-Path -LiteralPath $analyzer -PathType Leaf)) {
          Write-Host 'Installing the missing dump analyzer into this job-owned tool directory.'
          & $dotnet tool install dotnet-dump --tool-path $tools --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { throw "Dump analyzer installation failed with exit code $LASTEXITCODE." }
      }
      foreach ($dump in $dumps) {
          $summary = "$($dump.FullName).analysis.txt"
          & $analyzer analyze $dump.FullName -c 'dumpheap -stat' -c 'clrthreads' -c exit *> $summary
          if ($LASTEXITCODE -ne 0) { throw "Dump analysis failed with exit code $LASTEXITCODE. See $summary." }
          $statistics = Get-Content -LiteralPath $summary
          foreach ($type in @('Microsoft.Maui.MauiWinUIWindow', 'Microsoft.Maui.WindowOverlay', 'Microsoft.Maui.Platform.WindowRootView', 'Microsoft.Maui.Controls.FlyoutPage', 'Microsoft.Maui.Controls.ContentPage')) {
              $typePattern = '^\s*([0-9a-fA-F]{12,16})\s+[\d,]+\s+[\d,]+\s+' + [regex]::Escape($type) + '\s*$'
              $methodTables = @($statistics | ForEach-Object {
                  if ($_ -match $typePattern) { $Matches[1] }
              })
              if (!$methodTables.Count) {
                  Write-Host "No objects of exact type $type were listed in this snapshot."
                  continue
              }
              $objects = "$($dump.FullName).$type.objects.txt"
              $commands = @('analyze', $dump.FullName)
              foreach ($methodTable in $methodTables) {
                  $commands += @('-c', "dumpheap -mt $methodTable -short")
              }
              & $analyzer @commands -c exit *> $objects
              if ($LASTEXITCODE -ne 0) { throw "Object enumeration failed with exit code $LASTEXITCODE. See $objects." }
              $addresses = @(Get-Content -LiteralPath $objects |
                  Where-Object { $_ -match '^\s*[0-9a-fA-F]{12,16}\s*$' } |
                  ForEach-Object { $_.Trim() })
              if (!$addresses.Count) { throw "No addresses were enumerated for $type despite its heap statistics entry. See $objects." }
              $roots = "$($dump.FullName).$type.roots.txt"
              $commands = @('analyze', $dump.FullName)
              foreach ($address in $addresses) {
                  $commands += @('-c', "dumpobj $address", '-c', "gcroot $address")
              }
              & $analyzer @commands -c exit *> $roots
              if ($LASTEXITCODE -ne 0) { throw "Root analysis failed with exit code $LASTEXITCODE. See $roots." }
              $completed = @(Select-String -LiteralPath $roots -Pattern '^\s*Found \d+ unique roots\.\s*$')
              if ($completed.Count -ne $addresses.Count) { throw "Root analysis completed $($completed.Count) of $($addresses.Count) objects for $type. See $roots." }
              Write-Host "Analyzed all $($addresses.Count) objects of exact type $type."
          }
      }
    displayName: Analyze owned native process snapshots
    condition: always()
    timeoutInMinutes: 10

- ${{ if eq(parameters.platform, 'ios') }}:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $statePath = "$(TestResultsDirectory)/device.json"
      if (!(Test-Path -LiteralPath $statePath)) { throw 'No job-owned simulator was provisioned.' }
      $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
      if (!$state.Device) { throw 'No simulator UDID was recorded.' }
      $container = (& xcrun simctl get_app_container $state.Device '${{ parameters.applicationId }}' data).Trim()
      if (!$container -or !(Test-Path -LiteralPath $container -PathType Container)) {
          throw 'Could not resolve the installed test app data container.'
      }
      $source = Join-Path $container 'Documents/TestResults'
      if (!(Test-Path -LiteralPath (Join-Path $source 'testResults.trx') -PathType Leaf)) {
          throw "The native reporter did not produce '$source/testResults.trx'."
      }
      Copy-Item -LiteralPath $source -Destination "$(TestResultsDirectory)/native" -Recurse
    displayName: Collect genuine native TRX from the owned iOS simulator app
    condition: always()

- pwsh: |
    & ./eng/scripts/Assert-TestResults.ps1 -ResultsDirectory "$(TestResultsDirectory)"
  displayName: Require real nonempty successful TRX
  condition: always()

- pwsh: |
    & ./.github/skills/run-device-tests/scripts/Stop-TestDevice.ps1 -ResultsDirectory "$(TestResultsDirectory)"
  displayName: Capture device logs and remove only job-owned devices
  condition: always()
  timeoutInMinutes: 10

- ${{ if and(eq(parameters.platform, 'windows'), eq(parameters.device, 'packaged')) }}:
  - pwsh: |
      & ./.github/skills/run-device-tests/scripts/WindowsTestPackage.ps1 -Action Cleanup -StatePath "$(TestResultsDirectory)/package-state.json"
    displayName: Stop recorded activated PID and remove only the owned MSIX and certificate
    condition: always()
    timeoutInMinutes: 10

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(TestResultsDirectory)/**/*.trx'
    testRunTitle: '$(System.JobName) (attempt $(System.JobAttempt))'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
    failTaskOnFailureToPublishResults: true

- publish: $(TestResultsDirectory)
  displayName: Publish native results and device logs
  condition: always()
  artifact: DeviceTests-$(System.StageName)-$(System.JobId)-$(System.JobAttempt)

- publish: $(Build.Arcade.LogsPath)
  displayName: Publish build logs
  condition: always()
  artifact: DeviceTestBuildLogs-$(System.StageName)-$(System.JobId)-$(System.JobAttempt)
