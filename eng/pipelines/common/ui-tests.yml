parameters:
  - name: selectedRun
    type: boolean
    default: false
  - name: selectedPlatforms
    type: object
    default: [android, ios, catalyst, windows]
  # Individual identifiers, not comma-separated category groups. Umbrellas expand to CI shards.
  - name: selectedCategories
    type: object
    default: []
  - name: androidPool
    type: object
    default: {}
  - name: androidLinuxPool
    type: object
    default: {}
  - name: iosPool
    type: object
    default: {}
  - name: iosXcodeVersion
    type: string
    default: ''
  - name: windowsPool
    type: object
    default: {}
  - name: windowsBuildPool
    type: object
    default: {}
  - name: macosPool
    type: object
    default: {}
  - name: iosVersions
    type: object
    default: ['latest']
  - name: androidApiLevels
    type: object
    default: [30]
  - name: androidApiLevelsExtended
    type: object
    default: [36] # Separate API level for tests requiring Pixel 3 XL
  - name: provisionatorChannel
    type: string
    default: latest
  - name: defaultiOSVersion
    type: string
    default: '26.0'
  - name: timeoutInMinutes
    type: number
    default: 180
  - name: skipProvisioning
    type: boolean
    default: true
  - name: BuildNativeAOT
    type: boolean
    default: false
  - name: RunNativeAOT
    type: boolean
    default: false
  - name: categoryGroupsToTest
    type: object
    default:
    # Make sure that this list is always up-to-date with src/Controls/tests/TestCases.Shared.Tests/UITestCategories.cs
    # we might want to improve this somehow depending on how much the categories change over time
    # Note: Material3 is intentionally excluded from this list and has its own dedicated build and test stages below with a separate test filter
    - 'Accessibility,ActionSheet,ActivityIndicator,Animation,AppLinks'
    - 'Border,BoxView,Brush,Button'
    - 'CarouselView'
    # CollectionView remains the umbrella category for local runs. CI uses the explicit CollectionView1-7 shard categories below.
    - 'CollectionView1'
    - 'CollectionView2'
    - 'CollectionView3'
    - 'CollectionView4'
    - 'CollectionView5'
    - 'CollectionView6'
    - 'CollectionView7'
    - 'Cells,CheckBox,ContextActions,CustomRenderers,DatePicker,Dispatcher,DisplayAlert,DisplayPrompt,DragAndDrop'
    - 'Entry'
    - 'Editor,Effects,Essentials,FlyoutPage,Focus,Fonts,Frame,Gestures,GraphicsView'
    - 'Image,ImageButton,IndicatorView,InputTransparent,IsEnabled,IsVisible'
    - 'Label'
    - 'Layout'
    - 'Lifecycle,ManualReview,Maps'
    - 'Navigation'
    - 'Page,Performance,Picker,ProgressBar'
    - 'RadioButton,RefreshView'
    # SafeAreaEdges runs on the common lanes, except on Android where it is excluded and runs
    # in a dedicated notch-device (Pixel 3 XL) stage instead.
    - 'SafeAreaEdges'
    - 'Shadow'
    - 'ScrollView'
    - 'SearchBar,Shape,Slider'
    - 'SoftInput,Stepper,Switch,SwipeView'
    # Shell remains the umbrella category for local runs. CI uses Shell1 and Shell2 on every platform.
    - 'Shell1'
    - 'Shell2'
    - 'TabbedPage,TableView,TimePicker,TitleView,ToolbarItem,Triggers'
    - 'ViewBaseTests,VisualStateManager,Window'
    - 'WebView'

  - name: projects
    type: object
    default:
    - name: name
      desc: Human Description
      android: /optional/path/to/android.csproj
      ios: /optional/path/to/ios.csproj
      winui: /optional/path/to/winui.csproj
      mac: /optional/path/to/mac.csproj
      app: /optional/path/to/app.csproj

stages:
- ${{ if and(or(containsValue(parameters.selectedPlatforms, 'android'), containsValue(parameters.selectedPlatforms, 'ios'), containsValue(parameters.selectedPlatforms, 'catalyst')), or(eq(length(parameters.selectedCategories), 0), ne(join('', parameters.selectedCategories), 'Material3'))) }}:
  - stage: build_ui_tests_coreclr
    displayName: Build UITests CoreCLR Sample App
    dependsOn: []
    jobs:
      - job: build_ui_tests
        displayName: Build Sample App
        pool: ${{ parameters.androidPool }}
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: ui-tests-build-sample.yml
            parameters:
                runtimeVariant: "CoreCLR"
                platforms: ${{ parameters.selectedPlatforms }}
                skipProvisioning: ${{ parameters.skipProvisioning }}

  # Material3 feature tests use their own category, not the corresponding control category.
  # Selecting an affected control therefore retains the complete Material3 variant.
- ${{ if and(containsValue(parameters.selectedPlatforms, 'android'), or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'Material3'), contains(join(',', parameters.selectedCategories), 'Button'), contains(join(',', parameters.selectedCategories), 'Picker'), containsValue(parameters.selectedCategories, 'CheckBox'), containsValue(parameters.selectedCategories, 'Editor'), containsValue(parameters.selectedCategories, 'Entry'), containsValue(parameters.selectedCategories, 'Image'), containsValue(parameters.selectedCategories, 'Label'), containsValue(parameters.selectedCategories, 'ProgressBar'), containsValue(parameters.selectedCategories, 'SearchBar'), containsValue(parameters.selectedCategories, 'Slider'), containsValue(parameters.selectedCategories, 'Switch'))) }}:
  - stage: build_ui_tests_material3
    displayName: Build UITests Material3 Sample App
    dependsOn: []
    jobs:
      - job: build_ui_tests_material3
        displayName: Build Sample App (Material3)
        workspace:
          clean: all
        pool: ${{ parameters.androidPool }}
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: ui-tests-build-sample.yml
            parameters:
                runtimeVariant: "CoreCLR"
                platform: android
                useMaterial3: true
                skipProvisioning: ${{ parameters.skipProvisioning }}
  
  # NativeAOT UI tests build stage - only run when BuildNativeAOT parameter is true
- ${{ if and(eq(parameters.BuildNativeAOT, true), containsValue(parameters.selectedPlatforms, 'ios'), or(eq(length(parameters.selectedCategories), 0), ne(join('', parameters.selectedCategories), 'Material3'))) }}:
    - stage: build_ui_tests_nativeaot
      displayName: Build UITests NativeAOT Sample App
      dependsOn: []
      jobs:
        - job: build_ui_tests
          displayName: Build Sample App
          pool: ${{ parameters.androidPool }}
          variables:
            APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
          steps:
            - template: ui-tests-build-sample.yml
              parameters:
                  runtimeVariant: "NativeAOT"
                  platform: ios
                  skipProvisioning: ${{ parameters.skipProvisioning }}

- ${{ if and(containsValue(parameters.selectedPlatforms, 'windows'), or(eq(length(parameters.selectedCategories), 0), ne(replace(replace(join('', parameters.selectedCategories), 'Material3', ''), 'WebView', ''), ''))) }}:
  - stage: build_ui_tests_windows
    displayName: Build UITests Windows Sample App
    dependsOn: []
    jobs:
      - job: build_ui_tests
        displayName: Build Sample App (Windows)
        pool: ${{ parameters.windowsBuildPool }}
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: ui-tests-build-sample.yml
            parameters:
                platform: windows
                runtimeVariant: "CoreCLR"
                skipProvisioning: ${{ parameters.skipProvisioning }}

  # Windows CV1 Build Stage - Separate build with UseWindowsCollectionView2Handler=false
- ${{ if and(containsValue(parameters.selectedPlatforms, 'windows'), or(eq(length(parameters.selectedCategories), 0), contains(join(',', parameters.selectedCategories), 'CollectionView'))) }}:
  - stage: build_ui_tests_windows_cv1
    displayName: Build UITests Windows CV1 Sample App
    dependsOn: []
    jobs:
      - job: build_ui_tests_windows_cv1
        displayName: Build Sample App (Windows CV1)
        workspace:
          clean: all
        pool: ${{ parameters.windowsBuildPool }}
        variables:
          APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
        steps:
          - template: ui-tests-build-sample.yml
            parameters:
                platform: windows
                runtimeVariant: "CoreCLR"
                useWindowsCV1: true
                skipProvisioning: ${{ parameters.skipProvisioning }}
- ${{ if and(containsValue(parameters.selectedPlatforms, 'android'), or(eq(length(parameters.selectedCategories), 0), ne(replace(replace(join('', parameters.selectedCategories), 'Material3', ''), 'SafeAreaEdges', ''), ''))) }}:
  - stage: android_ui_tests_coreclr
    displayName: Android UITests CoreClr
    dependsOn: build_ui_tests_coreclr
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.android, '') }}:
          - ${{ each api in parameters.androidApiLevels }}:
            - ${{ if not(containsValue(project.androidApiLevelsExclude, api)) }}:
              - job: android_ui_tests_${{ project.name }}_${{ api }}
                strategy:
                  matrix:
                    # SafeAreaEdges is excluded here; it runs on a dedicated Pixel 3 XL (notch) stage on Android
                    ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                      ${{ if eq(length(parameters.selectedCategories), 0) }}:
                        ${{ if ne(categoryGroup, 'SafeAreaEdges') }}:
                          ${{ categoryGroup }}:
                            CATEGORYGROUP: ${{ categoryGroup }}
                      ${{ else }}:
                        ${{ each category in split(categoryGroup, ',') }}:
                          ${{ if and(ne(category, 'SafeAreaEdges'), or(containsValue(parameters.selectedCategories, category), and(startsWith(category, 'CollectionView'), containsValue(parameters.selectedCategories, 'CollectionView')), and(startsWith(category, 'Shell'), containsValue(parameters.selectedCategories, 'Shell')))) }}:
                            ${{ category }}:
                              CATEGORYGROUP: ${{ category }}
                timeoutInMinutes: 240 # how long to run the job before automatically cancelling
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }} (API ${{ api }})
                pool: ${{ parameters.androidLinuxPool }}
                variables:
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      platform: android
                      version: ${{ api }}
                      path: ${{ project.android }}
                      app: ${{ project.app }}
                      ${{ if eq(api, 27) }}:
                        device: android-emulator-32_${{ api }}
                      ${{ if not(eq(api, 27)) }}:
                        device: android-emulator-64_${{ api }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      agentPoolAccessToken: ${{ parameters.agentPoolAccessToken }}
                      testFilter: $(CATEGORYGROUP)
                      headless: ${{ parameters.headless }}
                      skipProvisioning: ${{ parameters.skipProvisioning }}
                      runtimeVariant: "CoreCLR"
                  
                  # Collect and publish Android snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'Android'
                      artifactName: 'uitest-snapshot-results-android-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

- ${{ if and(containsValue(parameters.selectedPlatforms, 'android'), or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'Shell'), containsValue(parameters.selectedCategories, 'Shell1'), containsValue(parameters.selectedCategories, 'Shell2'))) }}:
  - stage: android_ui_tests_shell_renderer
    displayName: Android UITests Shell Renderer
    dependsOn: build_ui_tests_coreclr
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.android, '') }}:
          - ${{ each api in parameters.androidApiLevels }}:
            - ${{ if not(containsValue(project.androidApiLevelsExclude, api)) }}:
              - job: shell_renderer_android_ui_tests_${{ project.name }}_${{ api }}
                strategy:
                  matrix:
                    ${{ if or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'Shell'), containsValue(parameters.selectedCategories, 'Shell1')) }}:
                      Shell1:
                        CATEGORYGROUP: Shell1
                    ${{ if or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'Shell'), containsValue(parameters.selectedCategories, 'Shell2')) }}:
                      Shell2:
                        CATEGORYGROUP: Shell2
                timeoutInMinutes: 240
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }} Shell Renderer (API ${{ api }})
                pool: ${{ parameters.androidLinuxPool }}
                variables:
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: android
                      version: ${{ api }}
                      path: ${{ project.android }}
                      app: ${{ project.app }}
                      ${{ if eq(api, 27) }}:
                        device: android-emulator-32_${{ api }}
                      ${{ if not(eq(api, 27)) }}:
                        device: android-emulator-64_${{ api }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      agentPoolAccessToken: ${{ parameters.agentPoolAccessToken }}
                      testFilter: $(CATEGORYGROUP)
                      testConfigurationArgs: "ShellRenderer"
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      headless: ${{ parameters.headless }}
                      skipProvisioning: ${{ parameters.skipProvisioning }}
                      runtimeVariant: "CoreCLR"

                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'Android Shell Renderer'
                      artifactName: 'uitest-snapshot-results-android-shell-renderer-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

- ${{ if and(containsValue(parameters.selectedPlatforms, 'android'), or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'Material3'), contains(join(',', parameters.selectedCategories), 'Button'), contains(join(',', parameters.selectedCategories), 'Picker'), containsValue(parameters.selectedCategories, 'CheckBox'), containsValue(parameters.selectedCategories, 'Editor'), containsValue(parameters.selectedCategories, 'Entry'), containsValue(parameters.selectedCategories, 'Image'), containsValue(parameters.selectedCategories, 'Label'), containsValue(parameters.selectedCategories, 'ProgressBar'), containsValue(parameters.selectedCategories, 'SearchBar'), containsValue(parameters.selectedCategories, 'Slider'), containsValue(parameters.selectedCategories, 'Switch'))) }}:
  - stage: android_ui_tests_material3
    displayName: Android UITests Material3
    dependsOn: build_ui_tests_material3
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.android, '') }}:
          - ${{ each api in parameters.androidApiLevelsExtended }}:
            - ${{ if not(containsValue(project.androidApiLevelsExclude, api)) }}:
              - job: M3_android_ui_tests_${{ project.name }}_${{ api }}
                timeoutInMinutes: 240
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }} Material3 (API ${{ api }})
                pool: ${{ parameters.androidLinuxPool }}
                variables:
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: android
                      version: ${{ api }}
                      path: ${{ project.android }}
                      app: ${{ project.app }}
                      ${{ if eq(api, 27) }}:
                        device: android-emulator-32_${{ api }}
                      ${{ if not(eq(api, 27)) }}:
                        device: android-emulator-64_${{ api }}
                      deviceType: "pixel_3_xl"
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      runtimeVariant: "CoreCLR"
                      useMaterial3: true
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      testFilter: "Material3"
                      skipProvisioning: ${{ parameters.skipProvisioning }}

                  # Collect and publish Android Material3 snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'Android Material3'
                      artifactName: 'uitest-snapshot-results-android-material3-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

# SafeAreaEdges tests on Android API 36 with Pixel 3 XL
- ${{ if and(containsValue(parameters.selectedPlatforms, 'android'), or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'SafeAreaEdges'))) }}:
  - stage: android_ui_tests_safeareaedges
    displayName: Android UITests SafeAreaEdges (API 36 Pixel 3 XL)
    dependsOn: build_ui_tests_coreclr
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.android, '') }}:
          - ${{ each api in parameters.androidApiLevelsExtended }}:
            - job: android_ui_tests_safeareaedges_${{ project.name }}_${{ api }}
              timeoutInMinutes: 240 # how long to run the job before automatically cancelling
              workspace:
                clean: all
              displayName: ${{ coalesce(project.desc, project.name) }} SafeAreaEdges (API ${{ api }} Pixel 3 XL)
              pool: ${{ parameters.androidLinuxPool }}
              variables:
                REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
                APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
              steps:
                - template: ui-tests-steps.yml
                  parameters:
                    platform: android
                    version: ${{ api }}
                    path: ${{ project.android }}
                    app: ${{ project.app }}
                    device: android-emulator-64_${{ api }}
                    deviceType: 'pixel_3_xl' # Pixel 3 XL has notch display for SafeAreaEdges tests
                    provisionatorChannel: ${{ parameters.provisionatorChannel }}
                    runtimeVariant: "CoreCLR"
                    testFilter: 'SafeAreaEdges'
                    requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                    skipProvisioning: ${{ parameters.skipProvisioning }}

                # Collect and publish Android SafeAreaEdges snapshot diffs
                - template: ui-tests-collect-snapshot-diffs.yml
                  parameters:
                    platform: 'Android SafeAreaEdges'
                    artifactName: 'uitest-snapshot-results-android-safeareaedges-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

- ${{ if and(containsValue(parameters.selectedPlatforms, 'ios'), or(eq(length(parameters.selectedCategories), 0), ne(join('', parameters.selectedCategories), 'Material3'))) }}:
  - stage: ios_ui_tests_coreclr
    displayName: iOS UITests CoreCLR
    dependsOn: build_ui_tests_coreclr
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.ios, '') }}:
          - ${{ each version in parameters.iosVersions }}:
            - ${{ if not(containsValue(project.iosVersionsExclude, version)) }}:
              - job: ios_ui_tests_coreclr_${{ project.name }}_${{ replace(version, '.', '_') }}
                strategy:
                  matrix:
                    ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                      ${{ if eq(length(parameters.selectedCategories), 0) }}:
                        ${{ categoryGroup }}:
                          CATEGORYGROUP: ${{ categoryGroup }}
                      ${{ else }}:
                        ${{ each category in split(categoryGroup, ',') }}:
                          ${{ if or(containsValue(parameters.selectedCategories, category), and(startsWith(category, 'CollectionView'), containsValue(parameters.selectedCategories, 'CollectionView')), and(startsWith(category, 'Shell'), containsValue(parameters.selectedCategories, 'Shell'))) }}:
                            ${{ category }}:
                              CATEGORYGROUP: ${{ category }}
                timeoutInMinutes: ${{ parameters.timeoutInMinutes }} # how long to run the job before automatically cancelling
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }} (v${{ version }})
                pool: ${{ parameters.iosPool }}
                variables:
                  ${{ if ne(parameters.iosXcodeVersion, '') }}:
                    XCODE: ${{ parameters.iosXcodeVersion }}
                    REQUIRED_XCODE: ${{ parameters.iosXcodeVersion }}
                  ${{ else }}:
                    REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: ios
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      ${{ if eq(version, 'latest') }}:
                        version: 18.5
                      ${{ if ne(version, 'latest') }}:
                        version: ${{ version }}
                      path: ${{ project.ios }}
                      app: ${{ project.app }}
                      ${{ if and(eq(version, 'latest'), true) }}:
                        device: ios-simulator-64
                      ${{ if and(ne(version, 'latest'), true) }}:
                        device: ios-simulator-64_${{ version }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      runtimeVariant : "CoreCLR"
                      testFilter: $(CATEGORYGROUP)
                      headless: ${{ parameters.headless }}
                      skipProvisioning: ${{ parameters.skipProvisioning }}
                  
                  # Collect and publish iOS snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'iOS'
                      artifactName: 'uitest-snapshot-results-ios-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

- ${{ if and(eq(parameters.BuildNativeAOT, true), eq(parameters.RunNativeAOT, true), containsValue(parameters.selectedPlatforms, 'ios'), or(eq(length(parameters.selectedCategories), 0), ne(join('', parameters.selectedCategories), 'Material3'))) }}:
    - stage: ios_ui_tests_nativeaot
      displayName: iOS UITests NativeAOT
      dependsOn: build_ui_tests_nativeaot
      jobs:
        - ${{ each project in parameters.projects }}:
          - ${{ if ne(project.ios, '') }}:
            - ${{ each version in parameters.iosVersions }}:
              - ${{ if not(containsValue(project.iosVersionsExclude, version)) }}:
                - job: ios_ui_tests_nativeaot_${{ project.name }}_${{ replace(version, '.', '_') }}
                  strategy:
                    matrix:
                      ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                        ${{ if eq(length(parameters.selectedCategories), 0) }}:
                          ${{ categoryGroup }}:
                            CATEGORYGROUP: ${{ categoryGroup }}
                        ${{ else }}:
                          ${{ each category in split(categoryGroup, ',') }}:
                            ${{ if or(containsValue(parameters.selectedCategories, category), and(startsWith(category, 'CollectionView'), containsValue(parameters.selectedCategories, 'CollectionView')), and(startsWith(category, 'Shell'), containsValue(parameters.selectedCategories, 'Shell'))) }}:
                              ${{ category }}:
                                CATEGORYGROUP: ${{ category }}
                  timeoutInMinutes: ${{ parameters.timeoutInMinutes }} # how long to run the job before automatically cancelling
                  workspace:
                    clean: all
                  displayName: ${{ coalesce(project.desc, project.name) }} (v${{ version }})
                  pool: ${{ parameters.iosPool }}
                  variables:
                    ${{ if ne(parameters.iosXcodeVersion, '') }}:
                      XCODE: ${{ parameters.iosXcodeVersion }}
                      REQUIRED_XCODE: ${{ parameters.iosXcodeVersion }}
                    APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                  steps:
                    - template: ui-tests-steps.yml
                      parameters:
                        platform: ios
                        requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                        ${{ if eq(version, 'latest') }}:
                          version: ${{ parameters.defaultiOSVersion }}
                        ${{ if ne(version, 'latest') }}:
                          version: ${{ version }}
                        path: ${{ project.ios }}
                        app: ${{ project.app }}
                        ${{ if eq(version, 'latest') }}:
                          device: ios-simulator-64
                        ${{ if ne(version, 'latest') }}:
                          device: ios-simulator-64_${{ version }}
                        provisionatorChannel: ${{ parameters.provisionatorChannel }}
                        runtimeVariant : "NativeAOT"
                        testFilter: $(CATEGORYGROUP)
                        headless: ${{ parameters.headless }}
                        skipProvisioning: ${{ parameters.skipProvisioning }}

- ${{ if and(containsValue(parameters.selectedPlatforms, 'windows'), or(eq(length(parameters.selectedCategories), 0), ne(replace(replace(join('', parameters.selectedCategories), 'Material3', ''), 'WebView', ''), ''))) }}:
  - stage: winui_ui_tests
    displayName: WinUI UITests
    dependsOn: build_ui_tests_windows
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.winui, '') }}:
              - job: winui_ui_tests_${{ project.name }}
                strategy:
                  matrix:
                    # WebView is excluded on Windows: Appium driver cannot attach to WebView2
                    # (appium/appium#22217 / dotnet/maui#35334). Remove this filter once fixed.
                    ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                      ${{ if eq(length(parameters.selectedCategories), 0) }}:
                        ${{ if ne(categoryGroup, 'WebView') }}:
                          ${{ categoryGroup }}:
                            CATEGORYGROUP: ${{ categoryGroup }}
                      ${{ else }}:
                        ${{ each category in split(categoryGroup, ',') }}:
                          ${{ if and(ne(category, 'WebView'), or(containsValue(parameters.selectedCategories, category), and(startsWith(category, 'CollectionView'), containsValue(parameters.selectedCategories, 'CollectionView')), and(startsWith(category, 'Shell'), containsValue(parameters.selectedCategories, 'Shell')))) }}:
                            ${{ category }}:
                              CATEGORYGROUP: ${{ category }}
                timeoutInMinutes: ${{ parameters.timeoutInMinutes }} # how long to run the job before automatically cancelling
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }}
                pool: ${{ parameters.windowsPool }}
                variables:
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)\.appium\
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: windows
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      version: "10.0.19041.0"
                      device: windows10
                      path: ${{ project.winui }}
                      app: ${{ project.app }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      runtimeVariant: "CoreCLR"
                      testFilter: $(CATEGORYGROUP)
                      skipProvisioning: ${{ parameters.skipProvisioning }}
                  
                  # Collect and publish Windows snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'Windows'
                      artifactName: 'uitest-snapshot-results-windows-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'

  # Windows CV1 UI Tests - Run the same CollectionView shards with UseWindowsCollectionView2Handler=false
- ${{ if and(containsValue(parameters.selectedPlatforms, 'windows'), or(eq(length(parameters.selectedCategories), 0), contains(join(',', parameters.selectedCategories), 'CollectionView'))) }}:
  - stage: winui_ui_tests_cv1
    displayName: WinUI UITests CV1
    dependsOn: build_ui_tests_windows_cv1
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.winui, '') }}:
              - job: CV1_winui_ui_tests_${{ project.name }}
                strategy:
                  matrix:
                    ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                      ${{ if startsWith(categoryGroup, 'CollectionView') }}:
                        ${{ if or(eq(length(parameters.selectedCategories), 0), containsValue(parameters.selectedCategories, 'CollectionView'), containsValue(parameters.selectedCategories, categoryGroup)) }}:
                          ${{ categoryGroup }}:
                            CATEGORYGROUP: ${{ categoryGroup }}
                timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }} (CV1)
                pool: ${{ parameters.windowsPool }}
                variables:
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)\.appium\
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: windows
                      version: "10.0.19041.0"
                      device: windows10
                      path: ${{ project.winui }}
                      app: ${{ project.app }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      runtimeVariant: "CoreCLR"
                      useWindowsCV1: true
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      testFilter: $(CATEGORYGROUP)
                      testConfigurationArgs: "UseWindowsCV1:true"
                      skipProvisioning: ${{ parameters.skipProvisioning }}

                  # Collect and publish Windows CV1 snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'Windows CV1'
                      artifactName: 'uitest-snapshot-results-windows-cv1-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'
- ${{ if and(containsValue(parameters.selectedPlatforms, 'catalyst'), or(eq(length(parameters.selectedCategories), 0), ne(join('', parameters.selectedCategories), 'Material3'))) }}:
  - stage: maccatalyst_ui_tests_coreclr
    displayName: MacCatalyst UITests CoreCLR
    dependsOn: build_ui_tests_coreclr
    jobs:
      - ${{ each project in parameters.projects }}:
        - ${{ if ne(project.mac, '') }}:
              - job: maccatalyst_ui_tests_coreclr_${{ project.name }}
                strategy:
                  matrix:
                    ${{ each categoryGroup in parameters.categoryGroupsToTest }}:
                      ${{ if eq(length(parameters.selectedCategories), 0) }}:
                        ${{ categoryGroup }}:
                          CATEGORYGROUP: ${{ categoryGroup }}
                      ${{ else }}:
                        ${{ each category in split(categoryGroup, ',') }}:
                          ${{ if or(containsValue(parameters.selectedCategories, category), and(startsWith(category, 'CollectionView'), containsValue(parameters.selectedCategories, 'CollectionView')), and(startsWith(category, 'Shell'), containsValue(parameters.selectedCategories, 'Shell'))) }}:
                            ${{ category }}:
                              CATEGORYGROUP: ${{ category }}
                timeoutInMinutes: ${{ parameters.timeoutInMinutes }} # how long to run the job before automatically cancelling
                workspace:
                  clean: all
                displayName: ${{ coalesce(project.desc, project.name) }}
                pool: ${{ parameters.macosPool }}
                variables:
                  REQUIRED_XCODE: $(DEVICETESTS_REQUIRED_XCODE)
                  APPIUM_HOME: $(System.DefaultWorkingDirectory)/.appium/
                steps:
                  - template: ui-tests-steps.yml
                    parameters:
                      platform: catalyst
                      requireExecutedTests: ${{ or(parameters.selectedRun, gt(length(parameters.selectedCategories), 0), ne(length(parameters.selectedPlatforms), 4)) }}
                      version: "15.3"
                      device: mac
                      path: ${{ project.mac }}
                      app: ${{ project.app }}
                      provisionatorChannel: ${{ parameters.provisionatorChannel }}
                      runtimeVariant : "CoreCLR"
                      testFilter: $(CATEGORYGROUP)
                      skipProvisioning: ${{ parameters.skipProvisioning }}
                  
                  # Collect and publish MacCatalyst snapshot diffs
                  - template: ui-tests-collect-snapshot-diffs.yml
                    parameters:
                      platform: 'MacCatalyst'
                      artifactName: 'uitest-snapshot-results-maccatalyst-$(System.StageName)-$(System.JobName)-$(System.JobAttempt)'
