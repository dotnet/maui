  - name: standard-report-keeps-evidence-and-coverage
    tags: { kind: presentation }
    prompt: |
      Use the review-test-failures skill on this synthetic frozen bundle
      and return only its standard report. Dry run is true: do not post,
      fetch, execute code, or write files.
      Synthetic PR #99999 targets main, author fixture-ci-author,
      head 1111111111111111111111111111111111111111, base 2222222;
      collection time 2026-09-17T18:00:00Z.
      All listed builds are verified against head. There were no retries
      or recovered attempts. Target-branch history was not supplied.
      Complete diff: in DispatchUpdate, replace "_dispatcher.Dispatch(callback);"
      with "callback();". The supplied call path shows a worker invokes
      DispatchUpdate and callback mutates a native Android view; the change
      removes the only UI-thread dispatch.
      Source: https://github.com/dotnet/maui/blob/1111111/src/Core/src/Handlers/View/ViewHandler.cs#L10-L14
      maui-pr has complete passing results:
      https://dev.azure.com/dnceng-public/public/_build/results?buildId=999901
      maui-pr-devicetests is green, but all result files are unreadable:
      https://dev.azure.com/dnceng-public/public/_build/results?buildId=999902
      maui-pr-uitests has one ButtonUpdate Android failure. Its stack names
      DispatchUpdate and callback; the exception says only the thread which
      created a view hierarchy can touch its views. Full UI outcomes/logs
      are read, with no other failures:
      https://dev.azure.com/dnceng-public/public/_build/results?buildId=999903
      failureUrl: https://dev.azure.com/dnceng-public/public/_build/results?buildId=999903&view=ms.vss-test-web.build-test-results-tab&runId=12&resultId=34
      Comparable pre-PR main build at 2222222 executed ButtonUpdate on the
      same Android runtime/device and passed while retaining the dispatch:
      https://dev.azure.com/dnceng-public/public/_build/results?buildId=999900
      No contrary evidence exists. Keep the unverified device results visible.
    graders:
      - type: skill-invocation
        config: { required: [review-test-failures] }
      - type: output-matches
        config:
          pattern: '(?i)^(?![\s\S]*(?:verdict|inconclusive| Summary</strong>))[\s\S]*$'
      - type: output-matches
        config:
          pattern: '<summary><strong>[^<]* maui-pr</strong></summary>[\s\S]*<summary><strong>[^<]* maui-pr-devicetests</strong></summary>[\s\S]*<summary><strong>[^<]* maui-pr-uitests</strong></summary>'
      - type: output-matches
        config:
          pattern: '(?:&#x1F534;|🔴)\s+\*\*Likely PR-caused\*\*'
      - type: output-matches
        config:
          pattern: 'Insufficient data'
      - type: output-matches
        config:
          pattern: 'https://github\.com/dotnet/maui/blob/1111111/src/Core/src/Handlers/View/ViewHandler\.cs#L10-L14'
      - type: output-matches
        config:
          pattern: 'https://dev\.azure\.com/dnceng-public/public/_build/results\?buildId=999903&view=ms.vss-test-web.build-test-results-tab&runId=12&resultId=34'
      - type: output-matches
        config:
          pattern: '^(?![\s\S]*refs/pull/99999/merge)[\s\S]*$'
      - type: output-matches
        config:
          pattern: '^<!-- Tests Failure -->\s+## Tests Failure Analysis\s+> @fixture-ci-author (?:&#x2014;|\u2014) test-failure analysis for commit \[`1111111`\]\(https://github\.com/dotnet/maui/commit/1111111111111111111111111111111111111111\)'
      - type: output-matches
        config:
          pattern: '(?s)\A.{1,3500}\z'
      - type: output-matches
        config:
          pattern: '/azp run maui-pr-devicetests'
      - type: output-matches
        config:
          pattern: '> Maintainers: comment `/review tests` to refresh this report\.\s*</details>\s*$'
      - type: output-matches
        config:
          pattern: '<img alt="Scope CI failures" src="https://img\.shields\.io/badge/Scope-CI%20failures-1f6feb\?labelColor=30363d(?:&amp;|&)style=flat-square">[\s\S]*<img alt="Commit 1111111" src="https://img\.shields\.io/badge/Commit-1111111-1f6feb\?labelColor=30363d(?:&amp;|&)style=flat-square">'
      - type: output-matches
        config:
          pattern: '<details>\s*<summary><strong>[^<]* CI Analysis</strong>[^<]*</summary>[\s\S]*</details>\s*</details>\s*---\s*<details>\s*<summary><strong>[^<]* Follow-up</strong>[^<]*</summary>[\s\S]*</details>\s*$'
      - type: output-matches
        config:
          pattern: '^(?![\s\S]*(?:<details\s+open|Recovered attempts|Ready to merge|Not ready|Pipeline coverage|Target-branch comparison|Coverage and limitations))[\s\S]*$'

