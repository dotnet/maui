          pattern: '> Maintainers: comment `/review tests` to refresh this report\.\s*</details>\s*$'
      - type: output-matches
        config:
          pattern: '</details>\s*</details>\s*---\s*<details>\s*<summary><strong>[^<]* Follow-up</strong>[^<]*</summary>[\s\S]*</details>\s*$'
      - type: output-matches
        config:
          pattern: '/azp run maui-pr-devicetests'
      - type: output-matches
        config:
          pattern: '^(?![\s\S]*(?:<details\s+open|Ready to merge|Not ready|ButtonUpdate|fixture-ci-author))[\s\S]*$'

