# Pester regression gate for `.github/scripts/**` and release-critical helpers.
#
# Why this exists: repository automation ships Pester suites for transport
# gating, release publishing, safe-output expectation reconciliation, milestone
# drift, and review triggers. A regression in that logic should be caught before
# the workflow that consumes it runs in production.
#
# Security model:
#   - `pull_request` (NOT `pull_request_target`): this job EXECUTES PowerShell
#     authored by the PR, so it must never run with base-repo secrets or a
#     writable token. Fork PRs get a read-only `GITHUB_TOKEN` and no secrets.
#   - `permissions: contents: read` — the suite needs nothing else.
#   - The suite is hermetic: every test stubs `gh`/network access and builds its
#     own temp Git repositories, so no token or live API access is required.
name: PowerShell Script Tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'eng/pipelines/ci-official-release.yml'
      - 'eng/pipelines/ci-official-release.Tests.ps1'
      - 'eng/scripts/nuget_release_packages.ps1'
      - 'eng/scripts/nuget_release_packages.Tests.ps1'
      - 'eng/pipelines/common/non-workload-publish.yml'
      - '.github/workflows/powershell-script-tests.yml'
  workflow_dispatch:

concurrency:
  group: powershell-script-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pester:
    name: Pester scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned so a new Pester release cannot change discovery/assertion
      # behavior underneath the suite without an explicit bump here.
      - name: Install Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.0
          "Pester $((Get-Module Pester).Version)"

      # Deliberately NO `Set-StrictMode` here. StrictMode set in the host session
      # leaks into every test body Pester dot-sources, and 16 tests in this suite
      # legitimately read not-yet-assigned members. Enabling it turns a green
      # suite red for reasons unrelated to the code under test.
      - name: Run Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.9.0

          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.github/scripts'
            'eng/pipelines/ci-official-release.Tests.ps1'
            'eng/scripts/nuget_release_packages.Tests.ps1'
          )
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $config

          "::notice::Pester total=$($result.TotalCount) passed=$($result.PassedCount) failed=$($result.FailedCount) skipped=$($result.SkippedCount)"

          if ($result.FailedCount -gt 0) {
            foreach ($test in $result.Failed) {
              "::error::Failed: $($test.ExpandedPath)"
            }
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }

          if ($result.TotalCount -lt 1) {
            throw 'Pester discovered no script tests; the gate would pass vacuously.'
          }

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results
          path: pester-results.xml
          if-no-files-found: warn
