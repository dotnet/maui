# ═══════════════════════════════════════════════════════════════════════════════════
# POWERSHELL SCRIPT TESTS
#
# Runs the Pester suites under `.github/scripts` at PR time.
#
# WHY THIS EXISTS
#   `.github/scripts` holds 16 Pester suites and, before this workflow, NOTHING ran any
#   of them. `maui-pr` is path-filtered and skips entirely for `.github/**`-only changes,
#   so a suite could stop compiling — or start failing — and every check would still be
#   green. A reviewer of PR #36850 called this out directly: automation that decides
#   whether to CLOSE tracking issues cannot be defended by a test suite nobody runs.
#
# WHY EACH SUITE RUNS IN ITS OWN PROCESS
#   This is load-bearing, not stylistic. Pester dot-sources every test file into ONE
#   session, so same-named helpers across suites overwrite each other and `Mock` targets
#   bind to whichever definition loaded last. Running the whole directory in a single
#   Pester invocation currently produces 12 failures that do NOT reproduce when the same
#   files are run individually — pure cross-file contamination, including two suites
#   that each define their own `Invoke-GhWrite`. One process per file is what makes the
#   result trustworthy and independent of file ordering.
#
# ANTI-VACUOUS BY CONSTRUCTION
#   A file that fails to PARSE reports zero tests and zero failures, which is
#   indistinguishable from a pass if you only check `FailedCount`. This job therefore
#   parses every script first and treats "a suite ran zero tests" as a failure.
#
# PERMISSIONS
#   `contents: read` and nothing else. The suites are offline — no `GH_TOKEN` is
#   exported, so `gh` inside them is unauthenticated — and `persist-credentials: false`
#   keeps the checkout token out of `.git/config`.
# ═══════════════════════════════════════════════════════════════════════════════════
name: powershell-script-tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/powershell-script-tests.yml'
  push:
    branches:
      - main
      - net11.0
    paths:
      - '.github/scripts/**'
      - '.github/workflows/powershell-script-tests.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: powershell-script-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester (.github/scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse all scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem ./.github/scripts -Filter *.ps1 -Recurse | Sort-Object FullName) {
            $errs = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs.Count -gt 0) {
              $bad++
              foreach ($e in $errs) {
                Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            }
          }
          if ($bad -gt 0) { throw "$bad script(s) failed to parse." }
          Write-Output "All scripts parsed cleanly."

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run suites
        shell: pwsh
        run: |
          # NOTE: no `Set-StrictMode` here. Pester dot-sources each test file into the
          # child session, so strictness set by the host leaks into every test body and
          # fails tests that pass everywhere else.
          $ErrorActionPreference = 'Stop'

          # Quarantine hook: suites whose failures already exist on `main` and are out of
          # scope for the change at hand. EMPTY, and it should stay that way — it exists
          # so a future maintainer can land an unrelated fix without either turning this
          # job red or deleting the mechanism.
          #
          # It is deliberately empty even though `Fix-MilestoneDrift.Tests.ps1` fails 10
          # of 212 when run under Pester 6.x: it is 212/212 under the 5.9.0 pinned below,
          # so those failures are a Pester-6 incompatibility in the SUITE, not a defect in
          # the script, and they cannot reach this job. That is also why the version here
          # is pinned rather than floating.
          $quarantine = @()

          $files = Get-ChildItem ./.github/scripts -Filter *.Tests.ps1 -Recurse | Sort-Object Name
          if ($files.Count -eq 0) { throw 'No *.Tests.ps1 files found; the discovery glob is wrong.' }

          $failed = @()
          $totalTests = 0

          foreach ($f in $files) {
            # One child process per suite. See the header: shared-session dot-sourcing
            # makes combined runs order-dependent and false-red.
            #
            # The child command is assembled from single-quoted fragments so the PARENT
            # expands none of it, and the suite path travels in an environment variable
            # rather than being interpolated into the command text — no quoting or
            # escaping of file paths, and nothing here is a string-injection site.
            # (A here-string would be the natural way to write this and cannot be used:
            # its terminator must sit at column 0, which breaks the YAML block scalar.)
            $child = @(
              'Import-Module Pester -RequiredVersion 5.9.0'
              '$c = New-PesterConfiguration'
              '$c.Run.Path = $env:SUITE_PATH'
              '$c.Run.PassThru = $true'
              '$c.Output.Verbosity = ''None'''
              '$r = Invoke-Pester -Configuration $c'
              '[pscustomobject]@{ Total = $r.TotalCount; Passed = $r.PassedCount; Failed = $r.FailedCount; Names = @($r.Failed | ForEach-Object { $_.ExpandedPath }) } | ConvertTo-Json -Depth 4 -Compress'
            ) -join '; '

            $env:SUITE_PATH = $f.FullName
            $json = pwsh -NoProfile -NonInteractive -Command $child | Select-Object -Last 1

            $isQuarantined = $quarantine -contains $f.Name

            $res = $null
            if (-not [string]::IsNullOrWhiteSpace($json)) {
              try { $res = $json | ConvertFrom-Json } catch { $res = $null }
            }

            if ($null -eq $res) {
              # The child produced no parseable summary: it crashed, or discovery threw.
              # Never treat that as a pass.
              if ($isQuarantined) {
                Write-Output "::warning::[quarantined] $($f.Name) produced no result."
              } else {
                Write-Output "::error::$($f.Name) produced no result (crash or discovery failure)."
                $failed += $f.Name
              }
              continue
            }

            $totalTests += [int]$res.Total
            $line = "$($f.Name): total=$($res.Total) passed=$($res.Passed) failed=$($res.Failed)"

            if ($isQuarantined) {
              Write-Output "::warning::[quarantined, pre-existing on main] $line"
              continue
            }

            if ([int]$res.Total -eq 0) {
              Write-Output "::error::$($f.Name) ran ZERO tests; the suite did not load."
              $failed += $f.Name
              continue
            }

            if ([int]$res.Failed -gt 0) {
              foreach ($n in @($res.Names)) { Write-Output "::error::$($f.Name): $n" }
              $failed += $f.Name
              continue
            }

            Write-Output $line
          }

          Write-Output "Suites: $($files.Count) · tests executed: $totalTests"
          if ($failed.Count -gt 0) {
            throw "$($failed.Count) suite(s) failed: $($failed -join ', ')"
          }
