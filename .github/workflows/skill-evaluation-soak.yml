name: Live Skill Evaluation Soak

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: "Trials per live stimulus"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "3"

concurrency:
  group: live-skill-evaluation-soak
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALLY_VERSION: "0.14.0"
  NODE_VERSION: "22"

jobs:
  code-review:
    name: code-review live soak (advisory)
    if: github.repository == 'dotnet/maui'
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    timeout-minutes: 90
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup credential-isolated Vally runtime
        id: vally-runtime
        run: >-
          .github/scripts/SetupVallyRuntime.sh
          "$RUNNER_TEMP/vally"
          "$VALLY_VERSION"
          "$GITHUB_OUTPUT"

      - name: Validate live soak spec
        run: >-
          "${{ steps.vally-runtime.outputs.vally_bin }}" lint
          --eval-spec .github/skills/code-review/tests/soak.capability.vally.yaml
          --strict

      - name: Select Copilot token
        id: select-token
        env:
          COPILOT_PAT_0: ${{ secrets.COPILOT_PAT_0 }}
          COPILOT_PAT_1: ${{ secrets.COPILOT_PAT_1 }}
          COPILOT_PAT_2: ${{ secrets.COPILOT_PAT_2 }}
          COPILOT_PAT_3: ${{ secrets.COPILOT_PAT_3 }}
          COPILOT_PAT_4: ${{ secrets.COPILOT_PAT_4 }}
          COPILOT_PAT_5: ${{ secrets.COPILOT_PAT_5 }}
          COPILOT_PAT_6: ${{ secrets.COPILOT_PAT_6 }}
          COPILOT_PAT_7: ${{ secrets.COPILOT_PAT_7 }}
          COPILOT_PAT_8: ${{ secrets.COPILOT_PAT_8 }}
          COPILOT_PAT_9: ${{ secrets.COPILOT_PAT_9 }}
        run: |
          set -euo pipefail
          .github/scripts/SelectVallyToken.sh \
            "$GITHUB_OUTPUT" \
            "${{ steps.vally-runtime.outputs.vally_runner }}" \
            "${{ steps.vally-runtime.outputs.copilot_wrapper }}" \
            "${{ steps.vally-runtime.outputs.copilot_runtime }}" \
            "${{ steps.vally-runtime.outputs.copilot_home }}" \
            "$RUNNER_TEMP/model-probe" \
            gpt-5.6-sol \
            claude-opus-5

      - name: Run live soak
        id: soak
        env:
          COPILOT_GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          COPILOT_CLI_PATH: ${{ steps.vally-runtime.outputs.copilot_wrapper }}
          TRUSTED_COPILOT_CLI_PATH: ${{ steps.vally-runtime.outputs.copilot_runtime }}
          TRUSTED_COPILOT_HOME: ${{ steps.vally-runtime.outputs.copilot_home }}
          VALLY_BIN: ${{ steps.vally-runtime.outputs.vally_bin }}
          VALLY_RUNNER: ${{ steps.vally-runtime.outputs.vally_runner }}
          RESULTS_PATH: ${{ steps.vally-runtime.outputs.results_root }}/live-soak-results
          # Live public-PR retrieval is anonymous by design. Do not give the
          # Copilot process a GitHub API token.
          RUNS: ${{ github.event.inputs.runs || '1' }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_PATH"
          chmod 2770 "$RESULTS_PATH"

          set +e
          "$VALLY_RUNNER" "$VALLY_BIN" eval \
            -e .github/skills/code-review/tests/soak.capability.vally.yaml \
            --executor copilot-sdk \
            --skill-dir .github/skills \
            --output-dir "$RESULTS_PATH" \
            --junit \
            --runs "$RUNS" \
            --workers 3 \
            --verbose
          rc=$?
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$RESULTS_PATH/eval-exit-code.txt"

          junit=$(find "$RESULTS_PATH" -name eval-results.junit.xml -type f | head -1 || true)
          {
            echo "## Code-review live soak"
            echo
            echo "This evaluation is advisory. Live GitHub state, network latency, and nested-agent runtime must not block pull requests."
            echo
            echo "- Vally exit code: \`$rc\`"
            echo "- Trials per stimulus: \`$RUNS\`"
            if [ -n "$junit" ]; then
              score=$(sed -nE 's/.*name="overallScore" value="([^"]+)".*/\1/p' "$junit" | head -1)
              passed=$(sed -nE 's/.*name="passed" value="([^"]+)".*/\1/p' "$junit" | head -1)
              root=$(grep -m1 '<testsuites' "$junit" || true)
              failures=$(printf '%s' "$root" | sed -nE 's/.*failures="([0-9]+)".*/\1/p')
              errors=$(printf '%s' "$root" | sed -nE 's/.*errors="([0-9]+)".*/\1/p')
              echo "- Suite score: \`${score:-unavailable}\`"
              echo "- Suite verdict: \`${passed:-unavailable}\`"
              echo "- Trial failures/errors: \`${failures:-0}/${errors:-0}\`"
            else
              echo "::warning::Live soak produced no JUnit report under $RESULTS_PATH"
              echo "- Suite result: \`incomplete (no JUnit report)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Advisory by design: retain the real Vally exit code in artifacts and
          # the summary, but do not turn live-service variance into a PR gate.
          exit 0

      - name: Upload live soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-live-soak-results
          path: ${{ steps.vally-runtime.outputs.results_root }}/live-soak-results/
          include-hidden-files: true
          retention-days: 30
