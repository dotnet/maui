name: Resolve PR Conflicts

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose conflicts should be resolved
        required: true
        type: number

permissions: {}

concurrency:
  group: resolve-conflicts-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'dotnet/maui' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/resolve')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorized: ${{ steps.context.outputs.authorized }}
      eligible: ${{ steps.context.outputs.eligible }}
      context: ${{ steps.context.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Match command, authorize requester, and pin both branches
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve_conflicts.py prepare --root "$RUNNER_TEMP/conflicts"
      - name: Hide authorized command
        if: steps.context.outputs.authorized == 'true' && github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.graphql(
                'mutation($id:ID!){minimizeComment(input:{subjectId:$id,classifier:RESOLVED}){minimizedComment{isMinimized}}}',
                {id: context.payload.comment.node_id});
            } catch (error) {
              core.warning(`Could not hide the authorized command: ${error.message}`);
            }

  resolve:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      state: ${{ steps.resolve.outputs.state }}
      candidate: ${{ steps.resolve.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Copilot CLI
        working-directory: ${{ runner.temp }}
        run: npm install --global @github/copilot@1.0.84
      - name: Resolve with the trusted skill and GPT-6 Astra
        id: resolve
        env:
          CONFLICT_CONTEXT: ${{ needs.authorize.outputs.context }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT_0 || secrets.COPILOT_PAT_1 || secrets.COPILOT_PAT_2 || secrets.COPILOT_PAT_3 || secrets.COPILOT_PAT_4 || secrets.COPILOT_PAT_5 || secrets.COPILOT_PAT_6 || secrets.COPILOT_PAT_7 || secrets.COPILOT_PAT_8 || secrets.COPILOT_PAT_9 }}
        run: python3 .github/scripts/resolve_conflicts.py solve --root "$RUNNER_TEMP/conflicts"
      - name: Upload resolution data only
        if: steps.resolve.outputs.state == 'resolved'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conflict-resolution
          path: ${{ runner.temp }}/conflicts/artifact/resolution.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [authorize, resolve]
    if: needs.resolve.outputs.state == 'resolved'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: conflict-resolution
          path: ${{ runner.temp }}/conflicts/artifact
      # Bootstrap only. The Cake target installs the exact repository SDK and
      # workload versions through src/DotNet/DotNet.csproj before compilation.
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: microsoft
          java-version: '17'
      - name: Reconstruct and build the exact candidate without credentials
        shell: pwsh
        env:
          CONFLICT_CONTEXT: ${{ needs.authorize.outputs.context }}
          EXPECTED_CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          python .github/scripts/resolve_conflicts.py build --root "$env:RUNNER_TEMP/conflicts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conflict-build-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/conflicts/build.log
            ${{ runner.temp }}/conflicts/build/artifacts/log/**/*.binlog
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [authorize, resolve, build]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # This is a fresh hosted runner. Never execute a file from the PR or from
      # the agent artifact in this credentialed job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        if: needs.resolve.outputs.state == 'resolved' && needs.build.result == 'success'
        with:
          name: conflict-resolution
          path: ${{ runner.temp }}/conflicts/artifact
      - name: Publish only after both builds pass, then post the expandable report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Reuse the existing gh-aw publication credential convention.
          # Inference PATs are never reused as repository-write credentials.
          PUSH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          CONFLICT_CONTEXT: ${{ needs.authorize.outputs.context }}
          RESOLVE_STATE: ${{ needs.resolve.outputs.state }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXPECTED_CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: python3 .github/scripts/resolve_conflicts.py publish --root "$RUNNER_TEMP/conflicts"
