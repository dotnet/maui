name: Add Dogfooding Comment

on:
  # Use pull_request_target to run in the context of the base branch
  # This allows commenting on PRs from forks
  # Note: check_run trigger doesn't work because Azure DevOps check runs
  # don't populate the pull_requests[] field, so we can't get the PR number.
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
      - 'net*'
      - 'release/**'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to add dogfooding comment to'
        required: true
        type: number

# Ensure only one instance runs at a time per PR to prevent duplicate comments
concurrency:
  group: dogfood-comment-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  add-dogfood-comment:
    # Only run on the dotnet org to avoid running on forks
    if: ${{ github.repository_owner == 'dotnet' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add dogfooding comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            // Get PR number from either the PR event or manual input
            const prNumber = context.payload.pull_request?.number || context.payload.inputs?.pr_number;

            const bashScript = 'https://raw.githubusercontent.com/dotnet/maui/main/eng/scripts/get-maui-pr.sh';
            const psScript = 'https://raw.githubusercontent.com/dotnet/maui/main/eng/scripts/get-maui-pr.ps1';
            
            // Unique marker to identify dogfooding comments
            const dogfoodMarker = '<!-- dogfood-pr -->';
            
            const comment = `${dogfoodMarker}
            🚀 **Dogfood this PR with:**

            > **⚠️ WARNING: Do not do this without first carefully reviewing the code of this PR to satisfy yourself it is safe.**

            \`\`\`bash
            curl -fsSL ${bashScript} | bash -s -- ${prNumber}
            \`\`\`

            Or

            - Run remotely in PowerShell:

            \`\`\`powershell
            iex "& { $(irm ${psScript}) } ${prNumber}"
            \`\`\``;

            // Check for existing dogfooding comment
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingComment = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.trimStart().startsWith(dogfoodMarker)
            );

            let postedComment;
            if (existingComment) {
              // Update existing comment
              const response = await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              postedComment = response.data;
            } else {
              // Create new comment
              const response = await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              postedComment = response.data;
            }

            const { node } = await github.graphql(
              `query($id: ID!) {
                node(id: $id) { __typename ... on IssueComment { isMinimized } }
              }`,
              { id: postedComment.node_id }
            );
            if (node?.__typename !== 'IssueComment') {
              throw new Error(`Could not find dogfooding comment ${postedComment.id}.`);
            }
            if (!node.isMinimized) {
              const { minimizeComment } = await github.graphql(
                `mutation($id: ID!) {
                  minimizeComment(input: { subjectId: $id, classifier: RESOLVED }) {
                    minimizedComment { isMinimized }
                  }
                }`,
                { id: postedComment.node_id }
              );
              if (!minimizeComment?.minimizedComment?.isMinimized) {
                throw new Error(`Could not minimize dogfooding comment ${postedComment.id}.`);
              }
              core.info(`Minimized dogfooding comment ${postedComment.id} as resolved.`);
            }
