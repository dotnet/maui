name: Azure Pipelines Comment Cleanup

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  minimize:
    if: >-
      github.repository == 'dotnet/maui' &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/azp') ||
       github.event.comment.user.login == 'azure-pipelines[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Minimize Azure Pipelines commands and success acknowledgments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            // Re-read edits so a delayed event cannot hide a newer discussion.
            const { data: comment } = await github.rest.issues.getComment({
              owner, repo, comment_id: context.payload.comment.id
            });
            const body = comment.body.trim();
            const isCommand = /^\/azp[ \t]+run(?:[ \t]+[^\r\n]+)?$/i.test(body);
            const isSuccess = comment.user.login === 'azure-pipelines[bot]' &&
              comment.user.type === 'Bot' &&
              /^(?:<!-- AzurePipelinesStatusComment -->\s*)?<samp>\s*Azure Pipelines:<br>\s*Successfully started running [1-9][0-9]* pipeline\(s\)\.<br>\s*<\/samp>$/.test(body);
            if (!isCommand && !isSuccess) {
              core.info('Leaving discussion, warnings, and unsuccessful pipeline responses visible.');
              return;
            }
            await github.graphql(
              `mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: RESOLVED }) {
                  minimizedComment { isMinimized }
                }
              }`,
              { id: comment.node_id }
            );
            core.info(`Minimized Azure Pipelines comment ${comment.id} as resolved.`);
