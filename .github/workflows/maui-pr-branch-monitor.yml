name: maui-pr branch monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview issue changes without publishing them'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: maui-pr-branch-monitor
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'dotnet/maui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.tests.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run monitor regression tests
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.0
          $result = Invoke-Pester ./.github/scripts/Watch-MauiPrBranches.Tests.ps1 -PassThru -Output Detailed
          if ($result.TotalCount -eq 0 -or $result.FailedCount -gt 0 -or
              $result.Containers.Count -ne 1 -or @($result.Containers | Where-Object { -not $_.Passed }).Count -gt 0) {
            throw 'Branch monitor regression tests failed or did not load.'
          }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the tested commit.' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT

  monitor:
    needs: test
    if: github.repository == 'dotnet/maui' && vars.MAUI_PR_BRANCH_MONITOR_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.source_sha }}
          persist-credentials: false
      - name: Check maui-pr branch builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_APPLY: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          ./.github/scripts/Watch-MauiPrBranches.ps1 -Apply:($env:MONITOR_APPLY -ceq 'true')
