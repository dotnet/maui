name: Prepare signed release publication

on:
  workflow_run:
    workflows: ['Release tracking PRs']
    types: [completed]
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
  create:
  pull_request_target:
    types: [closed]
    branches: ['release/*']

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'dotnet/maui' &&
      (github.event_name != 'create' ||
       (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))) &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == 'dotnet/maui' &&
        startsWith(github.event.pull_request.head.ref, 'automation/servicing/'))) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'dotnet/maui'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Wait for a verified manual release cut, then prepare exact signed publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZDO_TRIGGER_CLIENT_ID: ${{ secrets.AZDO_TRIGGER_CLIENT_ID }}
          AZDO_TRIGGER_TENANT_ID: ${{ secrets.AZDO_TRIGGER_TENANT_ID }}
        run: ./eng/scripts/Sync-ReleasePublishing.ps1 -OutputDirectory '${{ runner.temp }}/release-publishing'

      - name: Preserve publication preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publishing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-publishing/
          if-no-files-found: ignore
