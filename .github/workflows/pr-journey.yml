# Keeps a single "Where is this PR?" tracker comment on every pull request.
# See .github/docs/pr-journey.md.
#
# Security: this workflow never checks out or runs PR code. It checks out only
# .github/scripts/PrJourney.cjs from the trusted base or default branch and parses PR
# bodies and comments as data.

name: PR Journey

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to refresh (empty = refresh all open PRs that already have a tracker)'
        required: false

permissions: {}

concurrency:
  group: pr-journey-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.event_name }}
  cancel-in-progress: false

jobs:
  track:
    # Opt-in per repository: set the PR_JOURNEY_ENABLED variable to 'true'.
    # Fork PR reviews get a read-only token, so they are skipped here and picked up by the sweep.
    if: >-
      vars.PR_JOURNEY_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_review would default to the PR merge ref; always use trusted code.
          ref: ${{ github.event_name == 'pull_request_review' && github.event.repository.default_branch || '' }}
          persist-credentials: false
          sparse-checkout: .github/scripts/PrJourney.cjs
          sparse-checkout-cone-mode: false

      - name: Update tracker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_JOURNEY_BOT_LOGINS: ${{ vars.PR_JOURNEY_BOT_LOGINS }}
        with:
          script: |
            const { main } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/PrJourney.cjs`);
            await main({ github, core, context });
