    if: "needs.pre_activation.outputs.activated == 'true' && ((github.repository == 'dotnet/maui' && (github.event_name == 'issue_comment' ||\n (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0))) && ((github.event_name == 'issue_comment') && (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/ui-evidence ') || startsWith(github.event.comment.body, '/ui-evidence\n') || github.event.comment.body == '/ui-evidence') && github.event.issue.pull_request != null) || !(github.event_name == 'issue_comment')))"
