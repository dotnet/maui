        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs:
      - activation
      - pat_pool
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: uievidence
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "UI Evidence - dotnet/maui"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/ui-evidence.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Validate UI evidence analysis contracts
        run: pwsh -NoProfile -File .github/skills/ui-evidence/tests/UiEvidenceSkill.Tests.ps1
        shell: bash
      - continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id }}
        name: Precompute trusted UI evidence context
        run: "set -euo pipefail\n\nUI=/tmp/gh-aw/agent/ui-evidence\nTRUSTED=/tmp/gh-aw/trusted/ui-evidence\nSOURCE=/tmp/gh-aw/ui-evidence-source\n\nsudo rm -rf \"$UI\" \"$TRUSTED\" \"$SOURCE\"\nsudo mkdir -p \"$UI\" \"$TRUSTED/skill\" \"$TRUSTED/scripts\" \"$SOURCE\"\nsudo cp -a .github/skills/ui-evidence/. \"$TRUSTED/skill/\"\nsudo cp \\\n  eng/scripts/UiEvidence.Common.ps1 \\\n  eng/scripts/Select-UiEvidenceScenarios.ps1 \\\n  eng/scripts/New-UiEvidenceRequests.ps1 \\\n  eng/scripts/Validate-UiEvidenceBundle.ps1 \\\n  \"$TRUSTED/scripts/\"\nsudo cp eng/ui-evidence/scenarios.json \"$TRUSTED/scenarios.json\"\nsudo chown -R root:root \"$TRUSTED\"\nsudo find \"$TRUSTED\" -type d -exec chmod 0555 {} +\nsudo find \"$TRUSTED\" -type f -exec chmod 0444 {} +\nsudo chown -R \"$(id -u):$(id -g)\" \"$UI\" \"$SOURCE\"\nchmod 0700 \"$UI\" \"$SOURCE\"\n\nwrite_status() {\n  jq -n \\\n    --arg status \"$1\" \\\n    --arg detail \"${2:-}\" \\\n    '{status:$status,detail:$detail}' \\\n    > \"$UI/precompute-status.json\"\n}\n\nseal_selection() {\n  local selection_hash=\"\"\n  local requests_hash=\"\"\n  local pr_hash=\"\"\n  test ! -f \"$UI/selection.json\" ||\n    selection_hash=$(sha256sum \"$UI/selection.json\" | awk '{print $1}')\n  test ! -f \"$UI/requests.json\" ||\n    requests_hash=$(sha256sum \"$UI/requests.json\" | awk '{print $1}')\n  test ! -f \"$UI/pr-resolved.json\" ||\n    pr_hash=$(sha256sum \"$UI/pr-resolved.json\" | awk '{print $1}')\n  jq -n \\\n    --arg selectionSha256 \"$selection_hash\" \\\n    --arg requestsSha256 \"$requests_hash\" \\\n    --arg prSha256 \"$pr_hash\" \\\n    '{schemaVersion:1,sealed:true,selectionSha256:$selectionSha256,\n      requestsSha256:$requestsSha256,prSha256:$prSha256}' \\\n    > \"$UI/selection-seal.json\"\n  mkdir -p \"$UI/report-validation\"\n  cp \\\n    \"$TRUSTED/scripts/UiEvidence.Common.ps1\" \\\n    \"$TRUSTED/scripts/Validate-UiEvidenceBundle.ps1\" \\\n    \"$TRUSTED/skill/scripts/Build-UiEvidenceAgentSummary.ps1\" \\\n    \"$TRUSTED/skill/scripts/Validate-UiEvidenceReport.ps1\" \\\n    \"$TRUSTED/skill/references/report-policy.json\" \\\n    \"$UI/report-validation/\"\n  sudo chown -R root:root \"$UI\"\n  sudo find \"$UI\" -type d -exec chmod 0555 {} +\n  sudo find \"$UI\" -type f -exec chmod 0444 {} +\n}\n\nfinish() {\n  write_status \"$1\" \"${2:-}\"\n  if [ ! -f \"$UI/agent-summary.json\" ] &&\n     [ -f \"$UI/selection.json\" ] &&\n     [ -f \"$UI/pr-resolved.json\" ] &&\n     { [ \"$1\" = \"no-trusted-scenario\" ] || [ \"$1\" = \"selection-overflow\" ]; }; then\n    jq -n \\\n      --arg repository \"$GH_REPO\" \\\n      --argjson pr \"$PR_NUMBER\" \\\n      --arg base \"$(jq -r '.mergeBaseOid // \"\"' \"$UI/pr-resolved.json\")\" \\\n      --arg head \"$(jq -r .headRefOid \"$UI/pr-resolved.json\")\" \\\n      --arg harness \"$(jq -r '.harnessSha // \"\"' \"$UI/pr-resolved.json\")\" \\\n      --arg coverage \"$(jq -r '.coverage.status // \"partial\"' \"$UI/selection.json\")\" \\\n      --arg detail \"${2:-}\" \\\n      --argjson relevant \"$(jq '.coverage.uiRelevantFileCount // 0' \"$UI/selection.json\")\" \\\n      --argjson direct \"$(jq '.coverage.directFileCount // 0' \"$UI/selection.json\")\" \\\n      --argjson sampled \"$(jq '.coverage.sampledFileCount // 0' \"$UI/selection.json\")\" \\\n      --argjson unmapped \"$(jq '.coverage.unmappedFileCount // 0' \"$UI/selection.json\")\" \\\n      '{schemaVersion:1,repository:$repository,pullRequestNumber:$pr,\n        measuredBaseSha:$base,measuredHeadSha:$head,harnessSha:$harness,\n        overallVerdict:\"inconclusive\",\n        coverage:{status:$coverage,uiRelevantFileCount:$relevant,\n          directFileCount:$direct,sampledFileCount:$sampled,unmappedFileCount:$unmapped},\n        results:[],limitations:[$detail,\n          \"The result is advisory and is not a merge gate.\",\n          \"No trusted paired UI evidence was executed.\"]}' \\\n      > \"$UI/agent-summary.json\"\n  fi\n  seal_selection\n  exit 0\n}\n\nSOURCE_RUN_ID=\"${SOURCE_RUN_ID:-0}\"\nif [ -n \"$SOURCE_RUN_ID\" ] && [ \"$SOURCE_RUN_ID\" != \"0\" ]; then\n  if ! [[ \"$SOURCE_RUN_ID\" =~ ^[0-9]+$ ]]; then\n    finish \"followup-failed\" \"The source workflow run ID is invalid.\"\n  fi\n  if ! gh api \"repos/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}\" \\\n      > \"$SOURCE/run.json\" ||\n     [ \"$(jq -r .path \"$SOURCE/run.json\")\" != \".github/workflows/ui-evidence.lock.yml\" ]; then\n    finish \"followup-failed\" \"The source run is not a trusted UI evidence workflow run.\"\n  fi\n  if ! gh run download \"$SOURCE_RUN_ID\" -n ui-evidence-selection -D \"$SOURCE/selection\" ||\n     ! gh run download \"$SOURCE_RUN_ID\" -n ui-evidence-bundles -D \"$SOURCE/evidence\"; then\n    finish \"followup-failed\" \"Could not download the source run evidence.\"\n  fi\n  if [ ! -f \"$SOURCE/selection/selection-seal.json\" ] ||\n     [ ! -f \"$SOURCE/selection/pr-resolved.json\" ] ||\n     [ ! -f \"$SOURCE/selection/selection.json\" ] ||\n     [ ! -f \"$SOURCE/selection/requests.json\" ]; then\n    finish \"followup-failed\" \"The source run selection evidence is incomplete.\"\n  fi\n  if [ \"$(sha256sum \"$SOURCE/selection/selection.json\" | awk '{print $1}')\" != \\\n       \"$(jq -r .selectionSha256 \"$SOURCE/selection/selection-seal.json\")\" ] ||\n     [ \"$(sha256sum \"$SOURCE/selection/requests.json\" | awk '{print $1}')\" != \\\n       \"$(jq -r .requestsSha256 \"$SOURCE/selection/selection-seal.json\")\" ] ||\n     [ \"$(sha256sum \"$SOURCE/selection/pr-resolved.json\" | awk '{print $1}')\" != \\\n       \"$(jq -r .prSha256 \"$SOURCE/selection/selection-seal.json\")\" ]; then\n    finish \"followup-failed\" \"The source run selection hashes are invalid.\"\n  fi\n\n  SOURCE_PR=$(jq -r .number \"$SOURCE/selection/pr-resolved.json\")\n  SOURCE_HEAD=$(jq -r .headRefOid \"$SOURCE/selection/pr-resolved.json\")\n  if ! CURRENT_PR=$(gh pr view \"$PR_NUMBER\" --json number,state,baseRefName,headRefOid 2>/dev/null); then\n    finish \"followup-failed\" \"The current PR metadata could not be resolved.\"\n  fi\n  CURRENT_NUMBER=$(jq -r '.number // 0' <<<\"$CURRENT_PR\")\n  CURRENT_STATE=$(jq -r '.state // \"\"' <<<\"$CURRENT_PR\")\n  CURRENT_BASE=$(jq -r '.baseRefName // \"\"' <<<\"$CURRENT_PR\")\n  CURRENT_HEAD=$(jq -r '.headRefOid // \"\"' <<<\"$CURRENT_PR\")\n  if [ \"$SOURCE_PR\" != \"$CURRENT_NUMBER\" ] ||\n     [ \"$CURRENT_STATE\" != \"OPEN\" ] ||\n     [ \"$CURRENT_BASE\" != \"main\" ] ||\n     [ \"$SOURCE_HEAD\" != \"$CURRENT_HEAD\" ]; then\n    finish \"head-changed\" \"The PR changed before UI evidence could be interpreted.\"\n  fi\n\n  cp \"$SOURCE/selection/pr-resolved.json\" \"$UI/\"\n  cp \"$SOURCE/selection/selection.json\" \"$UI/\"\n  cp \"$SOURCE/selection/requests.json\" \"$UI/\"\n  while IFS= read -r request; do\n    key=$(jq -r .requestKey <<<\"$request\")\n    bundle=\"$SOURCE/evidence/bundles/$key\"\n    if [ -d \"$bundle\" ]; then\n      if ! pwsh -NoProfile \\\n        -File \"$TRUSTED/scripts/Validate-UiEvidenceBundle.ps1\" \\\n        -Root \"$bundle\" \\\n        -ExpectedRequestKey \"$key\" \\\n        -ExpectedHeadCommitSha \"$SOURCE_HEAD\" >/dev/null; then\n        finish \"followup-failed\" \"A sealed UI evidence bundle failed validation.\"\n      fi\n    fi\n  done < <(jq -c '.[]' \"$SOURCE/selection/requests.json\")\n\n  if ! pwsh -NoProfile \\\n    -File \"$TRUSTED/skill/scripts/Build-UiEvidenceAgentSummary.ps1\" \\\n    -SelectionPath \"$SOURCE/selection/selection.json\" \\\n    -BundlesRoot \"$SOURCE/evidence/bundles\" \\\n    -BuildManifestPath \"$SOURCE/evidence/builds.json\" \\\n    -OutputPath \"$UI/agent-summary.json\"; then\n    finish \"followup-failed\" \"The normalized UI evidence summary could not be created.\"\n  fi\n  finish \"ready-followup\" \"Validated UI evidence is ready for interpretation.\"\nfi\n\nif ! gh pr view \"$PR_NUMBER\" \\\n  --json number,state,baseRefName,headRefOid,url \\\n  > \"$UI/pr-resolved.json\"; then\n  finish \"metadata-failed\" \"Could not resolve the PR metadata.\"\nfi\nif [ \"$(jq -r .state \"$UI/pr-resolved.json\")\" != \"OPEN\" ]; then\n  finish \"not-open\" \"The target PR is not open.\"\nfi\nBASE_REF=$(jq -r .baseRefName \"$UI/pr-resolved.json\")\nHEAD_SHA=$(jq -r .headRefOid \"$UI/pr-resolved.json\")\nif [ \"$BASE_REF\" != \"main\" ]; then\n  finish \"unsupported-base\" \"The initial rollout supports only PRs targeting main.\"\nfi\nif ! git fetch --quiet --no-tags origin \"$BASE_REF\" \"pull/$PR_NUMBER/head\"; then\n  finish \"fetch-failed\" \"Could not fetch the pinned base/head commits.\"\nfi\nMERGE_BASE=$(git merge-base \"origin/$BASE_REF\" \"$HEAD_SHA\")\nHARNESS_SHA=$(git rev-parse HEAD)\njq --arg mergeBaseOid \"$MERGE_BASE\" --arg harnessSha \"$HARNESS_SHA\" \\\n  '. + {mergeBaseOid:$mergeBaseOid,harnessSha:$harnessSha}' \\\n  \"$UI/pr-resolved.json\" > \"$UI/pr-resolved.tmp.json\"\nmv \"$UI/pr-resolved.tmp.json\" \"$UI/pr-resolved.json\"\n\n: > \"$SOURCE/changed-files.txt\"\nwhile IFS= read -r -d '' path; do\n  if [[ \"$path\" == *$'\\n'* || \"$path\" == *$'\\r'* ]]; then\n    finish \"selection-failed\" \"A changed path contains unsupported control characters.\"\n  fi\n  printf '%s\\n' \"$path\" >> \"$SOURCE/changed-files.txt\"\ndone < <(git diff --name-only -z \"$MERGE_BASE\" \"$HEAD_SHA\")\n\nset +e\npwsh -NoProfile \\\n  -File \"$TRUSTED/scripts/Select-UiEvidenceScenarios.ps1\" \\\n  -ChangedFilesPath \"$SOURCE/changed-files.txt\" \\\n  -BaseCommitSha \"$MERGE_BASE\" \\\n  -HeadCommitSha \"$HEAD_SHA\" \\\n  -HarnessSha \"$HARNESS_SHA\" \\\n  -Repository \"$GH_REPO\" \\\n  -PullRequestNumber \"$PR_NUMBER\" \\\n  -RegistryPath \"$TRUSTED/scenarios.json\" \\\n  -OutputPath \"$UI/selection.json\"\nselection_exit=$?\nset -e\n\nif [ -f \"$UI/selection.json\" ]; then\n  jq 'del(.changedFiles)' \"$UI/selection.json\" > \"$UI/selection.safe.json\"\n  mv \"$UI/selection.safe.json\" \"$UI/selection.json\"\nfi\nselection_status=$(jq -r .selectionStatus \"$UI/selection.json\" 2>/dev/null || echo invalid)\nif [ \"$selection_exit\" -eq 3 ]; then\n  case \"$selection_status\" in\n    no-ui-relevant-changes)\n      finish \"no-ui-relevant-changes\" \"No UI-relevant product source changed.\"\n      ;;\n    no-trusted-scenario)\n      finish \"no-trusted-scenario\" \"UI-relevant files changed without a trusted scenario.\"\n      ;;\n    selection-overflow)\n      finish \"selection-overflow\" \"The trusted scenario selection exceeded the run limit.\"\n      ;;\n    *)\n      finish \"selection-failed\" \"Scenario selection did not produce a usable result.\"\n      ;;\n  esac\nfi\nif [ \"$selection_exit\" -ne 0 ]; then\n  finish \"selection-failed\" \"Scenario selection failed.\"\nfi\n\nif ! pwsh -NoProfile \\\n  -File \"$TRUSTED/scripts/New-UiEvidenceRequests.ps1\" \\\n  -SelectionPath \"$UI/selection.json\" \\\n  -OutputPath \"$UI/requests.json\"; then\n  finish \"selection-failed\" \"Trusted UI evidence requests could not be created.\"\nfi\njq --slurpfile requests \"$UI/requests.json\" \\\n  '.requests = $requests[0]' \\\n  \"$UI/selection.json\" > \"$UI/selection.safe.json\"\nmv \"$UI/selection.safe.json\" \"$UI/selection.json\"\nCURRENT_HEAD=$(gh pr view \"$PR_NUMBER\" --json headRefOid --jq .headRefOid 2>/dev/null || true)\nif [ \"$CURRENT_HEAD\" != \"$HEAD_SHA\" ]; then\n  finish \"head-changed\" \"The PR changed during selection; rerun /ui-evidence.\"\nfi\nfinish \"ready\" \"Trusted UI evidence requests are ready.\"\n"
        shell: bash
      - if: always()
        name: Upload trusted UI evidence selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (source v7)
        with:
          if-no-files-found: warn
          include-hidden-files: true
          name: ui-evidence-selection
          path: /tmp/gh-aw/agent/ui-evidence
          retention-days: 1

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/checkout_pr_branch.cjs');
            await main();
      - name: Install ripgrep
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_ripgrep.sh"
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh"
        env:
          GH_HOST: github.com
          GH_AW_COMPILED_VERSION: v0.86.2
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.27.44 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const determineAutomaticLockdown = require('${{ runner.temp }}/gh-aw/actions/determine_automatic_lockdown.cjs');
            await determineAutomaticLockdown(github, context, core);
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.27.44@sha256:0d727725c737b58c7bdf51f640cffb928385ec46517e0917c7f1a02f1bada8b4 ghcr.io/github/gh-aw-firewall/api-proxy:0.27.44@sha256:b50fbadba138f6e9aba94aca09711335c489bb3b15861220cb66f6092e042dc7 ghcr.io/github/gh-aw-firewall/squid:0.27.44@sha256:83e48bbe12c634be8c228a576832fe45f66c529ac3659db92bddbcf2eeb6d627 ghcr.io/github/gh-aw-mcpg:v0.4.9@sha256:e5a1569aeaf41820fa7bdee3e94468cae448133cdbf00119ad24f5b74db1ab9f ghcr.io/github/gh-aw-node@sha256:0d9f1fb5fd6610c0ac1f5194a38e45a8a1e81f8a390d5142d8e4e6f26a4b3196 ghcr.io/github/github-mcp-server:v1.9.0@sha256:881b53d6f75f69bdbc1b5b10fc2f1361717c19054143b3a8529fb5c32061a50e
      - name: Generate Safe Outputs Config
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
          cat > "${RUNNER_TEMP}/gh-aw/safeoutputs/config.json" << 'GH_AW_SAFE_OUTPUTS_CONFIG_3159a0aabb966d50_EOF'
          {"create_report_incomplete_issue":{},"missing_data":{},"missing_tool":{},"noop":{"max":1,"report-as-issue":"false"},"post-ui-evidence-report":{"description":"Post one validated UI evidence report if the PR still points at the measured head.","inputs":{"body":{"default":null,"description":"Complete Markdown UI evidence report.","required":true,"type":"string"}},"output":"UI evidence report posted."},"report_incomplete":{},"run-ui-evidence":{"description":"Queue and ingest all trusted UI evidence requests. Call exactly once on an initial ready run and never on a follow-up or dry-run.","inputs":{"expected_head_sha":{"default":null,"description":"Exact PR head SHA from sealed selection evidence.","required":true,"type":"string"}},"output":"UI evidence requests processed."}}
          GH_AW_SAFE_OUTPUTS_CONFIG_3159a0aabb966d50_EOF
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {},
              "repo_params": {},
              "dynamic_tools": [
                {
                  "description": "Post one validated UI evidence report if the PR still points at the measured head.",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "body": {
                        "description": "Complete Markdown UI evidence report.",
                        "type": "string"
                      }
                    },
                    "required": [
                      "body"
                    ],
                    "type": "object"
                  },
                  "name": "post_ui_evidence_report"
                },
                {
                  "description": "Queue and ingest all trusted UI evidence requests. Call exactly once on an initial ready run and never on a follow-up or dry-run.",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "expected_head_sha": {
                        "description": "Exact PR head SHA from sealed selection evidence.",
                        "type": "string"
                      }
                    },
                    "required": [
                      "expected_head_sha"
                    ],
                    "type": "object"
                  },
                  "name": "run_ui_evidence"
                }
              ]
            }
          GH_AW_VALIDATION_JSON: |
            {
              "missing_data": {
                "defaultMax": 20,
                "fields": {
                  "alternatives": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "context": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "data_type": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 128
                  },
                  "reason": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  }
                }
              },
              "missing_tool": {
                "defaultMax": 20,
                "fields": {
                  "alternatives": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 512
                  },
                  "reason": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 256
                  },
                  "tool": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 128
                  }
                }
              },
              "noop": {
                "defaultMax": 1,
                "fields": {
                  "message": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  }
                }
              },
              "report_incomplete": {
                "defaultMax": 5,
                "fields": {
                  "details": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "reason": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 1024
                  }
                }
              }
            }
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/generate_safe_outputs_tools.cjs');
            await main();
      - name: Start MCP Gateway
        id: start-mcp-gateway
        env:
          GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST: ${{ vars.GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST || 'true' }}
          GH_AW_SAFE_OUTPUTS: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS }}
          GH_AW_SAFE_OUTPUTS_CONFIG_PATH: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS_CONFIG_PATH }}
          GH_AW_SAFE_OUTPUTS_TOOLS_PATH: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS_TOOLS_PATH }}
          GH_AW_SINK_VISIBILITY: ${{ steps.determine-automatic-lockdown.outputs.visibility }}
          GITHUB_MCP_GUARD_MIN_INTEGRITY: ${{ steps.determine-automatic-lockdown.outputs.min_integrity }}
          GITHUB_MCP_GUARD_REPOS: ${{ steps.determine-automatic-lockdown.outputs.repos }}
          GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          mkdir -p "${RUNNER_TEMP}/gh-aw/mcp-config"

          # Export gateway environment variables for MCP config and gateway script
          export MCP_GATEWAY_PORT="8080"
          export MCP_GATEWAY_DOMAIN="awmg-mcpg"
          export MCP_GATEWAY_HOST_DOMAIN="localhost"
          MCP_GATEWAY_API_KEY=$(openssl rand -base64 45 | tr -d '/+=')
          echo "::add-mask::${MCP_GATEWAY_API_KEY}"
          export MCP_GATEWAY_API_KEY
          export MCP_GATEWAY_PAYLOAD_DIR="/tmp/gh-aw/mcp-payloads"
          mkdir -p "${MCP_GATEWAY_PAYLOAD_DIR}"
          export MCP_GATEWAY_PAYLOAD_SIZE_THRESHOLD="524288"
          export MCP_GATEWAY_ALLOWED_MOUNT_ROOTS="${GITHUB_WORKSPACE}:rw,${RUNNER_TEMP}/gh-aw:ro,${RUNNER_TEMP}/gh-aw/safeoutputs:rw,/opt:ro,/tmp:rw,/usr/bin/gh:ro"
          export DEBUG="*"

          export GH_AW_ENGINE="copilot"
          MCP_GATEWAY_UID=$(id -u 2>/dev/null || echo '0')
