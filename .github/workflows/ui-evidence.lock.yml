    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      evidence_run_id:
        default: 0
        description: Trusted source run containing completed UI evidence
        required: false
        type: number
      pr_number:
        description: PR number to analyze
        required: false
        type: number
      suppress_output:
        default: false
        description: "Dry-run: analyze fully but post or queue nothing"
        required: false
        type: boolean

permissions: {}

concurrency:
  cancel-in-progress: false
  group: ui-evidence-${{ github.event.issue.number || inputs.pr_number || github.run_id }}

run-name: "UI Evidence - dotnet/maui"

