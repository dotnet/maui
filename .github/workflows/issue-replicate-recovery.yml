name: Issue Replicate Recovery

on:
  schedule:
    - cron: '*/10 * * * *'

permissions: {}

concurrency:
  group: issue-replicate-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'dotnet/maui' &&
      vars.ISSUE_REPLICATE_RECOVERY_NOT_BEFORE != '' &&
      vars.ISSUE_REPLICATE_RECOVERY_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Recover missed commands from the trusted default branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOT_BEFORE: ${{ vars.ISSUE_REPLICATE_RECOVERY_NOT_BEFORE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $start = [datetimeoffset]::ParseExact(
            $env:NOT_BEFORE, 'yyyy-MM-ddTHH:mm:ssZ',
            [cultureinfo]::InvariantCulture)
          & ./.github/scripts/IssueReplicate.Recover.ps1 -NotBefore $start
          if ($LASTEXITCODE -ne 0) { throw 'Issue command recovery failed.' }
