    if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'submit_ci_scan')
    runs-on: ubuntu-latest
    environment: copilot-pat-pool
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download agent output artifact
        continue-on-error: true
