name: PR Review Queue

on:
  schedule:
    - cron: "0 8 * * 1-5"  # Weekdays at 8:00 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/pr-review-queue.yml'
      - '.github/workflows/rerun-review-scanner.md'
      - '.github/skills/find-reviewable-pr/**'
      - '.github/scripts/Query-AutoRerunCandidates.ps1'
      - '.github/scripts/RerunReviewScanner.Tests.mjs'
      - '.github/scripts/Resolve-RerunEligibility.ps1'
      - '.github/scripts/shared/Update-AgentLabels.ps1'

permissions:
  contents: read

concurrency:
  group: pr-review-queue-${{ github.event_name }}-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # Guard: only run in dotnet/maui — prevents the scheduled run from firing
    # in forks and pinging fork owners with duplicate queue issues.
    if: github.repository_owner == 'dotnet' && github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      repository-projects: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate PR review queue
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pwsh .github/skills/find-reviewable-pr/scripts/query-reviewable-prs.ps1 \
            -Category all \
            -OutputFormat markdown \
            > pr-review-queue-raw.md 2>pr-query-errors.txt
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            echo "::error::Query script failed"
            cat pr-query-errors.txt
            exit 1
          fi

          # Strip Write-Host progress lines — keep only markdown
          sed -n '/^<!-- PR_REVIEW_QUEUE_BEGIN -->/,$p' pr-review-queue-raw.md > pr-review-queue-body.md

          if [ ! -s pr-review-queue-body.md ]; then
            echo "::error::Query produced empty output"
            cat pr-query-errors.txt
            exit 1
          fi

          echo "Generated report:"
          head -20 pr-review-queue-body.md

      - name: Close previous queue issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo ${{ github.repository }} \
            --search '"[PR Review Queue]" in:title' \
            --state open \
            --json number \
            --jq '.[].number' | \
          xargs -I{} gh issue close {} --repo ${{ github.repository }} --reason "not planned" 2>/dev/null || true

      - name: Create queue issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "[PR Review Queue] $(date -u '+%Y-%m-%d')" \
            --body-file pr-review-queue-body.md \
            --label "report" \
            --label "s/triaged"

      # Autonomously apply s/agent-ready-for-rerun to PRs with genuinely new
      # PR-author activity since their last AI review — the same deterministic
      # signal as a maintainer's `/review rerun`. The hourly rerun-review-scanner
      # then picks these up and re-reviews them. The script tolerates isolated
      # per-PR evaluation failures, but systemic/query/label failures fail this
      # step after the queue issue above has already been created.
      - name: Auto-label rerun-ready PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          pwsh .github/scripts/Query-AutoRerunCandidates.ps1 \
            -Owner "$REPO_OWNER" \
            -Repo "$REPO_NAME" \
            -OutputPath auto-rerun-decisions.json

      - name: Upload auto-rerun decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-rerun-decisions
          path: auto-rerun-decisions.json
          if-no-files-found: warn
          retention-days: 7

  # Validate PR-controlled scripts without exposing a workflow token to them.
  validate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dotnet' && github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester -RequiredVersion 5.9.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Validate queue scripts without GitHub credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $parseTargets = @(
            '.github/skills/find-reviewable-pr/scripts/query-reviewable-prs.ps1'
            '.github/scripts/Query-AutoRerunCandidates.ps1'
            '.github/scripts/Query-RerunReadyPRs.ps1'
            '.github/scripts/Resolve-RerunEligibility.ps1'
            '.github/scripts/shared/Update-AgentLabels.ps1'
          )
          foreach ($path in $parseTargets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failed for ${path}: $($errors.Message -join '; ')"
            }
          }

          Import-Module Pester -RequiredVersion 5.9.0
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            '.github/scripts/Query-ReviewablePRs.Tests.ps1'
            '.github/scripts/Invoke-RerunReviewTrigger.Tests.ps1'
            '.github/scripts/Query-AutoRerunCandidates.Tests.ps1'
            '.github/scripts/Query-RerunReadyPRs.Tests.ps1'
            '.github/scripts/Resolve-RerunEligibility.Tests.ps1'
            '.github/scripts/shared/Update-AgentLabels.Tests.ps1'
          )
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
          if ($result.TotalCount -lt 1) {
            throw 'Pester discovered no queue validation tests.'
          }

          & node --test '.github/scripts/RerunReviewScanner.Tests.mjs'
          if ($LASTEXITCODE -ne 0) {
            throw "Executable rerun scanner tests failed with exit code $LASTEXITCODE."
          }
