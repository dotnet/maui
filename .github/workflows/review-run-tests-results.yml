name: Review run-tests results

# Refreshes the results section of `/review run-tests` comments once the selected
# Azure DevOps runs progress. Runs trusted default-branch scripts only and never
# checks out PR code.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Refresh only this pull request'
        required: false
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: review-run-tests-results
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'dotnet/maui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Refresh selected-test results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          $pr = 0
          if ($env:PR_NUMBER -and -not [int]::TryParse($env:PR_NUMBER, [ref]$pr)) { throw 'pr_number must be numeric.' }
          ./.github/scripts/Update-SelectedPRTestsResults.ps1 -PrNumber $pr
