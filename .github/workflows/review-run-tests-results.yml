# Updates `/review run-tests` comments when their maui-pr-uitests build finishes.
# Azure Pipelines reports the result as checks on the PR itself; this keeps the
# comment's Result badge and per-job table in sync with it.

name: Review run-tests results

on:
  check_run:
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      head_sha:
        description: Only update comments for this PR head SHA (optional)
        required: false

permissions:
  contents: read

concurrency:
  group: review-run-tests-results-${{ github.event.check_run.head_sha || 'sweep' }}
  cancel-in-progress: false

jobs:
  update:
    # check_run fires for every check; only the overall maui-pr-uitests check matters.
    if: >-
      github.repository_owner == 'dotnet' &&
      (github.event_name != 'check_run' ||
       (github.event.check_run.name == 'maui-pr-uitests' && github.event.check_run.app.slug == 'azure-pipelines'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Update run-tests comments
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha || inputs.head_sha }}
        shell: pwsh
        run: |
          $arguments = @{}
          if ($env:HEAD_SHA) { $arguments.HeadSha = $env:HEAD_SHA }
          ./.github/scripts/Update-RunTestsResults.ps1 @arguments
