name: Prepare published release versions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-published-versions
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'dotnet/maui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify publication and prepare metadata commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/scripts/Sync-ReleasePublishedVersions.ps1 -OutputDirectory '${{ runner.temp }}/published-versions'

      - name: Preserve pending housekeeping
        uses: actions/upload-artifact@v4
        with:
          name: published-version-housekeeping-${{ github.run_id }}
          path: ${{ runner.temp }}/published-versions/
          if-no-files-found: error
