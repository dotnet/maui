name: Release Agent Human Approval

# Configure "Release Agent Human Approval / Require human approval" as a
# required status check on protected targets to make this gate unbypassable.
on:
  # This workflow never checks out or executes pull-request code. Using the
  # trusted base context prevents a PR from weakening its own approval gate.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  human-approval:
    name: Require human approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine durable release-agent applicability
        id: applicability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TRACKING_LABEL: release-agent-human-approval
        run: |
          set -euo pipefail

          timeline="$RUNNER_TEMP/timeline.json"
          current_labels="$RUNNER_TEMP/current-labels.json"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/issues/$PULL_REQUEST/timeline?per_page=100" |
            jq -s 'add // []' > "$timeline"

          current_signal=false
          if [[ "$PULL_REQUEST_HEAD_REF" == release-agent/* ||
                "$PULL_REQUEST_HEAD_REF" == backport/pr-* ||
                "$PULL_REQUEST_BODY" == *'<!-- release-readiness-agent: human-approval-required -->'* ]]; then
            current_signal=true
          fi

          trusted_tracking=false
          if jq -e --arg label "$TRACKING_LABEL" '
            any(.[];
              .event == "labeled" and
              .label.name == $label and
              .actor.login == "github-actions[bot]")
          ' "$timeline" >/dev/null; then
            trusted_tracking=true
          fi

          if [ "$current_signal" != true ] && [ "$trusted_tracking" != true ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Release-agent human approval is not applicable to this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! gh api "repos/$REPOSITORY/labels/$TRACKING_LABEL" >/dev/null 2>&1; then
            echo "::error::Required repository label '$TRACKING_LABEL' is missing; an administrator must pre-create it."
            exit 1
          fi

          gh api --paginate \
            "repos/$REPOSITORY/issues/$PULL_REQUEST/labels?per_page=100" |
            jq -s 'add // []' > "$current_labels"
          if ! jq -e --arg label "$TRACKING_LABEL" \
            'any(.[]; .name == $label)' "$current_labels" >/dev/null; then
            gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST/labels" \
              -f "labels[]=$TRACKING_LABEL" >/dev/null
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Read reviews and trusted approval policy
        id: inputs
        if: steps.applicability.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          reviews="$RUNNER_TEMP/reviews.json"
          permissions="$RUNNER_TEMP/reviewer-permissions.json"
          policy="$RUNNER_TEMP/Assert-ReleaseAgentHumanApproval.ps1"

          gh api --paginate \
            "repos/$REPOSITORY/pulls/$PULL_REQUEST/reviews?per_page=100" |
            jq -s 'add // []' > "$reviews"

          printf '{}\n' > "$permissions"
          jq -r '
            .[]
            | select(
                (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED") and
                .user.type == "User" and
                (.author_association == "OWNER" or
                 .author_association == "MEMBER" or
                 .author_association == "COLLABORATOR"))
            | .user.login
          ' "$reviews" | sort -fu | while IFS= read -r login; do
            permission='none'
            if ! permission="$(gh api \
                "repos/$REPOSITORY/collaborators/$login/permission" \
                --jq '.permission' 2>/dev/null)"; then
              echo "::warning::Could not determine permission for reviewer '$login'; treating the reviewer as untrusted."
              permission='none'
            fi
            next_permissions="$RUNNER_TEMP/reviewer-permissions-next.json"
            jq \
              --arg login "${login,,}" \
              --arg permission "$permission" \
              '. + {($login): $permission}' \
              "$permissions" > "$next_permissions"
            mv "$next_permissions" "$permissions"
          done

          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/.github/skills/release-readiness/scripts/Assert-ReleaseAgentHumanApproval.ps1?ref=$DEFAULT_BRANCH" \
            > "$policy"

          {
            echo "reviews=$reviews"
            echo "permissions=$permissions"
            echo "policy=$policy"
          } >> "$GITHUB_OUTPUT"

      - name: Require two current human maintainer approvals
        if: steps.applicability.outputs.required == 'true'
        shell: bash
        env:
          REVIEWS_PATH: ${{ steps.inputs.outputs.reviews }}
          POLICY_PATH: ${{ steps.inputs.outputs.policy }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_PERMISSIONS_PATH: ${{ steps.inputs.outputs.permissions }}
        run: |
          set -euo pipefail

          result="$RUNNER_TEMP/human-approval.json"
          set +e
          pwsh -NoProfile -File "$POLICY_PATH" \
            -ReviewsJsonPath "$REVIEWS_PATH" \
            -ReviewerPermissionsJsonPath "$REVIEWER_PERMISSIONS_PATH" \
            -PullRequestAuthor "$PULL_REQUEST_AUTHOR" \
            -PullRequestHeadSha "$PULL_REQUEST_HEAD_SHA" \
            -RequiredApprovals 2 > "$result"
          status=$?
          set -e

          cat "$result"
          if jq -e '
              type == "object" and
              (.RequiredApprovals | type == "number") and
              (.Approvers | type == "array")
            ' "$result" >/dev/null 2>&1; then
            {
              echo "### Release-agent human approval"
              echo
              echo "- Required approvals: $(jq -r '.RequiredApprovals' "$result")"
              echo "- Qualified approvers: $(jq -r 'if (.Approvers | length) == 0 then "_none_" else (.Approvers | join(", ")) end' "$result")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The trusted approval policy did not emit valid result JSON (exit $status)."
            {
              echo "### Release-agent human approval"
              echo
              echo "The trusted approval policy did not emit a valid result."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -eq 0 ]; then
              status=1
            fi
          fi

          exit "$status"
